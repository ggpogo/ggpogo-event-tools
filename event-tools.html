<script type="text/babel" data-presets="react">
/** @jsxRuntime classic */
(function () {
  const { useState, useEffect, useRef, useMemo } = React;

  // ───────────────────────────────────────────────────────────
  // FIREBASE SETUP
  // ───────────────────────────────────────────────────────────
  const firebaseConfig = {
    apiKey: "AIzaSyAfReMKn_RFOxUhtpoqN_dKhavyuCzSgWE",
    authDomain: "ggpogo-tools-us.firebaseapp.com",
    databaseURL: "https://ggpogo-tools-us-default-rtdb.firebaseio.com",
    projectId: "ggpogo-tools-us",
    storageBucket: "ggpogo-tools-us.firebasestorage.app",
    messagingSenderId: "1075593279660",
    appId: "1:1075593279660:web:eed79b8025fb6b9143c709"
  };
  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  const auth = firebase.auth();
  const googleProvider = new firebase.auth.GoogleAuthProvider();

  // ───────────────────────────────────────────────────────────
  // DIAGNOSTICS — collects errors so the app can show *what*
  // went wrong instead of failing silently or going blank.
  // ───────────────────────────────────────────────────────────
  const diagnosticsListeners = new Set();
  const diagnosticsLog = [];
  function reportIssue(source, detail) {
    const entry = { time: new Date().toLocaleTimeString(), source, detail: String(detail ? (detail.message ? detail.message : detail) : detail) };
    diagnosticsLog.unshift(entry);
    if (diagnosticsLog.length > 20) diagnosticsLog.length = 20;
    diagnosticsListeners.forEach(fn => fn([...diagnosticsLog]));
  }
  function useDiagnostics() {
    const [log, setLog] = useState(() => [...diagnosticsLog]);
    useEffect(() => {
      diagnosticsListeners.add(setLog);
      return () => diagnosticsListeners.delete(setLog);
    }, []);
    return log;
  }

  const FB = {
    async get(path) {
      try { const s = await db.ref(path).once('value'); return s.val(); }
      catch (e) { console.error("get", path, e); reportIssue(`read ${path}`, e); return null; }
    },
    async set(path, val) {
      try { await db.ref(path).set(val); return true; }
      catch (e) { console.error("set", path, e); reportIssue(`write ${path}`, e); return false; }
    },
    // Atomic multi-path update (all-or-nothing), e.g. { 'cd:codes/abc/claimed': true, 'cd:codes/abc/claimedBy': 'Ash' }
    async update(updates) {
      try { await db.ref().update(updates); return true; }
      catch (e) { console.error("update", updates, e); reportIssue(`update ${Object.keys(updates).join(', ')}`, e); return false; }
    },
    async push(path, val) {
      try { const ref = db.ref(path).push(); await ref.set(val); return ref.key; }
      catch (e) { console.error("push", path, e); reportIssue(`push ${path}`, e); return null; }
    },
    async remove(path) {
      try { await db.ref(path).remove(); return true; }
      catch (e) { console.error("remove", path, e); reportIssue(`delete ${path}`, e); return false; }
    },
    watch(path, cb) {
      const ref = db.ref(path);
      ref.on('value', s => cb(s.val()), e => { console.error("watch", path, e); reportIssue(`listen ${path}`, e); });
      return () => ref.off('value');
    },
    // Atomic read-modify-write on a single node. `updateFn(currentVal) => nextVal`.
    // Return `undefined` from updateFn to abort without writing (Firebase will
    // not commit, and `committed` will be false). Firebase automatically
    // retries updateFn if the node changed since it was read, so this is safe
    // under concurrent writers — used for counters and "claim this node"
    // operations where many clients may race for the same path.
    // Returns { committed, snapshot } or null on error.
    async transact(path, updateFn) {
      try {
        const result = await db.ref(path).transaction(updateFn);
        return { committed: result.committed, snapshot: result.snapshot ? result.snapshot.val() : null };
      } catch (e) {
        console.error("transact", path, e);
        reportIssue(`transact ${path}`, e);
        return null;
      }
    },
  };

  function genId() { return Math.random().toString(36).slice(2, 10); }

  // ───────────────────────────────────────────────────────────
  // PASSPORT — constants, geolocation, and Pokemon icon lookup.
  // ───────────────────────────────────────────────────────────

  // Default check-in location: Garden Grove Park, 9301 Westminster Blvd.
  // Hosts can override per-session; this is only the pre-filled default.
  const DEFAULT_EVENT_LOCATION = { lat: 33.7620, lng: -117.9672, label: "Garden Grove Park" };
  const CHECKIN_RADIUS_METERS = 600;

  // Event types shared with the public Events page categories (see
  // events-sections-v2.4.html) so passport badge grouping uses the same
  // names attendees already recognize. "communityDay" and "specialEvent"
  // always award a named badge automatically; other types are host-toggled
  // in Passport Settings (settings:passport.badgeTypesEnabled).
  const EVENT_TYPES = [
    { id: "communityDay", label: "Community day", color: "grassMid", colorDeep: "grassDeep", alwaysNamed: true },
    { id: "specialEvent", label: "Special events", color: "orange", colorDeep: "orangeDeep", alwaysNamed: true },
    { id: "raidHour", label: "Raid hour", color: "blue", colorDeep: "blueDeep", alwaysNamed: false },
    { id: "custom", label: "Custom event", color: "purple", colorDeep: "purpleDeep", alwaysNamed: false },
  ];
  function eventTypeInfo(typeId) { return EVENT_TYPES.find(t => t.id === typeId) || EVENT_TYPES[3]; }

  // Haversine distance in meters between two lat/lng points. Used to gate
  // the self check-in button to within CHECKIN_RADIUS_METERS of the
  // session's location.
  function distanceMeters(lat1, lng1, lat2, lng2) {
    const R = 6371000;
    const toRad = (d) => (d * Math.PI) / 180;
    const dLat = toRad(lat2 - lat1);
    const dLng = toRad(lng2 - lng1);
    const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng / 2) ** 2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  }

  // Turns a display name into the icon repo's filename convention
  // (see ggpogo-pokemon-icons README): lowercase, spaces -> hyphens,
  // periods/apostrophes dropped, gender symbols -> -f/-m.
  function pokemonNameToFilename(name) {
    return name
      .trim()
      .toLowerCase()
      .replace(/♀/g, "-f")
      .replace(/♂/g, "-m")
      .replace(/['.]/g, "")
      .replace(/\s+/g, "-");
  }

  const POKEMON_ICON_BASE = "https://raw.githubusercontent.com/ggpogo/ggpogo-pokemon-icons/main/";
  const DEFAULT_BADGE_ICON = "https://ggpogo.com/wp-content/uploads/2026/05/icon-updated.png";

  function pokemonIconUrl(name) {
    if (!name || !name.trim()) return null;
    return POKEMON_ICON_BASE + pokemonNameToFilename(name) + ".png";
  }

  // Best-effort parse of a Pokemon name out of a free-text event name,
  // e.g. "Sobble Community Day" -> "Sobble". Takes the leading run of
  // capitalized word(s) before a known event-type keyword. This is a
  // convenience default only — hosts see and can override the detected
  // icon before starting the session (see PassportEventSetup), so a
  // wrong or missed guess just falls back to the GGPoGo logo rather
  // than showing an incorrect icon unreviewed.
  const EVENT_KEYWORD_SPLIT = /\b(community day|raid day|raid hour|spotlight hour|go fest|go tour|max battle day|event)\b/i;
  function guessPokemonNameFromEventName(eventName) {
    if (!eventName) return "";
    const parts = eventName.split(EVENT_KEYWORD_SPLIT);
    const lead = (parts[0] || "").trim();
    // Only treat it as a Pokemon guess if it's a short, plausible name
    // (avoids e.g. "Garden Grove Raid Hour" guessing "Garden Grove").
    if (!lead || lead.split(/\s+/).length > 2) return "";
    return lead;
  }

  // Best-effort guess of an EVENT_TYPES id from a Campfire event's title,
  // e.g. "Sobble Community Day" -> "communityDay". Same safety-net pattern
  // as the Pokemon icon guess: this only pre-selects the Event type
  // dropdown, which stays fully visible and editable, so a wrong or
  // missed guess just means the host picks the right one themselves —
  // never an incorrect type silently applied unreviewed.
  function guessEventTypeFromName(eventName) {
    if (!eventName) return null;
    const lower = eventName.toLowerCase();
    if (/community day/.test(lower)) return "communityDay";
    if (/raid hour/.test(lower)) return "raidHour";
    if (/raid day|go fest|go tour|max battle day|spotlight hour/.test(lower)) return "specialEvent";
    return null;
  }


  // Rotating claim token — v2.12.23 security fix. A static session ID in
  // the QR/link never expired for the life of the session, so a bookmarked
  // or forwarded link kept working for anyone, at any time, whether or not
  // they were physically present. This generates a short random token that
  // the host's live screen swaps on an interval; claim validation checks it
  // alongside the session ID (see CLAIM_TOKEN_TTL_MS). Not a security
  // secret — just short-lived enough that a screenshot goes stale fast.
  function newClaimToken() {
    if (window.crypto ? window.crypto.getRandomValues : false) {
      const bytes = window.crypto.getRandomValues(new Uint8Array(6));
      return Array.from(bytes, b => b.toString(16).padStart(2, "0")).join("");
    }
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }
  // Token rotation interval. 60s gives a host time to walk a new player
  // through scanning and tapping through without the code going stale
  // mid-explanation, while still making a screenshot worthless within
  // about two minutes (current token + one grace cycle).
  const CLAIM_TOKEN_TTL_MS = 60000;

  // Trigger a browser download of CSV rows (array of arrays) as a file.
  // Shared by Code Drop history, Giveaway history, and the combined
  // export-everything bundle on the Event Day dashboard.
  function downloadCsv(filename, rows) {
    const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(",")).join("\n");
    const blob = new Blob([csv], { type: "text/csv" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    a.click();
    URL.revokeObjectURL(url);
  }

  // Trigger a browser download of an object as a pretty-printed JSON file.
  function downloadJson(filename, data) {
    const json = JSON.stringify(data, null, 2);
    const blob = new Blob([json], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    a.click();
    URL.revokeObjectURL(url);
  }

  // Short, human-friendly verification code derived from a session id.
  // Shown on both the host's control panel and the attendee's win/reveal
  // screen so a screenshot from a past session is visibly mismatched if
  // someone tries to reuse it during a different live session.
  function sessionCode(id) {
    if (!id) return "----";
    return id.slice(0, 4).toUpperCase();
  }

  // Claim priority (v2.12.23 fix): codes were being handed out strictly in
  // the order they were entered, regardless of expiration. Adding a batch
  // expiring 8/01 after an existing batch expiring 10/01 meant the 10/01
  // codes got claimed first and the 8/01 batch was left racing the clock.
  // This sorts non-expiring codes (expiresAt null) last, then soonest
  // expiration first, then falls back to entry order as a tiebreaker for
  // codes that share (or lack) an expiration.
  function byClaimPriority(a, b) {
    const aExp = a.expiresAt || Infinity;
    const bExp = b.expiresAt || Infinity;
    if (aExp !== bExp) return aExp - bExp;
    return (a.order ?? 0) - (b.order ?? 0);
  }
  // ───────────────────────────────────────────────────────────
  // CLIENT IDENTITY — fixed after a live-event incident where the
  // original fingerprint() hashed broad device/browser traits
  // (user agent, language, screen size, timezone, etc.). At a local
  // meetup, attendees on the same phone model all generate identical
  // values for every one of those traits, so the hash collided —
  // the second person with an iPhone 15 was silently treated as the
  // first. fingerprint() now returns a random ID generated once per
  // browser and persisted in localStorage, with an in-memory fallback
  // for contexts where storage is blocked (private browsing, some
  // in-app browsers). The function name and "fp_" prefix are kept
  // so every existing call site (Code Drop claims, Giveaway entries,
  // the security rules' string-typed fp fields) needs no changes.
  // ───────────────────────────────────────────────────────────
  const CLIENT_ID_KEY = "ggpogo_client_id_v1";
  let memoryClientId = null;

  function getUsableStorage() {
    try {
      const testKey = "__ggpogo_storage_test__";
      localStorage.setItem(testKey, "1");
      localStorage.removeItem(testKey);
      return localStorage;
    } catch (e) { return null; }
  }

  function newClientId() {
    if (window.crypto ? window.crypto.randomUUID : false) { return "fp_" + window.crypto.randomUUID(); }
    if (window.crypto ? window.crypto.getRandomValues : false) {
      const bytes = window.crypto.getRandomValues(new Uint8Array(16));
      return "fp_" + Array.from(bytes, b => b.toString(16).padStart(2, "0")).join("");
    }
    // Last-resort fallback for very old browsers with neither API.
    return "fp_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2);
  }

  function fingerprint() {
    if (memoryClientId) return memoryClientId;
    const storage = getUsableStorage();
    if (storage) {
      let id = storage.getItem(CLIENT_ID_KEY);
      if (!id) { id = newClientId(); storage.setItem(CLIENT_ID_KEY, id); }
      memoryClientId = id;
      return id;
    }
    // No usable storage this page load — generate once and hold in memory.
    // Stable for this visit, but a refresh on a storage-blocked browser
    // will generate a new ID. Logged to diagnostics so a host can see if
    // this is happening often (e.g. a venue's locked-down kiosk browser).
    memoryClientId = newClientId();
    reportIssue("client id", "No usable storage — using memory-only client ID for this page load");
    return memoryClientId;
  }
  function nowTime() {
    return new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  }

  // Trainer name persistence — shared by CodeClaim and GiveawayClaim so a
  // name entered in one tool pre-fills in the other on the same device.
  // Plain localStorage (not Firebase): purely a per-device convenience,
  // never read or written by the host side. Wrapped in try/catch since
  // localStorage can throw in some embedded/private-browsing contexts.
  const TRAINER_NAME_KEY = "ggpogo_trainer_name";
  function getSavedTrainerName() {
    try { return localStorage.getItem(TRAINER_NAME_KEY) || ""; } catch (e) { return ""; }
  }
  function saveTrainerName(name) {
    try {
      if (name) { localStorage.setItem(TRAINER_NAME_KEY, name); } else { localStorage.removeItem(TRAINER_NAME_KEY); }
    } catch (e) { /* ignore — private browsing or storage disabled */ }
  }

  // ───────────────────────────────────────────────────────────
  // COMMUNITY AUTH — Google sign-in for attendees/community
  // members. Separate from host email/password auth. Community
  // profiles are stored at /users/{uid}/ in the Realtime DB.
  // ───────────────────────────────────────────────────────────
  const AGE_CONFIRMED_KEY = "ggpogo_age_confirmed";
  const GUEST_MODE_KEY = "ggpogo_guest_mode";
  const GUEST_NAME_KEY = "ggpogo_guest_name";
  const GUEST_BANNER_DISMISSED_KEY = "ggpogo_guest_banner_dismissed";

  function isAgeConfirmed() {
    try { return localStorage.getItem(AGE_CONFIRMED_KEY) === "1"; } catch (e) { return false; }
  }
  function setAgeConfirmed() {
    try { localStorage.setItem(AGE_CONFIRMED_KEY, "1"); } catch (e) { /* ignore */ }
  }
  function isGuestMode() {
    try { return localStorage.getItem(GUEST_MODE_KEY) === "1"; } catch (e) { return false; }
  }
  function setGuestMode(on) {
    try { if (on) localStorage.setItem(GUEST_MODE_KEY, "1"); else localStorage.removeItem(GUEST_MODE_KEY); } catch (e) { /* ignore */ }
  }
  function getGuestName() {
    try { return localStorage.getItem(GUEST_NAME_KEY) || ""; } catch (e) { return ""; }
  }
  function setGuestName(name) {
    try { if (name) localStorage.setItem(GUEST_NAME_KEY, name); else localStorage.removeItem(GUEST_NAME_KEY); } catch (e) { /* ignore */ }
  }
  function isGuestBannerDismissed() {
    try { return localStorage.getItem(GUEST_BANNER_DISMISSED_KEY) === "1"; } catch (e) { return false; }
  }
  function dismissGuestBanner() {
    try { localStorage.setItem(GUEST_BANNER_DISMISSED_KEY, "1"); } catch (e) { /* ignore */ }
  }

  // Check if a Firebase Auth user is a host by looking up /roles/hosts/{uid}
  // in the database. Returns a promise. Result is cached in-memory per uid
  // so repeated checks within a session don't re-read the database.
  const hostRoleCache = {};
  async function checkHostRole(uid) {
    if (!uid) return false;
    if (uid in hostRoleCache) return hostRoleCache[uid];
    const val = await FB.get(`roles/hosts/${uid}`);
    const result = val === true;
    hostRoleCache[uid] = result;
    return result;
  }

  // Create or update a community user profile in the database on first Google login.
  async function ensureCommunityProfile(user) {
    if (!user) return;
    const existing = await FB.get(`users/${user.uid}`);
    if (existing) {
      // Update last login
      await FB.set(`users/${user.uid}/lastLoginAt`, Date.now());
      return;
    }
    // First login — create profile
    await FB.set(`users/${user.uid}`, {
      displayName: user.displayName || "",
      email: user.email || "",
      photoURL: user.photoURL || "",
      ageConfirmed: true,
      createdAt: Date.now(),
      lastLoginAt: Date.now(),
    });
  }

  // Link this browser's random client id to the signed-in user profile.
  // Earlier builds wrote this to a global /migrations path, which caused
  // permission errors for normal attendees. Keeping the mapping under
  // /users/{uid}/linkedClientIds keeps it owned by that signed-in user
  // and avoids exposing attendee diagnostics during normal QR flows.
  async function migrateUuidToUid(uid) {
    const storage = getUsableStorage();
    if (!storage) return;
    const oldId = storage.getItem(CLIENT_ID_KEY);
    if (!oldId) return;
    const safeOldId = oldId.replace(/[.#$/[\]]/g, "_");

    const alreadyLinked = await FB.get(`users/${uid}/linkedClientIds/${safeOldId}`);
    if (alreadyLinked) return;

    const savedName = getSavedTrainerName();
    if (savedName) {
      const profile = await FB.get(`users/${uid}`);
      const hasTrainerName = profile ? !!profile.trainerName : false;
      if (!hasTrainerName) await FB.set(`users/${uid}/trainerName`, savedName);
    }

    await FB.set(`users/${uid}/linkedClientIds/${safeOldId}`, {
      linkedAt: Date.now(),
      clientId: oldId,
    });

    reportIssue("migration", `Linked device ${oldId.slice(0, 12)}... to account ${uid.slice(0, 8)}...`);
  }

  // 4-digit "raffle ticket" code for attendees who skip name entry in the
  // Giveaway. Not collision-checked against other entrants — it's a
  // verbal-callout aid for the host, not a uniqueness-critical ID, and a
  // duplicate among ~a few dozen entrants is an acceptable rare case.
  function genTicketLabel() {
    const n = Math.floor(1000 + Math.random() * 9000);
    return `Ticket #${n}`;
  }

  // Find the Campfire event from the cached list whose start time is
  // closest to `targetMs`. Returns `{id, name, time}` or null if no
  // events are within a 12-hour window. Used by the Code Drop and
  // Giveaway dashboards to auto-suggest which event a session belongs to.
  function findClosestEvent(cachedEvents, targetMs) {
    if (!cachedEvents || !cachedEvents.length) return null;
    const WINDOW_MS = 12 * 60 * 60 * 1000; // 12 hours
    let best = null;
    let bestDist = Infinity;
    cachedEvents.forEach(ev => {
      const t = new Date(ev.time).getTime();
      const dist = Math.abs(t - targetMs);
      if (dist < bestDist) { if (dist <= WINDOW_MS) { bestDist = dist; best = ev; } }
    });
    return best;
  }

  // Distinct from findClosestEvent above (which only matches within a
  // same-day 12hr window, meant for "link to the event happening right
  // now"). This instead finds the soonest event that hasn't happened
  // yet, with no time-window cap — the right default for a picker the
  // host opens ahead of an event, like Passport's session-start screen.
  function findNextUpcomingEvent(cachedEvents, targetMs) {
    if (!cachedEvents || !cachedEvents.length) return null;
    const upcoming = cachedEvents.filter(ev => new Date(ev.time).getTime() >= targetMs);
    if (!upcoming.length) return null;
    upcoming.sort((a, b) => new Date(a.time).getTime() - new Date(b.time).getTime());
    return upcoming[0];
  }

  // ───────────────────────────────────────────────────────────
  // CODES STORAGE — stored in Firebase as an object map keyed by
  // code id (required for per-item security rules), used in the
  // app as an array for easy filtering/rendering.
  // ───────────────────────────────────────────────────────────
  function codesObjToArray(obj) {
    if (!obj) return [];
    return Object.entries(obj).map(([id, v]) => ({
      id, value: v.value, claimed: !!v.claimed, claimedBy: v.claimedBy || null,
      order: typeof v.order === "number" ? v.order : 0,
      expiresAt: v.expiresAt || null, // ms timestamp, or null = never expires
      reward: v.reward || null, // human-readable label, e.g. "Elite Raid Pass"
      claimedAt: v.claimedAt || null, // ms timestamp when claimed
      addedAt: v.addedAt || null, // ms timestamp when the code was added (v2.12.24+; null for codes added before this field existed)
    }));
  }
  function codesArrayToObj(arr) {
    const obj = {};
    arr.forEach(x => {
      obj[x.id] = {
        value: x.value, claimed: !!x.claimed, claimedBy: x.claimedBy || null,
        order: typeof x.order === "number" ? x.order : 0,
        expiresAt: x.expiresAt || null,
        reward: x.reward || null,
        claimedAt: x.claimedAt || null,
        addedAt: x.addedAt || null,
      };
    });
    return obj;
  }
  // True if a code's expiration date has passed. Codes past expiry are
  // excluded from the attendee-facing pool and flagged in Manage Codes.
  function isExpired(code) {
    return code.expiresAt ? Date.now() > code.expiresAt : false;
  }

  // ───────────────────────────────────────────────────────────
  // PASSPORT STORAGE — object maps keyed by id (per-item security
  // rules, same reasoning as Code Drop), converted to arrays for
  // rendering. Same explicit-field-mapping discipline as
  // codesObjToArray/codesArrayToObj: any new field added to a
  // passport record MUST be added to both directions below or it
  // will be silently dropped on round-trip.
  // ───────────────────────────────────────────────────────────

  // A user's earned badges, stored at users/{uid}/passport/badges/{badgeId}.
  // Named badges snapshot their own label/icon/eventType/date AT EARN TIME —
  // deliberately, so that if a host later edits or deletes the source
  // pp:events/{eventId} record, badges already awarded are unaffected
  // (badges are permanent once earned, by design).
  function badgesObjToArray(obj) {
    if (!obj) return [];
    return Object.entries(obj).map(([id, v]) => ({
      id,
      kind: v.kind === "milestone" ? "milestone" : "named",
      label: v.label || "",
      iconUrl: v.iconUrl || DEFAULT_BADGE_ICON,
      eventType: v.eventType || null,
      earnedAt: v.earnedAt || null,
      threshold: typeof v.threshold === "number" ? v.threshold : null,
    }));
  }
  function badgesArrayToObj(arr) {
    const obj = {};
    arr.forEach(x => {
      obj[x.id] = {
        kind: x.kind === "milestone" ? "milestone" : "named",
        label: x.label || "",
        iconUrl: x.iconUrl || DEFAULT_BADGE_ICON,
        eventType: x.eventType || null,
        earnedAt: x.earnedAt || null,
        threshold: typeof x.threshold === "number" ? x.threshold : null,
      };
    });
    return obj;
  }

  // A user's check-in log, stored at users/{uid}/passport/checkIns/{eventId}.
  // Keyed by eventId (not push-key) so a repeat check-in attempt on the
  // same event is naturally idempotent — writing to the same key just
  // overwrites, never creates a duplicate or double-counts a milestone.
  function checkInsObjToArray(obj) {
    if (!obj) return [];
    return Object.entries(obj).map(([eventId, v]) => ({
      eventId,
      eventName: v.eventName || "",
      eventType: v.eventType || "custom",
      timestamp: v.timestamp || null,
      method: v.method === "host_manual" ? "host_manual" : "geo",
    }));
  }
  function checkInsArrayToObj(arr) {
    const obj = {};
    arr.forEach(x => {
      obj[x.eventId] = {
        eventName: x.eventName || "",
        eventType: x.eventType || "custom",
        timestamp: x.timestamp || null,
        method: x.method === "host_manual" ? "host_manual" : "geo",
      };
    });
    return obj;
  }
  // Attendee-side: claim ONE code via a transaction on that single node.
  // The security rule requires data.claimed == false at write time, so if
  // two attendees race for the SAME code node, the transaction for the
  // loser is rejected (committed: false) rather than silently overwriting —
  // the caller should then retry with the next candidate code.
  //
  // IMPORTANT: Firebase calls the update function with `current === null`
  // on its FIRST invocation if this client has no cached value for the
  // path (the common case for an unauthenticated attendee who's never
  // read this node before) — even though the node exists on the server.
  // Returning `undefined` means "abort immediately, no retry", so doing
  // that on a null `current` would abort EVERY claim attempt before
  // Firebase ever fetches the real value. We must return `null` in that
  // case so Firebase fetches the server value and calls us again with
  // the real data. Only abort (return undefined) once we've actually
  // seen real data and it shows the code is already claimed.
  async function claimCodeNode(codeId, claimedBy) {
    const result = await FB.transact(`cd:codes/${codeId}`, (current) => {
      if (current === null) return null; // no cached value yet — let Firebase fetch and retry
      if (current.claimed) return; // real data shows already claimed — abort, caller retries next candidate
      return { ...current, claimed: true, claimedBy, claimedAt: Date.now() };
    });
    if (!result) return { committed: false, conflict: false }; // network/error
    // A committed transaction that wrote `null` means the code node didn't
    // actually exist (deleted mid-claim, or a stale candidate) — treat as
    // a conflict so the caller moves on to the next candidate rather than
    // reporting success for a code that isn't really there.
    if (result.committed) { if (!result.snapshot) return { committed: false, conflict: true, snapshot: null }; }
    return { committed: result.committed, conflict: !result.committed, snapshot: result.snapshot };
  }
  async function unclaimCodeNode(codeId) {
    return FB.update({
      [`cd:codes/${codeId}/claimed`]: false,
      [`cd:codes/${codeId}/claimedBy`]: null,
      [`cd:codes/${codeId}/claimedAt`]: null,
    });
  }
  // Register this device's claim under cd:claims/$fp via a transaction.
  // The security rule requires !data.exists() — i.e. this is a write-once
  // node. A transaction makes "only write if empty" race-safe: if two taps
  // from the same device land concurrently, only one wins.
  async function registerClaim(fp, codeId) {
    const result = await FB.transact(`cd:claims/${fp}`, (current) => {
      if (current) return; // already claimed from this device — abort
      return codeId;
    });
    if (!result) return { committed: false };
    return { committed: result.committed, value: result.snapshot };
  }
  // Increment a numeric counter via transaction. Safe under concurrent
  // writers — Firebase retries updateFn against the latest server value.
  async function incrementCounter(path) {
    const result = await FB.transact(path, (current) => (typeof current === "number" ? current : 0) + 1);
    if (!result) return null;
    return result.snapshot;
  }
  // Decrement a numeric counter via transaction, floored at 0.
  async function decrementCounter(path) {
    const result = await FB.transact(path, (current) => Math.max(0, (typeof current === "number" ? current : 0) - 1));
    if (!result) return null;
    return result.snapshot;
  }
  // Session log is stored as a push()-keyed object so attendees can
  // append an entry without write access to sibling entries.
  function logObjToArray(obj) {
    if (!obj) return [];
    return Object.entries(obj).map(([key, v]) => ({ key, ...v }));
  }

  // Build a Map<eventId, number> from cd:history or gw:history entries.
  // For cd:history, count = claims.length per entry. For gw:history,
  // count = draws.length per entry. Entries with no eventId are skipped
  // (sessions not linked to a Campfire event). Multiple sessions linked
  // to the same event are summed together.
  function buildEventCountMap(historyEntries, countField) {
    const map = new Map();
    if (!historyEntries) return map;
    for (const entry of historyEntries) {
      if (!entry.eventId) continue;
      const items = entry[countField];
      const count = Array.isArray(items) ? items.length : 0;
      map.set(entry.eventId, (map.get(entry.eventId) || 0) + count);
    }
    return map;
  }

  // ───────────────────────────────────────────────────────────
  // GIVEAWAY STORAGE — object maps keyed by id, same pattern as
  // cd:codes, for per-item security rules.
  // ───────────────────────────────────────────────────────────
  function prizesObjToArray(obj) {
    if (!obj) return [];
    return Object.entries(obj).map(([id, v]) => ({
      id, name: v.name, quantity: v.quantity, remaining: v.remaining,
      type: v.type || "generic",           // generic | code | physical | special
      description: v.description || null,   // physical/special description
      delivery: v.delivery || null,         // special only: "code" | "physical"
    }));
  }
  function entrantsObjToArray(obj) {
    if (!obj) return [];
    return Object.entries(obj).map(([id, v]) => ({
      id, name: v.name, fp: v.fp || null, enteredAt: v.enteredAt, won: !!v.won,
      extraEntries: typeof v.extraEntries === "number" ? v.extraEntries : 0,
      // v2.13.8: winner's own "on my way" acknowledgment — see GiveawayClaim.
      onMyWay: !!v.onMyWay, onMyWayAt: v.onMyWayAt || null,
      // v2.13.8: uid + activityRecordId, needed by the HOST side
      // (confirmWinner/reroll) to patch this entrant's own My Activity
      // record — see updateProfileActivity. null for guests (no uid) or
      // entries recorded before this field existed.
      uid: v.uid || null, activityRecordId: v.activityRecordId || null,
    }));
  }

  // ───────────────────────────────────────────────────────────
  // MEETUP STATS — transforms raw Topi/Campfire Tools event JSON
  // (see https://cmpf-tools.de/api/docs) into per-event summaries,
  // matching the grain described in the engineering handoff:
  // "Event Summary" = 1 row per event, with RSVP/check-in counts,
  // Pacific date parts, and a dashboard-include flag that excludes
  // future/too-recent events from aggregate stats.
  // ───────────────────────────────────────────────────────────

  // How long after an event's start time it's considered "complete"
  // enough to safely include in aggregate stats (check-ins may still be
  // trickling in before this). Matches the handoff's EVENT_COMPLETE_BUFFER_HOURS.
  const EVENT_COMPLETE_BUFFER_HOURS = 2;

  // Convert a UTC ISO timestamp into Pacific-time date parts used for
  // grouping (year, month, quarter). Uses Intl so it correctly accounts
  // for DST without a date library.
  function getPacificDateParts(isoTime) {
    const d = new Date(isoTime);
    if (isNaN(d.getTime())) return { dateStr: null, year: null, month: null, quarter: null, yearQuarter: null, yearMonth: null };
    const parts = new Intl.DateTimeFormat("en-US", {
      timeZone: "America/Los_Angeles", year: "numeric", month: "2-digit", day: "2-digit",
    }).formatToParts(d);
    const get = (type) => parts.find(p => p.type === type)?.value;
    const year = Number(get("year"));
    const month = Number(get("month")); // 1-12
    const day = get("day");
    const quarter = Math.ceil(month / 3);
    const dateStr = `${year}-${String(month).padStart(2, "0")}-${day}`;
    const monthNames = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    return {
      dateStr, year, month,
      monthLabel: `${monthNames[month - 1]} ${year}`,
      quarter,
      yearQuarter: `${year} Q${quarter}`,
    };
  }

  // Transform one raw Topi event object into a summary row. `members` is
  // the array of { rsvp_status, id, ... } from the API response.
  function summarizeEvent(raw, nowMs = Date.now()) {
    const members = Array.isArray(raw.members) ? raw.members : [];
    let checkedIn = 0, accepted = 0, declined = 0, other = 0;
    const checkedInMemberIds = [];
    for (const m of members) {
      const status = m.rsvp_status;
      if (status === "CHECKED_IN") { checkedIn++; checkedInMemberIds.push(m.id); }
      else if (status === "ACCEPTED") accepted++;
      else if (status === "DECLINED") declined++;
      else other++;
    }
    const rsvpTotal = checkedIn + accepted;
    const checkInRate = rsvpTotal > 0 ? checkedIn / rsvpTotal : 0;

    const dateParts = getPacificDateParts(raw.time);
    const startMs = new Date(raw.time).getTime();
    const hoursSinceStart = isNaN(startMs) ? null : (nowMs - startMs) / (1000 * 60 * 60);

    let eventStatus, includeInDashboard;
    if (hoursSinceStart === null) {
      eventStatus = "Unknown"; includeInDashboard = false;
    } else if (hoursSinceStart < 0) {
      eventStatus = "Future"; includeInDashboard = false;
    } else if (hoursSinceStart < EVENT_COMPLETE_BUFFER_HOURS) {
      eventStatus = "Started Recently"; includeInDashboard = false;
    } else {
      eventStatus = "Complete"; includeInDashboard = true;
    }

    return {
      id: raw.id,
      name: raw.name || "Untitled Event",
      url: raw.url || null,
      timeUtc: raw.time || null,
      ...dateParts,
      eventStatus,
      includeInDashboard,
      hoursSinceStart,
      totalMembers: members.length,
      checkedIn, accepted, declined, other,
      rsvpTotal, checkInRate,
      checkedInMemberIds,
    };
  }

  // Build summaries for every event in a raw Topi API response.
  function summarizeEvents(rawEvents, nowMs = Date.now()) {
    if (!Array.isArray(rawEvents)) return [];
    return rawEvents.map(e => summarizeEvent(e, nowMs));
  }

  // Filter summaries to those flagged for dashboard inclusion AND within
  // an optional [fromDateStr, toDateStr] Pacific-date range (inclusive,
  // "YYYY-MM-DD" strings, either end optional).
  function filterEventsForRange(summaries, fromDateStr, toDateStr) {
    return summaries.filter(e => {
      if (!e.includeInDashboard || !e.dateStr) return false;
      if (fromDateStr) { if (e.dateStr < fromDateStr) return false; }
      if (toDateStr) { if (e.dateStr > toDateStr) return false; }
      return true;
    });
  }

  // Aggregate totals across a set of event summaries.
  function aggregateTotals(events) {
    const totalEvents = events.length;
    const totalCheckIns = events.reduce((s, e) => s + e.checkedIn, 0);
    const totalRsvps = events.reduce((s, e) => s + e.rsvpTotal, 0);
    const overallRate = totalRsvps > 0 ? totalCheckIns / totalRsvps : 0;
    const avgCheckIns = totalEvents > 0 ? totalCheckIns / totalEvents : 0;
    const avgRsvps = totalEvents > 0 ? totalRsvps / totalEvents : 0;
    return { totalEvents, totalCheckIns, totalRsvps, overallRate, avgCheckIns, avgRsvps };
  }

  // Group event summaries by a key function, producing one aggregate row
  // per group plus the group label, sorted by the group's sort key.
  function groupEvents(events, keyFn, labelFn, sortKeyFn) {
    const groups = new Map();
    for (const e of events) {
      const key = keyFn(e);
      if (key === null || key === undefined) continue;
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(e);
    }
    return Array.from(groups.entries())
      .map(([key, evs]) => ({ key, label: labelFn(evs[0], key), sortKey: sortKeyFn(evs[0], key), ...aggregateTotals(evs) }))
      .sort((a, b) => (a.sortKey < b.sortKey ? -1 : a.sortKey > b.sortKey ? 1 : 0));
  }

  // Repeat-attendee rate: for each event, what fraction of its checked-in
  // members also checked into at least one OTHER event in the same set.
  // Returns { perEvent: [{eventId, repeatRate, repeatCount, checkedIn}],
  //           overallRepeatRate, uniqueAttendees, totalCheckInRecords }.
  function computeRepeatAttendance(events) {
    // Count how many distinct events each member checked into.
    const memberEventCounts = new Map();
    let totalCheckInRecords = 0;
    for (const e of events) {
      for (const memberId of e.checkedInMemberIds) {
        memberEventCounts.set(memberId, (memberEventCounts.get(memberId) || 0) + 1);
        totalCheckInRecords++;
      }
    }
    const uniqueAttendees = memberEventCounts.size;
    let repeatRecords = 0;
    for (const count of memberEventCounts.values()) {
      if (count > 1) repeatRecords += count;
    }
    const overallRepeatRate = totalCheckInRecords > 0 ? repeatRecords / totalCheckInRecords : 0;

    const perEvent = events.map(e => {
      let repeatCount = 0;
      for (const memberId of e.checkedInMemberIds) {
        if ((memberEventCounts.get(memberId) || 0) > 1) repeatCount++;
      }
      return {
        eventId: e.id,
        checkedIn: e.checkedIn,
        repeatCount,
        repeatRate: e.checkedIn > 0 ? repeatCount / e.checkedIn : 0,
      };
    });

    return { perEvent, overallRepeatRate, uniqueAttendees, totalCheckInRecords };
  }

  // ───────────────────────────────────────────────────────────
  // DEFAULT COLORS / BRANDING
  // ───────────────────────────────────────────────────────────
  const DEFAULT_BRAND = {
    grassMid: "#7DC25C", grassDeep: "#3F8A36",
    paper: "#FFFCF2", paperDim: "#F5EFDC", paperEdge: "#E8DEC0",
    blue: "#1FA5DC", blueDeep: "#0E5C9E",
    orange: "#F08838", orangeDeep: "#C45A1F",
    strawberry: "#E84A3D", strawDeep: "#A82A20",
    sun: "#F5C842", sunDeep: "#C99520",
    purple: "#7B5BC9", purpleDeep: "#4B348C",
    ink: "#0D2D52", inkSoft: "#3D5B82", inkMute: "#7A8FA8",
    bgImage: "", // optional custom background image URL
    logoImage: "", // optional custom logo URL
  };

  // ───────────────────────────────────────────────────────────
  // SHARED UI PRIMITIVES (branding-aware)
  // ───────────────────────────────────────────────────────────
  function useBrand() {
    const [brand, setBrand] = useState(DEFAULT_BRAND);
    useEffect(() => {
      const unwatch = FB.watch("settings:branding", (val) => {
        setBrand({ ...DEFAULT_BRAND, ...(val || {}) });
      });
      return unwatch;
    }, []);

  }

  // ───────────────────────────────────────────────────────────

      case "chart":
        return <svg {...common}><path d="M3 3h2v18H3V3zm4 10h2v8H7v-8zm4-6h2v14h-2V7zm4 3h2v11h-2V10zm4-7h2v18h-2V3z"/></svg>;

  function StickerBtn({ children, onClick, fill, shadow, disabled, style = {}, small }) {
    const dis = disabled ? { opacity: 0.4, cursor: "not-allowed" } : {};
    return (
      <button
        onClick={disabled ? undefined : onClick}
        style={{
          display: "inline-block", background: fill, border: "3px solid #fff", borderRadius: 999,
          padding: small ? "8px 16px" : "12px 24px", color: "#fff", fontFamily: "Fredoka, sans-serif",
          fontWeight: 700, fontSize: small ? 13 : 15, letterSpacing: 0.5, outline: "none",

          cursor: disabled ? "not-allowed" : "pointer", ...dis, ...style,
        }}
      >

      </button>
    );
  }

  function Paper({ children, style = {}, accent, c }) {
    return (
      <div style={{
        background: c.paper, borderRadius: 22, padding: 20,
        boxShadow: `0 1px 0 ${c.paperEdge}, 0 2px 0 -1px ${c.paperEdge}, 0 12px 24px rgba(13, 45, 82, 0.12)`,
        position: "relative", borderTop: accent ? `5px solid ${accent}` : "none", ...style,
      }}>
        {children}
      </div>
    );
  }

  // ── Inline confirmation ──────────────────────────────────────
  // ConfirmModal is a stable top-level component (never re-created).
  // useConfirm returns state + handlers; callers render
  // <ConfirmModal confirmState={confirmState} onCancel={...} onConfirm={...} />
  function ConfirmModal({ confirmState, onCancel, onConfirm }) {
    if (!confirmState) return null;
    return (
      <div style={{ position: "fixed", inset: 0, background: "rgba(13,45,82,0.55)", zIndex: 9999, display: "flex", alignItems: "center", justifyContent: "center", padding: 24 }}>
        <div style={{ background: "#fff", borderRadius: 20, padding: "24px 22px", maxWidth: 320, width: "100%", boxShadow: "0 8px 32px rgba(13,45,82,0.22)", textAlign: "center" }}>
          <div style={{ fontSize: 15, fontWeight: 600, color: "#0D2D52", lineHeight: 1.5, marginBottom: 20 }}>{confirmState.message}</div>
          <div style={{ display: "flex", gap: 10, justifyContent: "center" }}>
            <StickerBtn fill="#E8E4DA" shadow="#C8C4BA" small onClick={onCancel} style={{ color: "#0D2D52" }}>Cancel</StickerBtn>
            <StickerBtn fill="#E05A5A" shadow="#B03A3A" small onClick={onConfirm}>Confirm</StickerBtn>
          </div>
        </div>
      </div>
    );
  }

  function useConfirm() {
    const [confirmState, setConfirmState] = useState(null);
    const requestConfirm = (message, onConfirm) => setConfirmState({ message, onConfirm });
    const handleCancel = () => setConfirmState(null);
    const handleConfirm = () => {
      if (confirmState) confirmState.onConfirm();
      setConfirmState(null);
    };
    return { confirmState, requestConfirm, handleCancel, handleConfirm };
  }

  function QR({ data, size = 180 }) {
    // Build the query string with URLSearchParams instead of a template
    // literal with literal ampersand separators — avoids any risk of
    // WordPress's content filters mangling ampersand characters in this script.
    const params = new URLSearchParams({
      size: `${size}x${size}`,
      data: data,
      bgcolor: "FFFCF2",
      color: "0D2D52",
      format: "svg",
      margin: "2",
    });
    const url = `https://api.qrserver.com/v1/create-qr-code/?${params.toString()}`;
    return <img src={url} width={size} height={size} alt="QR" style={{ display: "block" }} />;
  }

  function IconBox({ emoji, bg, border, size = 64, fontSize = 32 }) {
    return (
      <div style={{ width: size, height: size, background: bg, borderRadius: size * 0.3, border: "3px solid #fff", boxShadow: `0 0 0 2px ${border}, 0 3px 0 ${border}`, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0, fontSize }}>{emoji}</div>
    );
  }

  function BackButton({ onClick, c }) {
    return (
      <button onClick={onClick} style={{ background: "transparent", border: "none", cursor: "pointer", padding: 8 }}>
        <div style={{ width: 40, height: 40, background: "#fff", borderRadius: 12, border: "3px solid #fff", boxShadow: `0 0 0 2px ${c.blueDeep}, 0 3px 0 ${c.blueDeep}`, display: "flex", alignItems: "center", justifyContent: "center", color: c.ink, flexShrink: 0, fontSize: 18 }}>←</div>
      </button>
    );
  }

  // ───────────────────────────────────────────────────────────
  // HOME
  // ───────────────────────────────────────────────────────────
  function Home({ setView, c, isHost, authUser, communityMode, onGoogleSignIn, onGuestMode, onSignOut, authBusy, authError, profileTrainerName }) {
    if (isHost) { if (authUser) return <EventDayDashboard setView={setView} c={c} user={authUser} />; }
    return <AttendeeHome setView={setView} c={c}
      authUser={authUser} communityMode={communityMode}
      onGoogleSignIn={onGoogleSignIn} onGuestMode={onGuestMode}
      onSignOut={onSignOut} authBusy={authBusy} authError={authError}
      profileTrainerName={profileTrainerName}
    />;
  }

  // ───────────────────────────────────────────────────────────
  // EVENT DAY DASHBOARD — the host's landing view once logged in.
  // Shows live status for Code Drop and Giveaway (active/idle, codes
  // remaining, prizes/entrants) so the host can see what's happening
  // at a glance without navigating into each tool, plus quick links
  // to Branding and Meetup Stats.
  // ───────────────────────────────────────────────────────────
  function EventDayDashboard({ setView, c, user }) {
    const [cdSession, setCdSession] = useState(undefined);
    const [codes, setCodes] = useState([]);
    const [gwSession, setGwSession] = useState(undefined);
    const [prizes, setPrizes] = useState([]);
    const [entrantCount, setEntrantCount] = useState(0);
    const [ppSession, setPpSession] = useState(undefined);
    const [ppCheckInLog, setPpCheckInLog] = useState([]);
    const [lastCdSession, setLastCdSession] = useState(null); // most recent history entry
    const [lastGwSession, setLastGwSession] = useState(null);
    const [lastEvent, setLastEvent] = useState(null);
    const [dashCodeMap, setDashCodeMap] = useState(new Map());
    const [dashPrizeMap, setDashPrizeMap] = useState(new Map());

    useEffect(() => {
      // One-time read of cached events to build the "last event" card
      (async () => {
        const cache = await FB.get("stats:cache");
        if (cache) { if (cache.events) {
          const sums = summarizeEvents(cache.events);
          const completed = sums.filter(e => e.includeInDashboard);
          completed.sort((a, b) => new Date(b.timeUtc).getTime() - new Date(a.timeUtc).getTime());
          if (completed.length) setLastEvent(completed[0]);
        } }
      })();
      return undefined;
    }, []);

    useEffect(() => {
      const unwatchers = [
        FB.watch("cd:session", setCdSession),
        FB.watch("cd:codes", (val) => setCodes(codesObjToArray(val))),
        FB.watch("gw:session", setGwSession),
        FB.watch("gw:prizes", (val) => setPrizes(prizesObjToArray(val))),
        FB.watch("gw:entrants", (val) => setEntrantCount(val ? Object.keys(val).length : 0)),
        FB.watch("pp:session", setPpSession),
        FB.watch("pp:checkInLog", (val) => setPpCheckInLog(val ? Object.values(val) : [])),
        FB.watch("cd:history", (val) => {
          if (!val) { setLastCdSession(null); setDashCodeMap(new Map()); return; }
          const entries = Object.values(val);
          entries.sort((a, b) => (b.startedAt || 0) - (a.startedAt || 0));
          setLastCdSession(entries[0] || null);
          setDashCodeMap(buildEventCountMap(entries, "claims"));
        }),
        FB.watch("gw:history", (val) => {
          if (!val) { setLastGwSession(null); setDashPrizeMap(new Map()); return; }
          const entries = Object.values(val);
          entries.sort((a, b) => (b.startedAt || 0) - (a.startedAt || 0));
          setLastGwSession(entries[0] || null);
          setDashPrizeMap(buildEventCountMap(entries, "draws"));
        }),
      ];
      return () => unwatchers.forEach(u => u());
    }, []);

    const loading = cdSession === undefined || gwSession === undefined || ppSession === undefined;
    const [exporting, setExporting] = useState(false);

    // Export everything: pulls all-time Code Drop history, Giveaway
    // history, and Meetup Stats (cached events + saved snapshots), and
    // triggers three downloads — a CSV for each tool's history (same
    // format as their individual "export all" buttons) plus one JSON
    // file for stats. Useful as a one-click backup or hand-off to a
    // co-organizer.
    const exportEverything = async () => {
      setExporting(true);
      try {
        const dateTag = new Date().toISOString().slice(0, 10);

        // Code Drop history -> CSV
        const cdHistoryRaw = await FB.get("cd:history");
        const cdHistory = cdHistoryRaw ? Object.values(cdHistoryRaw) : [];
        if (cdHistory.length) {
          const rows = [["Session Date", "Event", "Name", "Code", "Reward", "Time"]];
          cdHistory.forEach(h => {
            const dateLabel = new Date(h.startedAt).toLocaleDateString();
            (h.claims || []).forEach(cl => rows.push([dateLabel, h.eventName || "", cl.name, cl.code, cl.reward || "", new Date(cl.time).toLocaleString()]));
          });
          downloadCsv(`codedrop-history-all-${dateTag}.csv`, rows);
        }

        // Giveaway history -> CSV
        const gwHistoryRaw = await FB.get("gw:history");
        const gwHistory = gwHistoryRaw ? Object.values(gwHistoryRaw) : [];
        if (gwHistory.length) {
          const rows = [["Giveaway Date", "Event", "Winner", "Prize", "Type", "Code", "Code Reward", "Time"]];
          gwHistory.forEach(h => {
            const dateLabel = new Date(h.startedAt).toLocaleDateString();
            (h.draws || []).forEach(d => rows.push([dateLabel, h.eventName || "", d.name, d.prizeName, d.prizeType || "generic", d.code || "", d.codeReward || "", new Date(d.time).toLocaleString()]));
          });
          downloadCsv(`giveaway-history-all-${dateTag}.csv`, rows);
        }

        // Meetup Stats (cached events + saved snapshots) -> JSON
        const statsCache = await FB.get("stats:cache");
        const snapshotsRaw = await FB.get("stats:snapshots");
        const snapshots = snapshotsRaw ? Object.entries(snapshotsRaw).map(([id, v]) => ({ id, ...v })) : [];
        if (statsCache || snapshots.length) {
          downloadJson(`meetup-stats-${dateTag}.json`, {
            exportedAt: new Date().toISOString(),
            cachedEvents: statsCache ? statsCache.events || [] : [],
            cacheLastFetched: statsCache ? statsCache.fetchedAt || null : null,
            snapshots,
          });
        }

        const exportedAnything = cdHistory.length > 0 || gwHistory.length > 0 || !!statsCache || snapshots.length > 0;
        if (!exportedAnything) {
          alert("No data to export yet — nothing has been saved in Code Drop, Giveaway, or Meetup Stats.");
        }
      } finally {
        setExporting(false);
      }
    };

    // Code Drop status
    const unusedCodes = codes.filter(x => !x.claimed ? !isExpired(x) : !x.claimed);
    const cdActive = !!cdSession;
    const cdPaused = cdActive ? !!cdSession.paused : false;
    const cdClaimed = cdActive ? (cdSession.claimedCount || 0) : 0;

    // Giveaway status
    const gwActive = !!gwSession;
    const prizesReady = prizes.reduce((sum, p) => sum + (p.remaining ?? p.quantity ?? 0), 0);
    const showLastGw = !!lastGwSession ? !gwActive : false;

    // Passport status
    const ppActive = !!ppSession;
    const ppCheckInCount = ppCheckInLog.length;

    return (
      <div style={{ maxWidth: 460, margin: "0 auto" }}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 20 }}>
          <div>
            <div style={{ fontWeight: 700, fontSize: 24, color: "#fff", textShadow: "0 2px 4px rgba(0,0,0,0.25)", lineHeight: 1.1 }}>Event Day</div>
            <div style={{ fontSize: 13, color: c.grassMid, fontWeight: 600, marginTop: 2 }}>{user.email}</div>
          </div>
          <button onClick={() => auth.signOut()} style={{ background: "transparent", border: "none", color: "#fff", fontSize: 12, fontWeight: 700, cursor: "pointer", textDecoration: "underline", textShadow: "0 1px 2px rgba(0,0,0,0.2)" }}>
            Sign out
          </button>
        </div>

        {loading ? <CenterMsg c={c} text="Loading…" /> : (
          <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
            {/* ─── Code Drop status ─── */}
            <Paper c={c} accent={c.blue} style={{ padding: "18px 20px" }}>
              <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 12 }}>
                <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                  <IconBox emoji="📦" bg={c.blue + "33"} border={c.blueDeep} size={40} fontSize={20} />
                  <div style={{ fontWeight: 700, fontSize: 18, color: c.ink }}>Code Drop</div>
                </div>
                <StatusPill c={c} active={cdActive} paused={cdPaused} />
              </div>
              {cdActive ? (
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 12 }}>
                  <div style={{ background: c.paperDim, borderRadius: 12, padding: "10px 14px" }}>
                    <div style={{ fontSize: 11, color: c.inkMute, fontWeight: 700, letterSpacing: 0.5 }}>CLAIMED</div>
                    <div style={{ fontSize: 24, fontWeight: 700, color: c.ink, lineHeight: 1.3 }}>{cdClaimed}</div>
                  </div>
                  <div style={{ background: c.paperDim, borderRadius: 12, padding: "10px 14px" }}>
                    <div style={{ fontSize: 11, color: c.inkMute, fontWeight: 700, letterSpacing: 0.5 }}>REMAINING</div>
                    <div style={{ fontSize: 24, fontWeight: 700, color: c.ink, lineHeight: 1.3 }}>{unusedCodes.length}</div>
                  </div>
                </div>
              ) : (
                <>
                  <div style={{ fontSize: 13, color: c.inkMute, marginBottom: lastCdSession ? 6 : 12 }}>{unusedCodes.length} code{unusedCodes.length !== 1 ? 's' : ''} ready to go.</div>
                  {lastCdSession ? (
                    <div style={{ fontSize: 11, color: c.inkMute, marginBottom: 12, padding: "6px 10px", background: c.paperDim, borderRadius: 8 }}>
                      Last session: <strong style={{ color: c.inkSoft }}>{(lastCdSession.claims || []).length} code{(lastCdSession.claims || []).length !== 1 ? 's' : ''} claimed</strong>{lastCdSession.startedAt ? ` · ${new Date(lastCdSession.startedAt).toLocaleDateString()}` : ""}
                    </div>
                  ) : null}
                </>
              )}
              <StickerBtn fill={c.blue} shadow={c.blueDeep} onClick={() => setView("codedrop")} style={{ width: "100%", display: "inline-flex", alignItems: "center", justifyContent: "center", gap: 8 }}>
                {cdActive ? (<><Icon name="play" size={16} /> Open session</>) : (<><Icon name="folder" size={16} /> Code Drop</>)}
              </StickerBtn>
            </Paper>

            {/* ─── Giveaway status ─── */}
            <Paper c={c} accent={c.strawberry} style={{ padding: "18px 20px" }}>
              <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 12 }}>
                <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                  <IconBox emoji="🎁" bg={c.strawberry + "33"} border={c.strawDeep} size={40} fontSize={20} />
                  <div style={{ fontWeight: 700, fontSize: 18, color: c.ink }}>Giveaway</div>
                </div>
                <StatusPill c={c} active={gwActive} paused={false} />
              </div>
              <div style={{ fontSize: 13, color: c.inkMute, marginBottom: showLastGw ? 6 : 12 }}>
                {prizes.length} prize{prizes.length !== 1 ? 's' : ''} ({prizesReady} remaining){gwActive ? ` · ${entrantCount} entrant${entrantCount !== 1 ? 's' : ''}` : ""}
              </div>
              {showLastGw ? (
                <div style={{ fontSize: 11, color: c.inkMute, marginBottom: 12, padding: "6px 10px", background: c.paperDim, borderRadius: 8 }}>
                  Last session: <strong style={{ color: c.inkSoft }}>{(lastGwSession.draws || []).length} prize{(lastGwSession.draws || []).length !== 1 ? 's' : ''} drawn</strong>{lastGwSession.startedAt ? ` · ${new Date(lastGwSession.startedAt).toLocaleDateString()}` : ""}
                </div>
              ) : null}
              <StickerBtn fill={c.strawberry} shadow={c.strawDeep} onClick={() => setView("giveaway")} style={{ width: "100%", display: "inline-flex", alignItems: "center", justifyContent: "center", gap: 8 }}>
                {gwActive ? (<><Icon name="play" size={16} /> Open session</>) : (<><Icon name="gift" size={16} /> Giveaway</>)}
              </StickerBtn>
            </Paper>

            {/* ─── Passport status ─── */}
            <Paper c={c} accent={c.purple} style={{ padding: "18px 20px" }}>
              <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 12 }}>
                <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                  <IconBox emoji="🎫" bg={c.purple + "33"} border={c.purpleDeep} size={40} fontSize={20} />
                  <div style={{ fontWeight: 700, fontSize: 18, color: c.ink }}>Passport</div>
                </div>
                <StatusPill c={c} active={ppActive} paused={false} />
              </div>
              <div style={{ fontSize: 13, color: c.inkMute, marginBottom: 12 }}>
                {ppActive ? `${ppCheckInCount} check-in${ppCheckInCount !== 1 ? 's' : ''} so far` : "Self check-in with badges"}
              </div>
              <StickerBtn fill={c.purple} shadow={c.purpleDeep} onClick={() => setView("passport")} style={{ width: "100%", display: "inline-flex", alignItems: "center", justifyContent: "center", gap: 8 }}>
                {ppActive ? (<><Icon name="play" size={16} /> Open session</>) : (<><Icon name="add" size={16} /> Start check-in</>)}
              </StickerBtn>
            </Paper>

            {/* ─── Last Event Stats ─── */}
            {lastEvent ? (
              <LastEventStatsCard c={c} event={lastEvent} codeCountMap={dashCodeMap} prizeCountMap={dashPrizeMap} compact />
            ) : null}

            {/* ─── Quick links ─── */}
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 12 }}>
              <div onClick={() => setView("branding")} style={{ cursor: "pointer" }}>
                <Paper c={c} accent={c.sun} style={{ padding: "14px 10px", textAlign: "center" }}>
                  <IconBox emoji="🎨" bg={c.sun + "33"} border={c.sunDeep} size={36} fontSize={18} />
                  <div style={{ fontWeight: 700, fontSize: 12, color: c.ink, marginTop: 8 }}>Branding</div>
                </Paper>
              </div>
              <div onClick={() => setView("stats")} style={{ cursor: "pointer" }}>
                <Paper c={c} accent={c.grassMid} style={{ padding: "14px 10px", textAlign: "center" }}>
                  <IconBox emoji="📊" bg={c.grassMid + "33"} border={c.grassDeep} size={36} fontSize={18} />
                  <div style={{ fontWeight: 700, fontSize: 12, color: c.ink, marginTop: 8 }}>Meetup Stats</div>
                </Paper>
              </div>
              <div onClick={() => setView("passportsettings")} style={{ cursor: "pointer" }}>
                <Paper c={c} accent={c.purple} style={{ padding: "14px 10px", textAlign: "center" }}>
                  <IconBox emoji="🏅" bg={c.purple + "33"} border={c.purpleDeep} size={36} fontSize={18} />
                  <div style={{ fontWeight: 700, fontSize: 12, color: c.ink, marginTop: 8 }}>Passport settings</div>
                </Paper>
              </div>
            </div>

            {/* ─── Export everything ─── */}
            <StickerBtn fill={c.paperDim} shadow={c.paperEdge} onClick={exportEverything} disabled={exporting} style={{ color: c.ink, width: "100%", display: "inline-flex", alignItems: "center", justifyContent: "center", gap: 8 }}>
              <Icon name="download" size={15} /> {exporting ? "Exporting…" : "Export everything"}
            </StickerBtn>
            <div style={{ fontSize: 11, color: c.inkMute, textAlign: "center", lineHeight: 1.5, marginTop: -8 }}>
              Downloads all Code Drop and Giveaway history, plus Meetup Stats snapshots, as separate files.
            </div>
          </div>
        )}
      </div>
    );
  }

  // Small status pill: Live (green), Paused (amber), or Idle (gray).
  function StatusPill({ c, active, paused }) {
    if (!active) return (
      <div style={{ background: c.paperDim, color: c.inkMute, fontSize: 11, fontWeight: 700, letterSpacing: 0.5, padding: "4px 10px", borderRadius: 8 }}>IDLE</div>
    );
    if (paused) return (
      <div style={{ background: c.sun + "33", color: c.sunDeep, fontSize: 11, fontWeight: 700, letterSpacing: 0.5, padding: "4px 10px", borderRadius: 8, display: "flex", alignItems: "center", gap: 5 }}>
        <Icon name="pause" size={11} /> PAUSED
      </div>
    );
    return (
      <div style={{ background: c.grassMid + "33", color: c.grassDeep, fontSize: 11, fontWeight: 700, letterSpacing: 0.5, padding: "4px 10px", borderRadius: 8, display: "flex", alignItems: "center", gap: 5 }}>
        <Icon name="play" size={11} /> LIVE
      </div>
    );
  }

  // ───────────────────────────────────────────────────────────
  // TRAINER NAME CHOOSER — shown once after first Google sign-in
  // if the user's profile has no trainerName yet.
  // ───────────────────────────────────────────────────────────
  function TrainerNameChooser({ c, authUser, onSave, onSkip }) {
    const [name, setName] = useState("");
    const [saving, setSaving] = useState(false);

    const handleSave = async () => {
      const trimmed = name.trim();
      if (!trimmed) return;
      setSaving(true);
      await rememberTrainerNameForProfile(authUser, trimmed);
      saveTrainerName(trimmed);
      setSaving(false);
      onSave(trimmed);
    };

    return (
      <div style={{ maxWidth: 400, margin: "0 auto", paddingTop: 40 }}>
        <Paper c={c} accent={c.blue} style={{ textAlign: "center", padding: "28px 22px" }}>
          <div style={{ marginBottom: 14, display: "flex", justifyContent: "center" }}>
            <img src="https://ggpogo.com/wp-content/uploads/2026/05/logo-no-text.png" alt="Garden Grove PoGo" style={{ width: 72, height: 72, objectFit: "contain" }} />
          </div>
          <h2 style={{ fontFamily: "Fredoka, sans-serif", fontSize: 20, fontWeight: 700, color: c.ink, marginBottom: 8 }}>Choose your trainer name</h2>
          <p style={{ color: c.inkSoft, fontSize: 13, lineHeight: 1.5, marginBottom: 18 }}>
            This is the public name the host will use at meetups — like for giveaway callouts. It can be your in-game name or anything you like.
          </p>
          <div style={{ textAlign: "left", marginBottom: 6 }}>
            <label style={{ fontSize: 12, fontWeight: 700, color: c.inkSoft }}>Public trainer name</label>
          </div>
          <input
            value={name}
            onChange={e => setName(e.target.value)}
            onKeyDown={e => { if (e.key === "Enter") handleSave(); }}
            placeholder="e.g. AshK"
            maxLength={32}
            style={{ textAlign: "left", fontSize: 16, marginBottom: 18, width: "100%", boxSizing: "border-box" }}
          />
          <StickerBtn fill={c.blue} shadow={c.blueDeep} disabled={!name.trim() || saving} onClick={handleSave} style={{ width: "100%", fontSize: 16, padding: 14, marginBottom: 14 }}>
            {saving ? "Saving…" : "Save & continue"}
          </StickerBtn>
          <button onClick={onSkip} style={{
            background: "transparent", border: "none", color: c.inkMute, fontSize: 12,
            fontFamily: "Fredoka, sans-serif", fontWeight: 600, cursor: "pointer",
            textDecoration: "underline", padding: 6,
          }}>Skip for now</button>
          <p style={{ color: c.inkMute, fontSize: 11, marginTop: 14, lineHeight: 1.4 }}>
            You can change this later. Your Google account info stays private.
          </p>
          <div style={{ fontSize: 10, color: c.inkMute, marginTop: 6 }}>
            <a href="/privacy-policy/" target="_blank" rel="noopener noreferrer" style={{ color: c.blue, fontWeight: 700 }}>Privacy Policy</a>
          </div>
        </Paper>
      </div>
    );
  }

  // ───────────────────────────────────────────────────────────
  // AGE GATE — shown once before first Google sign-in.
  // ───────────────────────────────────────────────────────────
  function AgeGate({ c, onConfirm, onCancel }) {
    return (
      <div style={{ maxWidth: 400, margin: "0 auto", paddingTop: 40 }}>
        <Paper c={c} accent={c.blue} style={{ textAlign: "center", padding: "28px 22px" }}>
          <div style={{ marginBottom: 14, display: "flex", justifyContent: "center" }}>
            <img src="https://ggpogo.com/wp-content/uploads/2026/05/logo-no-text.png" alt="Garden Grove PoGo" style={{ width: 72, height: 72, objectFit: "contain" }} />
          </div>
          <h2 style={{ fontFamily: "Fredoka, sans-serif", fontSize: 20, fontWeight: 700, color: c.ink, marginBottom: 10 }}>Age Confirmation</h2>
          <p style={{ color: c.inkSoft, fontSize: 14, lineHeight: 1.6, marginBottom: 8 }}>
            You must be <strong>13 years or older</strong> to create an account with Garden Grove PoGo.
          </p>
          <p style={{ color: c.inkMute, fontSize: 12, lineHeight: 1.5, marginBottom: 22 }}>
            This matches the age requirement for Pokemon GO and helps us comply with privacy laws that protect younger users.
          </p>
          <StickerBtn fill={c.blue} shadow={c.blueDeep} onClick={onConfirm} style={{ width: "100%", padding: 14, marginBottom: 10 }}>
            I confirm I am 13 or older
          </StickerBtn>
          <button onClick={onCancel} style={{
            background: "transparent", border: "none", color: c.inkMute, fontSize: 13,
            fontFamily: "Fredoka, sans-serif", fontWeight: 600, cursor: "pointer", padding: "8px 16px",
          }}>
            Go back
          </button>

  // ───────────────────────────────────────────────────────────

  function GuestBanner({ c, onSignIn }) {
    const [dismissed, setDismissed] = useState(isGuestBannerDismissed);

    return (
      <div style={{
        background: c.sun + "22", border: `2px solid ${c.sun}`, borderRadius: 14,
        padding: "10px 14px", marginBottom: 14, display: "flex", alignItems: "center", gap: 10,

          </div>

  // ───────────────────────────────────────────────────────────
  // ACTIVITY HISTORY — signed-in user's check-in history.
  // Reads codeClaims and giveawayEntries from the user's
  // profile activity, merges into a single timeline.
  // ───────────────────────────────────────────────────────────
  function ActivityHistory({ c, authUser, setView }) {
    const [items, setItems] = useState([]);
    const [loading, setLoading] = useState(true);

    useEffect(() => {
      if (!authUser) return;
      (async () => {
        const merged = [];
        try {
          const claims = await FB.get(`users/${authUser.uid}/activity/codeClaims`);
          if (claims) {
            Object.entries(claims).forEach(([id, v]) => {
              merged.push({
                id, type: "code",
                time: v.claimedAt || v.recordedAt || 0,
                code: v.code || null,
                reward: v.reward || null,
                eventName: v.eventName || null,
                displayName: v.displayName || null,
              });
            });
          }
        } catch (e) { reportIssue("activity:codeClaims", e); }
        try {
          const entries = await FB.get(`users/${authUser.uid}/activity/giveawayEntries`);
          if (entries) {
            Object.entries(entries).forEach(([id, v]) => {
              merged.push({
                id, type: "giveaway",
                time: v.enteredAt || v.recordedAt || 0,
                eventName: v.eventName || null,
                displayName: v.displayName || null,
                // v2.13.8: status-aware fields patched in later by
                // updateProfileActivity (confirmWinner/reroll). Missing
                // on pre-v2.13.8 records — falls back to plain "Entered".
                status: v.status || "entered",
                prizeName: v.prizeName || null,
                claimedAt: v.claimedAt || null,
                pickedAt: v.pickedAt || null,
              });
            });
          }
        } catch (e) { reportIssue("activity:giveawayEntries", e); }
        merged.sort((a, b) => b.time - a.time);
        setItems(merged);
        setLoading(false);
      })();
    }, [authUser ? authUser.uid : null]);

    // Group items by calendar date
    const grouped = useMemo(() => {
      const groups = [];
      let currentLabel = null;
      items.forEach(item => {
        const d = new Date(item.time);
        const label = d.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
        if (label !== currentLabel) {
          groups.push({ label, items: [] });
          currentLabel = label;
        }
        groups[groups.length - 1].items.push(item);
      });
      return groups;
    }, [items]);

    return (
      <div style={{ maxWidth: 460, margin: "0 auto" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 20 }}>
          <BackButton c={c} onClick={() => setView("home")} />
          <div style={{ flex: 1 }}>
            <div style={{ fontWeight: 700, fontSize: 22, color: "#fff", textShadow: "0 2px 4px rgba(0,0,0,0.25)", lineHeight: 1.1 }}>My Activity</div>
            <div style={{ fontSize: 13, color: c.blue, fontWeight: 600, marginTop: 2 }}>Check-in History</div>
          </div>
        </div>

        {loading ? <CenterMsg c={c} text="Loading..." /> : items.length === 0 ? (
          <Paper c={c} style={{ textAlign: "center", padding: "32px 22px" }}>
            <div style={{ fontSize: 28, lineHeight: 1, marginBottom: 12 }}>📋</div>
            <div style={{ fontWeight: 700, fontSize: 16, color: c.ink, marginBottom: 6 }}>No activity yet</div>
            <div style={{ fontSize: 13, color: c.inkSoft, lineHeight: 1.5 }}>
              Claim a code or enter a giveaway at a meetup to get started!
            </div>
          </Paper>
        ) : (
          <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
            {grouped.map(group => (
              <div key={group.label}>
                <div style={{ fontSize: 12, fontWeight: 700, color: "rgba(255,255,255,0.7)", letterSpacing: 1, marginBottom: 8, textTransform: "uppercase" }}>{group.label}</div>
                <Paper c={c} style={{ padding: "6px 0" }}>
                  {group.items.map((item, i) => {
                    let isClaimedGiveaway = false;
                    if (item.type === "giveaway") {
                      if (item.status === "claimed") isClaimedGiveaway = true;
                    }
                    let isPickedNotClaimed = false;
                    if (item.type === "giveaway") {
                      if (item.status === "picked_not_claimed") isPickedNotClaimed = true;
                    }
                    return (
                    <div key={item.id} style={{
                      display: "flex", alignItems: "flex-start", gap: 12,
                      padding: "12px 16px",
                      borderTop: i > 0 ? `1.5px dashed ${c.paperEdge}` : "none",
                    }}>
                      <div style={{
                        width: 36, height: 36, borderRadius: "50%", flexShrink: 0,
                        background: item.type === "code" ? c.blue + "22" : c.orange + "22",
                        display: "flex", alignItems: "center", justifyContent: "center",
                        fontSize: 15, lineHeight: 1, overflow: "hidden", marginTop: 2,
                      }}>
                        {item.type === "code" ? "🎟️" : "🎰"}
                      </div>
                      <div style={{ flex: 1, minWidth: 0 }}>
                        <div style={{ fontWeight: 700, fontSize: 14, color: c.ink, lineHeight: 1.3 }}>
                          {item.type === "code" ? "Code Drop" : "Giveaway Entry"}
                        </div>
                        {isClaimedGiveaway ? (
                          <div style={{ fontSize: 12, color: c.blue, fontWeight: 700, marginTop: 2 }}>
                            Claimed {item.prizeName || "prize"} {"\u0040"} {new Date(item.claimedAt || item.time).toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" })}
                          </div>
                        ) : isPickedNotClaimed ? (
                          <div style={{ fontSize: 12, color: c.inkSoft, fontWeight: 700, marginTop: 2 }}>
                            Picked as winner {"\u0040"} {new Date(item.pickedAt || item.time).toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" })}, did not claim
                          </div>
                        ) : null}
                        {item.eventName ? (
                          <div style={{ fontSize: 12, color: c.inkSoft, fontWeight: 600, marginTop: 2, display: "flex", alignItems: "center", gap: 4 }}>
                            <Icon name="star" size={10} /> {item.eventName}
                          </div>
                        ) : null}
                        {item.type === "code" ? (
                          <div style={{ marginTop: 6, background: c.paperDim, borderRadius: 8, padding: "6px 10px", display: "inline-block" }}>
                            <span style={{ fontFamily: "monospace", fontSize: 13, color: c.ink, fontWeight: 600, wordBreak: "break-all" }}>{item.code || "---"}</span>
                            {item.reward ? <span style={{ display: "block", fontSize: 11, color: c.inkMute, fontWeight: 600, marginTop: 2 }}>{item.reward}</span> : null}
                          </div>
                        ) : null}
                        <div style={{ fontSize: 11, color: c.inkMute, marginTop: 4 }}>
                          {new Date(item.time).toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" })}
                        </div>
                      </div>
                    </div>
                  ))}
                </Paper>
              </div>
            ))}
          </div>
        )}
      </div>
    );
  }

            <svg width="16" height="16" viewBox="0 0 24 24" style={{ flexShrink: 0 }}>
              <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/>
              <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
              <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18A10.96 10.96 0 0 0 1 12c0 1.78.43 3.47 1.18 4.93l3.66-2.84z"/>
              <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
            </svg>
            <Icon name="trophy" size={16} /> {authBusy ? "Signing in…" : "Log in to earn a badge!"}

        <div style={{ fontSize: 10, color: c.inkMute, textAlign: "center", marginTop: 8 }}>

        </div>
