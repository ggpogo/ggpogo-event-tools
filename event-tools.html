        <Paper c={c} accent={c.blue} style={{ textAlign: "center", marginBottom: 16, padding: "24px 20px" }}>
          <div style={{ display: "inline-block", background: c.blueDeep, color: "#fff", padding: "6px 16px", borderRadius: 10, border: "2px solid #fff", boxShadow: `0 0 0 1.5px ${c.blueDeep}, 0 2px 0 ${c.blueDeep}`, fontSize: 13, fontWeight: 700, letterSpacing: 1.5, marginBottom: 18 }}>
            {limitReached ? "Session limit reached" : "Scan to claim code"}
          </div>
          <div style={{ display: "flex", justifyContent: "center", marginBottom: 16 }}>
            <div style={{ background: "#fff", padding: 12, borderRadius: 18, border: `3px solid ${c.paperEdge}` }}>
              <QR data={link} size={fullscreen ? 240 : 180} />
            </div>
          </div>
          <StickerBtn fill={c.paperDim} shadow={c.paperEdge} small onClick={() => setFullscreen(!fullscreen)} style={{ color: c.ink, display: "inline-flex", alignItems: "center", justifyContent: "center", gap: 6 }}>
            {fullscreen ? <><Icon name="collapse" size={13} /> Smaller</> : <><Icon name="expand" size={13} /> Bigger</>}
          </StickerBtn>
        </Paper>

        <div style={{ display: "grid", gridTemplateColumns: session.limitEnabled ? "1fr 1fr 1fr" : "1fr 1fr", gap: 10, marginBottom: 16 }}>
          <Paper c={c} style={{ padding: "12px", textAlign: "center" }}>
            <div style={{ fontSize: 26, fontWeight: 700, color: lowStock ? c.strawberry : c.ink, lineHeight: 1 }}>{unused.length}</div>
            <div style={{ fontSize: 10, color: c.inkMute, letterSpacing: 1, fontWeight: 700, marginTop: 4 }}>UNUSED</div>
          </Paper>
          <Paper c={c} style={{ padding: "12px", textAlign: "center" }}>
            <div style={{ fontSize: 26, fontWeight: 700, color: c.ink, lineHeight: 1 }}>{claimedThisSession}</div>
            <div style={{ fontSize: 10, color: c.inkMute, letterSpacing: 1, fontWeight: 700, marginTop: 4 }}>THIS SESSION</div>
          </Paper>
          {session.limitEnabled ? (
            <Paper c={c} style={{ padding: "12px", textAlign: "center" }}>
              <div style={{ fontSize: 26, fontWeight: 700, color: c.ink, lineHeight: 1 }}>{claimedThisSession}/{session.limitValue}</div>
              <div style={{ fontSize: 10, color: c.inkMute, letterSpacing: 1, fontWeight: 700, marginTop: 4 }}>SESSION CAP</div>
            </Paper>
          ) : null}
        </div>

        {lowStock ? (
          <div style={{ textAlign: "center", marginBottom: 12, padding: "8px 12px", background: "#fff", borderRadius: 12, color: c.strawDeep, fontWeight: 700, fontSize: 12, border: `2px solid ${c.strawberry}`, display: "flex", alignItems: "center", justifyContent: "center", gap: 6 }}>
            <Icon name="warning" size={13} /> Only {unused.length} code{unused.length !== 1 ? 's' : ''} left in the pool
          </div>
        ) : null}

        <div style={{ display: "flex", gap: 10, marginBottom: 16 }}>
          <StickerBtn fill={session.paused ? c.grassMid : c.sun} shadow={session.paused ? c.grassDeep : c.sunDeep} onClick={togglePause} style={{ flex: 1, color: session.paused ? "#fff" : c.ink, display: "inline-flex", alignItems: "center", justifyContent: "center", gap: 6 }}>
            {session.paused ? <><Icon name="play" size={14} /> Resume</> : <><Icon name="pause" size={14} /> Pause</>}
          </StickerBtn>
          <StickerBtn fill={c.purple} shadow={c.purpleDeep} onClick={claimManualCode} disabled={manualClaiming} style={{ flex: 1, display: "inline-flex", alignItems: "center", justifyContent: "center", gap: 6 }}>
            <Icon name="gift" size={14} /> {manualClaiming ? "Claiming..." : "Manual"}
          </StickerBtn>
          <StickerBtn fill={c.strawberry} shadow={c.strawDeep} onClick={endSession} disabled={ending} style={{ flex: 1, display: "inline-flex", alignItems: "center", justifyContent: "center", gap: 6 }}>
            <Icon name="stop" size={14} /> {ending ? "Ending..." : "End"}
          </StickerBtn>
        </div>

        {manualError ? (
          <div style={{ textAlign: "center", marginBottom: 12, padding: "8px 12px", background: "#fff", borderRadius: 12, color: c.strawDeep, fontWeight: 700, fontSize: 12, border: `2px solid ${c.strawberry}`, display: "flex", alignItems: "center", justifyContent: "center", gap: 6 }}>
            <Icon name="warning" size={13} /> {manualError}
          </div>
        ) : null}

        {endError ? (
          <div style={{ textAlign: "center", marginBottom: 12, padding: "8px 12px", background: "#fff", borderRadius: 12, color: c.strawDeep, fontWeight: 700, fontSize: 12, border: `2px solid ${c.strawberry}` }}>
            {endError}
          </div>
        ) : null}

        <Paper c={c}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
            <div style={{ fontWeight: 700, fontSize: 14, color: c.ink }}>Recently claimed</div>
            {claimedThisSession > 0 ? <StickerBtn fill={c.paperDim} shadow={c.paperEdge} small onClick={undoLast} style={{ color: c.ink, display: "inline-flex", alignItems: "center", justifyContent: "center", gap: 6 }}><Icon name="undo" size={12} /> Undo last</StickerBtn> : null}
          </div>
          {claimedList.length === 0 ? (
            <div style={{ textAlign: "center", color: c.inkMute, fontSize: 13, padding: "10px 0" }}>Waiting for first scan…</div>
          ) : (
            <div style={{ display: "flex", flexDirection: "column", gap: 6, maxHeight: 200, overflowY: "auto" }}>
              {claimedList.slice(0, 15).map(x => (
                <div key={x.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "8px 12px", background: c.paperDim, borderRadius: 10, fontSize: 14 }}>
                  <span style={{ fontWeight: 600, color: c.ink }}>
                    {x.claimedBy || "—"}
                    {x.reward ? <span style={{ display: "block", fontSize: 11, color: c.inkMute, fontWeight: 600 }}>{x.reward}</span> : null}
                  </span>
                  <span style={{ fontFamily: "monospace", color: c.inkMute, fontSize: 12 }}>{x.value.length > 16 ? x.value.slice(0, 14) + "…" : x.value}</span>
                </div>
              ))}
            </div>
          )}
        </Paper>
      </div>
    );
  }

  // ───────────────────────────────────────────────────────────
  // ATTENDEE CLAIM PAGE (public, no auth)
  // ───────────────────────────────────────────────────────────
  function CodeClaim({ c, sessionId, claimToken, authUser, onGoogleSignIn, onSignOut, authBusy, authError }) {
    const [stage, setStage] = useState("loading");
    const [name, setName] = useState(() => getSavedTrainerName());
    const [myCode, setMyCode] = useState(null);
    const [myReward, setMyReward] = useState(null);
    const fp = fingerprint();

    // Token check (v2.12.23): accepts the current or immediately-previous
    // token so a scan landing right as the host's QR rotates still works.
    // A session with no claimToken at all (shouldn't happen post-2.12.23,
    // but guards any session started on an older version mid-upgrade)
    // is treated as valid rather than locking attendees out.
    const tokenValid = (sess) => {
      if (!sess.claimToken) return true;
      if (!claimToken) return false;
      return claimToken === sess.claimToken || claimToken === sess.prevClaimToken;
    };

    const check = async () => {
      const sess = await FB.get("cd:session");
      if (!sess || sess.id !== sessionId) return setStage("nosession");
      if (!tokenValid(sess)) return setStage("staletoken");
      if (sess.paused) return setStage("paused");
      if (sess.limitEnabled) { if ((sess.claimedCount || 0) >= sess.limitValue) return setStage("limitreached"); }
      // Read this device's own claim entry directly — cd:claims/$fp is readable
      // by anyone, but the cd:claims parent node is not, so we must not read
      // the whole map (that silently returns null/undefined for attendees,
      // which previously let a refresh bypass the one-code-per-device limit).
      const myClaim = await FB.get(`cd:claims/${fp}`);
      if (myClaim) {
        const cs = codesObjToArray(await FB.get("cd:codes"));
        const mine = cs.find(x => x.id === myClaim);
        if (mine) { setMyCode(mine.value); setMyReward(mine.reward || null); return setStage("reveal"); }
      }
      setStage("name");
    };

    useEffect(() => { check(); }, []);

    useEffect(() => {
      let alive = true;
      const hasName = !!name.trim();
      if (!authUser) return undefined;
      if (hasName) return undefined;
      (async () => {
        const profileName = await loadSavedProfileTrainerName(authUser);
        if (alive) { if (profileName) setName(profileName); }
      })();
      return () => { alive = false; };
    }, [authUser ? authUser.uid : null]);

    const claim = async () => {
      // v2.12.23: one button, one path. A blank name has always been
      // allowed to fall through to Anonymous/Signed-in Trainer below —
      // there's no separate "anonymous" action anymore, just an empty
      // optional field.
      const trimmed = name.trim();
      const claimName = trimmed || (authUser ? "Signed-in Trainer" : "Anonymous");
      const sess = await FB.get("cd:session");
      if (!sess || sess.id !== sessionId) return setStage("nosession");
      if (!tokenValid(sess)) return setStage("staletoken");
      if (sess.paused) return setStage("paused");
      if (sess.limitEnabled) { if ((sess.claimedCount || 0) >= sess.limitValue) return setStage("limitreached"); }

      // Same fix as check(): read this device's own claim entry directly.
      const myClaim2 = await FB.get(`cd:claims/${fp}`);
      if (myClaim2) {
        const cs0 = codesObjToArray(await FB.get("cd:codes"));
        const mine = cs0.find(x => x.id === myClaim2);
        if (mine) { setMyCode(mine.value); setMyReward(mine.reward || null); return setStage("reveal"); }
      }

      // Try candidates in order (oldest/non-expired first). If a candidate
      // loses a race to another attendee, its transaction is rejected
      // (committed: false) and we move on to the next candidate — so a
      // collision shows up as "try the next code", not an error screen.
      const cs = codesObjToArray(await FB.get("cd:codes"));
      const candidates = cs.filter(x => !x.claimed ? !isExpired(x) : !x.claimed).sort(byClaimPriority);
      if (!candidates.length) return setStage("empty");

      let claimedPick = null;
      for (const candidate of candidates) {
        const { committed, conflict } = await claimCodeNode(candidate.id, claimName);
        if (committed) { claimedPick = candidate; break; }
        if (!conflict) {
          // Real error (network/permission), not a race — stop and surface it.
          return setStage("claimerror");
        }
        // conflict === true: someone else claimed this one a moment ago.
        // Loop continues to the next candidate.
      }
      if (!claimedPick) {
        // Every candidate lost its race. Re-check: are we actually out of
        // codes now, or just very unlucky? Either way, tell the attendee
        // to try again rather than a hard "empty" — codes may still remain.
        const fresh = codesObjToArray(await FB.get("cd:codes"));
        const stillAvailable = fresh.some(x => !x.claimed ? !isExpired(x) : !x.claimed);
        return setStage(stillAvailable ? "claimerror" : "empty");
      }

      // Register this device's claim (write-once, transaction-guarded).
      const reg = await registerClaim(fp, claimedPick.id);
      if (!reg.committed) {
        // Either this device already registered a claim between our
        // earlier check and now (e.g. a double-tap), or the write
        // genuinely failed. Either way, look up what's on record for
        // this fingerprint now — if it points to a valid code, show
        // that. If not, this is a real error: we've marked a code
        // claimed but couldn't record it against this device, which
        // would let this device claim again on refresh. Surface an
        // error rather than silently proceeding.
        const recorded = await FB.get(`cd:claims/${fp}`);
        const cs2 = codesObjToArray(await FB.get("cd:codes"));
        const already = recorded ? cs2.find(x => x.id === recorded) : null;
        if (already) { setMyCode(already.value); setMyReward(already.reward || null); return setStage("reveal"); }
        return setStage("claimerror");
      }

      // Increment the session counter via transaction — lost-update safe
      // even with 100+ simultaneous claimers. Tracked regardless of
      // whether a limit is enabled (used for stats either way).
      await incrementCounter("cd:session/claimedCount");

      const claimTime = Date.now();
      const entryMode = authUser ? "signed_in" : "guest";
      await FB.push("cd:sessionLog", { name: claimName, code: claimedPick.value, reward: claimedPick.reward || null, time: claimTime, fp, uid: authUser ? authUser.uid : null, entryMode });
      await recordProfileActivity(authUser, "codeClaims", { sessionId, sessionCode: sessionCode(sessionId), codeId: claimedPick.id, code: claimedPick.value, reward: claimedPick.reward || null, displayName: claimName, claimedAt: claimTime, eventName: sess.eventName || null });

      // Passport badge award (v2.13.6) — only for signed-in claimers,
      // since badges live under users/{uid}/passport and guests have no
      // uid to credit. Feeds the same shared milestone counter as
      // Passport check-ins (see awardPassportBadges), and can also award
      // this session's named badge if the host configured one above.
      if (authUser) {
        const count = await bumpPassportActivityCount(authUser.uid);
        if (count != null) await awardPassportBadges(authUser.uid, sess, count);
      }

      // Only persist a real (non-skipped) name — skipping shouldn't
      // overwrite a name saved from a previous visit.
      if (trimmed) { saveTrainerName(trimmed); await rememberTrainerNameForProfile(authUser, trimmed); }

      setMyCode(claimedPick.value);
      setMyReward(claimedPick.reward || null);
      setStage("reveal");
    };

    const wrap = (kids) => <div style={{ maxWidth: 400, margin: "0 auto", paddingTop: 20 }}>{kids}</div>;

    if (stage === "loading") return <CenterMsg c={c} text="Loading…" />;

    if (stage === "nosession") return wrap(
      <Paper c={c} accent={c.strawberry} style={{ textAlign: "center", padding: "32px 24px" }}>
        <IconBox emoji="✕" bg={c.strawberry + "33"} border={c.strawDeep} size={80} fontSize={36} />
        <div style={{ height: 16 }} />
        <Banner c={c} fill={c.strawberry}>Session not found</Banner>
        <p style={{ marginTop: 14, color: c.inkSoft, fontSize: 14, lineHeight: 1.5 }}>This Code Drop session has ended or doesn't exist. Ask the host to start a new one.</p>
      </Paper>
    );

    if (stage === "staletoken") return wrap(
      <Paper c={c} accent={c.strawberry} style={{ textAlign: "center", padding: "32px 24px" }}>
        <IconBox emoji="🔄" bg={c.strawberry + "33"} border={c.strawDeep} size={80} fontSize={32} />
        <div style={{ height: 16 }} />
        <Banner c={c} fill={c.strawberry}>Scan again</Banner>
        <p style={{ marginTop: 14, color: c.inkSoft, fontSize: 14, lineHeight: 1.5 }}>This code has refreshed. Ask the host to scan the QR again.</p>
      </Paper>
    );

    if (stage === "paused") return wrap(
      <Paper c={c} accent={c.sun} style={{ textAlign: "center", padding: "32px 24px" }}>
        <IconBox emoji="⏸" bg={c.sun + "33"} border={c.sunDeep} size={80} fontSize={32} />
        <div style={{ height: 16 }} />
        <Banner c={c} fill={c.sunDeep}>Distribution paused</Banner>
        <p style={{ marginTop: 14, color: c.inkSoft, fontSize: 14, lineHeight: 1.5 }}>The host has paused drops. Check back in a moment!</p>
        <div style={{ marginTop: 20 }}><StickerBtn fill={c.blue} shadow={c.blueDeep} onClick={check}>Check again</StickerBtn></div>
      </Paper>
    );

    if (stage === "limitreached") return wrap(
      <Paper c={c} accent={c.purple} style={{ textAlign: "center", padding: "32px 24px" }}>
        <IconBox emoji="🏁" bg={c.purple + "33"} border={c.purpleDeep} size={80} fontSize={32} />
        <div style={{ height: 16 }} />
        <Banner c={c} fill={c.purpleDeep}>Session full</Banner>
        <p style={{ marginTop: 14, color: c.inkSoft, fontSize: 14, lineHeight: 1.5 }}>This session has given out its full allotment of codes. Thanks for playing!</p>
      </Paper>
    );

    if (stage === "empty") return wrap(
      <Paper c={c} accent={c.strawberry} style={{ textAlign: "center", padding: "32px 24px" }}>
        <IconBox emoji="🎫" bg={c.strawberry + "33"} border={c.strawDeep} size={80} fontSize={36} />
        <div style={{ height: 16 }} />
        <Banner c={c} fill={c.strawberry}>Stash is empty!</Banner>
        <p style={{ marginTop: 14, color: c.inkSoft, fontSize: 14, lineHeight: 1.5 }}>All codes for this session have been claimed.</p>
        <div style={{ marginTop: 20 }}><StickerBtn fill={c.blue} shadow={c.blueDeep} onClick={check}>Check again</StickerBtn></div>
      </Paper>
    );

    if (stage === "claimerror") return wrap(
      <Paper c={c} accent={c.strawberry} style={{ textAlign: "center", padding: "32px 24px" }}>
        <IconBox emoji="⚠" bg={c.strawberry + "33"} border={c.strawDeep} size={80} fontSize={36} />
        <div style={{ height: 16 }} />
        <Banner c={c} fill={c.strawberry}>Couldn't claim</Banner>
        <p style={{ marginTop: 14, color: c.inkSoft, fontSize: 14, lineHeight: 1.5 }}>Something went wrong saving your code. Please try again.</p>
        <div style={{ marginTop: 20 }}><StickerBtn fill={c.blue} shadow={c.blueDeep} onClick={() => setStage("name")}>Try again</StickerBtn></div>
      </Paper>
    );

    if (stage === "name") return wrap(
      <Paper c={c} accent={c.blue} style={{ textAlign: "center", padding: "28px 22px" }}>
        <h2 style={{ fontFamily: "Fredoka, sans-serif", fontSize: 20, fontWeight: 700, color: c.ink, marginBottom: 18 }}>Claim your code</h2>
        <input value={name} onChange={e => setName(e.target.value)} onKeyDown={e => { if (e.key === "Enter") claim(); }} placeholder="Your name (optional)" style={{ textAlign: "left", fontSize: 16, marginBottom: 14, width: "100%", boxSizing: "border-box" }} maxLength={32} />
        <StickerBtn fill={c.grassMid} shadow={c.grassDeep} onClick={() => claim()} style={{ width: "100%", fontSize: 16, padding: 14, marginBottom: 16 }}>
          Claim code
        </StickerBtn>
        <div style={{ borderTop: `1.5px dashed ${c.paperEdge}`, paddingTop: 14 }}>
          <OptionalProfileSignInCard c={c} authUser={authUser} authBusy={authBusy} authError={authError} onGoogleSignIn={onGoogleSignIn} onSignOut={onSignOut} flow="code" compact />
        </div>
      </Paper>
    );

    if (stage === "reveal") return wrap(
      <Paper c={c} accent={c.grassMid} style={{ textAlign: "center", padding: "28px 22px" }}>
        <div style={{ background: c.paperDim, borderRadius: 18, padding: "18px 16px", marginBottom: 14 }}>
          <div style={{ fontSize: 11, letterSpacing: 2, color: c.inkMute, fontWeight: 600, marginBottom: 8 }}>YOUR CODE</div>
          <div style={{ fontFamily: "monospace", fontSize: 22, fontWeight: 700, color: c.ink, letterSpacing: 2, wordBreak: "break-all", lineHeight: 1.3, marginBottom: myReward ? 8 : 0 }}>{myCode}</div>
          {myReward ? <div style={{ fontSize: 13, fontWeight: 700, color: c.grassDeep }}>{myReward}</div> : null}
        </div>

        <a href={`https://store.pokemongo.com/offer-redemption?passcode=${encodeURIComponent(myCode)}`} target="_blank" rel="noopener noreferrer" style={{ textDecoration: "none", display: "block", marginBottom: 14 }}>
          <StickerBtn fill={c.grassMid} shadow={c.grassDeep} style={{ width: "100%", fontSize: 16, padding: 14, display: "inline-flex", alignItems: "center", justifyContent: "center", gap: 8 }}><Icon name="external" size={16} /> Redeem now</StickerBtn>
        </a>

        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 16 }}>
          <StickerBtn fill={c.blue} shadow={c.blueDeep} small onClick={() => navigator.clipboard.writeText(myCode)}>Copy</StickerBtn>
          <StickerBtn fill={c.purple} shadow={c.purpleDeep} small onClick={() => { if (navigator.share) navigator.share({ title: "Pokémon GO code", text: myCode }); }}>Share</StickerBtn>
        </div>

        <div style={{ borderTop: `1.5px dashed ${c.paperEdge}`, paddingTop: 12 }}>
          <p style={{ fontSize: 11, color: c.inkMute, lineHeight: 1.5, margin: 0 }}>Use the same account you play with. One code per account per week.</p>
        </div>
      </Paper>
    );

    return null;
  }

  // ───────────────────────────────────────────────────────────
  // GIVEAWAY ENTRY PAGE (public, no auth)
  // ───────────────────────────────────────────────────────────
  // v2.13.7: shows either "unlimited time" or a live countdown on the
  // attendee's "You won!" screen, based on the claim window snapshotted
  // onto wonPrize at confirm time. Ticks every second while mounted;
  // stops (shows "Time's up") at zero rather than going negative. This
  // is purely informational — nothing here revokes the prize or notifies
  // the host; the host decides whether to re-roll, per explicit design
  // decision (manual re-roll only, no auto-expiry actions).
  function ClaimCountdown({ c, wonPrize }) {
    const [now, setNow] = useState(Date.now());
    const minutes = wonPrize ? (wonPrize.claimWindowMinutes || 0) : 0;
    useEffect(() => {
      if (!minutes) return undefined;
      const interval = setInterval(() => setNow(Date.now()), 1000);
      return () => clearInterval(interval);
    }, [minutes]);

    if (!minutes) {
      return (
        <div style={{ fontSize: 12, color: c.inkMute, fontWeight: 600, marginBottom: 14 }}>
          You have unlimited time to claim this prize.
        </div>
      );
    }

    const confirmedAt = wonPrize.confirmedAt || now;
    const deadline = confirmedAt + minutes * 60000;
    const remainingMs = Math.max(0, deadline - now);
    const remainingMin = Math.floor(remainingMs / 60000);
    const remainingSec = Math.floor((remainingMs % 60000) / 1000);
    const expired = remainingMs <= 0;

    return (
      <div style={{
        display: "inline-block", background: expired ? (c.strawberry + "22") : (c.sun + "22"),
        color: expired ? c.strawDeep : c.sunDeep, borderRadius: 10, padding: "6px 14px",
        fontSize: 13, fontWeight: 700, marginBottom: 14,
      }}>
        {expired ? "Time's up — check with the host" : `Claim within: ${remainingMin}:${String(remainingSec).padStart(2, "0")}`}
      </div>
    );
  }

  // Formats a "HH:MM" 24h time string (from an <input type="time">) into
  // a locale-friendly display like "6:00 PM". Falls back to the raw
  // string if parsing fails for any reason, rather than showing nothing.
  function formatTimeString(hhmm) {
    if (!hhmm) return "";
    const [h, m] = hhmm.split(":").map(Number);
    if (!Number.isFinite(h) || !Number.isFinite(m)) return hhmm;
    const d = new Date();
    d.setHours(h, m, 0, 0);
    return d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  }

  // v2.13.8: the "keep an eye on this page" alert box — shown on both the
  // "You're entered!" waiting screen and the "You won!" screen. Purpose:
  // since there's no push notification (see project decision to hold off
  // on that), this is the main lever for making sure someone actually
  // sees their result — tells them the drawing time/location if the host
  // set one, and nudges them to stay on the page or sign in so a missed
  // visit isn't a missed prize.
  function DrawingInfoAlert({ c, session, authUser }) {
    if (!session) return null;
    const hasTime = !!session.drawingTime;
    const hasLocation = !!session.drawingLocationLabel;
    let hasTimeAndLocation = false;
    if (hasTime) {
      if (hasLocation) hasTimeAndLocation = true;
    }

    return (
      <div style={{ background: c.blue + "14", border: `2px solid ${c.blue}`, borderRadius: 14, padding: "12px 14px", marginBottom: 14, textAlign: "left" }}>
        {hasTime || hasLocation ? (
          <div style={{ fontSize: 12, fontWeight: 700, color: c.ink, marginBottom: 4, display: "flex", alignItems: "center", gap: 6 }}>
            <Icon name="star" size={13} /> Drawing {hasTime ? `at ${formatTimeString(session.drawingTime)}` : ""}{hasTimeAndLocation ? " · " : ""}{hasLocation ? session.drawingLocationLabel : ""}
          </div>
        ) : null}
        <div style={{ fontSize: 11, color: c.inkSoft, lineHeight: 1.45 }}>
          Keep this tab open{authUser ? "." : " or sign in — your result still shows in My Activity."}
        </div>
      </div>
    );
  }

  function GiveawayClaim({ c, sessionId, authUser, onGoogleSignIn, onSignOut, authBusy, authError }) {
    const [stage, setStage] = useState("loading");
    const [name, setName] = useState(() => getSavedTrainerName());
    const [wonPrize, setWonPrize] = useState(null); // { name, type, code?, description?, confirmed? }
    const [entrantCount, setEntrantCount] = useState(null); // live count for attendee waiting screen
    // v2.13.8: drawing time/location for the "keep an eye on this" alert
    // box (see DrawingInfoAlert below) — read once from the session on
    // load, since these are set once at session start and don't change.
    const [sessionInfo, setSessionInfo] = useState(null);
    // v2.13.8: "On my way" acknowledgment — a genuine two-way signal
    // (not just informational copy, per explicit product decision). The
    // winner taps a button that writes onMyWay/onMyWayAt onto their own
    // entrant record; the host's live GiveawaySession screen reads the
    // same field to show a checkmark next to that winner's name, no
    // push infrastructure required — just a Firebase watch the host
    // already has open.
    const [onMyWaySent, setOnMyWaySent] = useState(false);
    const fp = fingerprint();
    const myEntrantIdRef = useRef(null);

    const check = async () => {
      const sess = await FB.get("gw:session");
      if (!sess || sess.id !== sessionId) return setStage("nosession");
      setSessionInfo(sess);
      const entrants = entrantsObjToArray(await FB.get("gw:entrants"));
      const mine = entrants.find(e => e.fp === fp);
      if (mine) {
        myEntrantIdRef.current = mine.id;
        setName(mine.name);
        if (mine.won) {
          // Check if there's prize data
          const entrantData = await FB.get(`gw:entrants/${mine.id}`);
          if (entrantData) { if (entrantData.wonPrize) {
            setWonPrize(entrantData.wonPrize);
            setOnMyWaySent(!!entrantData.onMyWay);
            return setStage("won");
          } }
        }
        return setStage("entered");
      }
      setStage("name");
    };

    useEffect(() => { check(); }, []);

    // v2.13.8: bookmarkable-link hint. If someone entered, then bounced
    // to another app/tab and lost the page, retyping the join flow from
    // scratch is annoying. One quiet "copy link" button under the
    // session code gets them straight back to this exact claim page
    // (their fingerprint re-matches them to the same entrant on reload).
    const [linkCopied, setLinkCopied] = useState(false);
    const copyPageLink = async () => {
      try {
        await navigator.clipboard.writeText(window.location.href);
        setLinkCopied(true);
        setTimeout(() => setLinkCopied(false), 2000);
      } catch (e) { reportIssue("giveaway:copyLink", e); }
    };

    const sendOnMyWay = async () => {
      if (!myEntrantIdRef.current || onMyWaySent) return;
      setOnMyWaySent(true); // optimistic — this is a low-stakes signal, not worth a busy spinner
      await FB.update({
        [`gw:entrants/${myEntrantIdRef.current}/onMyWay`]: true,
        [`gw:entrants/${myEntrantIdRef.current}/onMyWayAt`]: Date.now(),
      });
    };

    useEffect(() => {
      let alive = true;
      const hasName = !!name.trim();
      if (!authUser) return undefined;
      if (hasName) return undefined;
      (async () => {
        const profileName = await loadSavedProfileTrainerName(authUser);
        if (alive) { if (profileName) setName(profileName); }
      })();
      return () => { alive = false; };
    }, [authUser ? authUser.uid : null]);

    // Real-time listener: once entered, watch only THIS attendee's entrant
    // node for win status changes. Scoping to a single node (rather than
    // the whole gw:entrants map) matters at event scale — with 100-200
    // attendees holding this page open, a map-wide listener would re-send
    // every entrant's data to every device on every single prize draw.
    useEffect(() => {
      if (stage !== "entered") { if (stage !== "won") return; }
      if (!myEntrantIdRef.current) return;
      const entrantRef = db.ref(`gw:entrants/${myEntrantIdRef.current}`);
      const handler = (snap) => {
        const data = snap.val();
        if (data) { if (data.won) { if (data.wonPrize) {
          setWonPrize(data.wonPrize);
          setStage("won");
        } } }
      };
      entrantRef.on("value", handler);
      return () => entrantRef.off("value", handler);
    }, [stage]);

    // v2.13.8: no push infra yet, so a winner whose tab isn't focused
    // (backgrounded, phone locked) still needs some way to notice.
    // Flash the tab title and pulse a vibration — both fire purely off
    // the "won" stage transition above, no new watchers/infra needed.
    // Title flash keeps going until the tab regains focus; vibration is
    // a single best-effort pulse (silently no-ops on unsupported
    // browsers/iOS Safari).
    useEffect(() => {
      if (stage !== "won") return undefined;
      if (typeof navigator !== "undefined") { if (navigator.vibrate) { navigator.vibrate([200, 100, 200]); } }
      const originalTitle = document.title;
      let flashOn = false;
      const flashInterval = setInterval(() => {
        if (document.hasFocus()) { document.title = originalTitle; return; }
        flashOn = !flashOn;
        document.title = flashOn ? "🏆 You won a prize!" : originalTitle;
      }, 1200);
      const onFocus = () => { document.title = originalTitle; };
      window.addEventListener("focus", onFocus);
      return () => {
        clearInterval(flashInterval);
        window.removeEventListener("focus", onFocus);
        document.title = originalTitle;
      };
    }, [stage]);

    // Real-time listener: while waiting (not yet won), watch gw:session so
    // non-winners find out when the giveaway wraps up — without this,
    // someone who didn't win would just sit on "You're entered!" forever
    // with no indication the drawing happened.
    useEffect(() => {
      if (stage !== "entered") return;
      const sessionRef = db.ref("gw:session");
      const handler = (snap) => {
        const val = snap.val();
        // Session ended (host clicked "End giveaway"), or a different
        // session started (this one is over either way).
        if (!val) { setStage("ended"); return; }
        if (val.id !== sessionId) { setStage("ended"); return; }
      };
      sessionRef.on("value", handler);
      return () => sessionRef.off("value", handler);
    }, [stage]);

    // Live entrant count — only active while waiting, scoped to the
    // count of keys in gw:entrants so it's cheap even at event scale.
    useEffect(() => {
      if (stage !== "entered") return;
      const ref = db.ref("gw:entrants");
      const handler = (snap) => {
        const val = snap.val();
        setEntrantCount(val ? Object.keys(val).length : 0);
      };
      ref.on("value", handler);
      return () => ref.off("value", handler);
    }, [stage]);

    const enter = async (skipped) => {
      const trimmed = name.trim();
      if (!trimmed) { if (!skipped) return; }
      const sess = await FB.get("gw:session");
      if (!sess || sess.id !== sessionId) return setStage("nosession");
      const entrants = entrantsObjToArray(await FB.get("gw:entrants"));
      const mine = entrants.find(e => e.fp === fp);
      if (mine) { myEntrantIdRef.current = mine.id; setStage("entered"); return; }
      // Skipped: store a generated "Ticket #1234" as this entrant's display
      // name so the host's live entrant list and the slot-machine draw can
      // still show something callable — no separate field needed, every
      // existing display already reads entrant.name.
      const entryName = trimmed || genTicketLabel();
      const id = genId();
      const entryTime = Date.now();
      const entryMode = authUser ? "signed_in" : "guest";
      myEntrantIdRef.current = id;
      const ok = await FB.set(`gw:entrants/${id}`, { name: entryName, fp, uid: authUser ? authUser.uid : null, entryMode, enteredAt: entryTime, won: false });
      if (!ok) return setStage("entererror");
      // v2.13.8: stash the activity record's own id back onto the entrant
      // node (activityRecordId) so the HOST side (confirmWinner/reroll in
      // GiveawaySession, running on a different device with no access to
      // this attendee's authUser) can later update this exact record —
      // "Entered" -> "Claimed X" or "Picked as winner, did not claim" —
      // instead of creating a confusing second entry.
      const activityRecordId = await recordProfileActivity(authUser, "giveawayEntries", { sessionId, sessionCode: sessionCode(sessionId), entrantId: id, displayName: entryName, enteredAt: entryTime, eventName: sess.eventName || null, status: "entered" });
      if (activityRecordId) await FB.set(`gw:entrants/${id}/activityRecordId`, activityRecordId);
      // Only persist a real (non-skipped) name — skipping shouldn't
      // overwrite a name saved from a previous visit, and we don't want
      // a generated ticket label silently becoming "your name" next time.
      if (trimmed) { saveTrainerName(trimmed); await rememberTrainerNameForProfile(authUser, trimmed); } else { setName(entryName); }
      setStage("entered");
    };

    const wrap = (kids) => <div style={{ maxWidth: 400, margin: "0 auto", paddingTop: 20 }}>{kids}</div>;

    if (stage === "loading") return <CenterMsg c={c} text="Loading…" />;

    if (stage === "nosession") return wrap(
      <Paper c={c} accent={c.strawberry} style={{ textAlign: "center", padding: "32px 24px" }}>
        <IconBox emoji="✕" bg={c.strawberry + "33"} border={c.strawDeep} size={80} fontSize={36} />
        <div style={{ height: 16 }} />
        <Banner c={c} fill={c.strawberry}>Giveaway not found</Banner>
        <p style={{ marginTop: 14, color: c.inkSoft, fontSize: 14, lineHeight: 1.5 }}>This giveaway has ended or doesn't exist. Ask the host to start a new one.</p>
      </Paper>
    );

    if (stage === "entererror") return wrap(
      <Paper c={c} accent={c.strawberry} style={{ textAlign: "center", padding: "32px 24px" }}>
        <IconBox emoji="⚠" bg={c.strawberry + "33"} border={c.strawDeep} size={80} fontSize={36} />
        <div style={{ height: 16 }} />
        <Banner c={c} fill={c.strawberry}>Couldn't enter</Banner>
        <p style={{ marginTop: 14, color: c.inkSoft, fontSize: 14, lineHeight: 1.5 }}>Something went wrong saving your entry. Please try again.</p>
        <div style={{ marginTop: 20 }}><StickerBtn fill={c.blue} shadow={c.blueDeep} onClick={() => setStage("name")}>Try again</StickerBtn></div>
      </Paper>
    );

    if (stage === "name") return wrap(
      <Paper c={c} accent={c.strawberry} style={{ textAlign: "center", padding: "28px 22px" }}>
        <div style={{ display: "inline-flex", alignItems: "center", gap: 6, background: c.strawberry + "22", color: c.strawDeep, fontSize: 11, fontWeight: 700, padding: "5px 14px", borderRadius: 10, marginBottom: 16 }}>
          <Icon name="gift" size={14} /> STEP 1 OF 2 · ENTER THE GIVEAWAY
        </div>
        <h2 style={{ fontFamily: "Fredoka, sans-serif", fontSize: 19, fontWeight: 700, color: c.ink, marginBottom: 12 }}>Enter the giveaway</h2>
        <OptionalProfileSignInCard c={c} authUser={authUser} authBusy={authBusy} authError={authError} onGoogleSignIn={onGoogleSignIn} onSignOut={onSignOut} flow="giveaway" />
        <div style={{ textAlign: "left", marginBottom: 6 }}>
          <label style={{ fontSize: 12, fontWeight: 700, color: c.inkSoft }}>Public trainer name</label>
          <div style={{ fontSize: 11, color: c.inkMute, marginTop: 2 }}>This is what the host will call out if you win.</div>
        </div>
        <input value={name} onChange={e => setName(e.target.value)} onKeyDown={e => { if (e.key === "Enter") enter(false); }} placeholder="e.g. AshK" style={{ textAlign: "left", fontSize: 16, marginBottom: 14, width: "100%", boxSizing: "border-box" }} maxLength={32} />
        <StickerBtn fill={c.strawberry} shadow={c.strawDeep} disabled={!name.trim()} onClick={() => enter(false)} style={{ width: "100%", fontSize: 16, padding: 14, marginBottom: 12 }}>
          Enter Giveaway
        </StickerBtn>
        <button onClick={() => enter(true)} style={{ background: "none", border: "none", color: c.inkMute, fontSize: 12, fontWeight: 600, cursor: "pointer", textDecoration: "underline", padding: 0 }}>
          Use a ticket number instead
        </button>
      </Paper>
    );

    if (stage === "won") return wrap(
      <Paper c={c} accent={c.grassMid} style={{ textAlign: "center", padding: "28px 22px" }}>
        <Banner c={c} fill={c.grassDeep} style={{ marginBottom: 16 }}>You won!</Banner>

        <div style={{ background: c.paperDim, borderRadius: 18, padding: "18px 16px", marginBottom: 14, border: `2.5px dashed ${c.grassMid}` }}>
          <div style={{ fontSize: 11, letterSpacing: 2, color: c.inkMute, fontWeight: 600, marginBottom: 8 }}>YOUR PRIZE</div>
          <div style={{ fontSize: 20, fontWeight: 700, color: c.ink }}>{wonPrize ? wonPrize.name : "A prize"}</div>
          {wonPrize ? (wonPrize.description ? (
            <div style={{ fontSize: 13, color: c.inkSoft, marginTop: 6, fontStyle: "italic" }}>{wonPrize.description}</div>
          ) : null) : null}
        </div>

        <ClaimCountdown c={c} wonPrize={wonPrize} />
        <DrawingInfoAlert c={c} session={sessionInfo} authUser={authUser} />

        {/* Code reveal for code-type prizes — button kept close to the top */}
        {wonPrize ? (wonPrize.code ? (
          <>
            <div style={{ background: c.paperDim, borderRadius: 18, padding: "18px 16px", marginBottom: 12, border: `2.5px dashed ${c.purple}` }}>
              <div style={{ fontSize: 11, letterSpacing: 2, color: c.inkMute, fontWeight: 600, marginBottom: 8 }}>YOUR CODE</div>
              {wonPrize.codeReward ? (
                <div style={{ display: "inline-block", background: c.sun + "33", color: c.sunDeep, padding: "4px 12px", borderRadius: 8, fontSize: 12, fontWeight: 700, marginBottom: 8 }}>
                  This code redeems: {wonPrize.codeReward}
                </div>
              ) : null}
              <div style={{ fontFamily: "monospace", fontSize: 22, fontWeight: 700, color: c.ink, letterSpacing: 2, wordBreak: "break-all", lineHeight: 1.3 }}>{wonPrize.code}</div>
            </div>
            <a href={`https://store.pokemongo.com/offer-redemption?passcode=${encodeURIComponent(wonPrize.code)}`} target="_blank" rel="noopener noreferrer" style={{ textDecoration: "none", display: "block", marginBottom: 6 }}>
              <StickerBtn fill={c.grassMid} shadow={c.grassDeep} style={{ width: "100%", fontSize: 17, padding: "14px", display: "inline-flex", alignItems: "center", justifyContent: "center", gap: 8 }}><Icon name="external" size={16} /> REDEEM NOW</StickerBtn>
            </a>
            <p style={{ fontSize: 12, color: c.inkMute, marginBottom: 14 }}>Opens the Pokémon GO store in a new tab.</p>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 14 }}>
              <StickerBtn fill={c.blue} shadow={c.blueDeep} small onClick={() => navigator.clipboard.writeText(wonPrize.code)}>Copy</StickerBtn>
              <StickerBtn fill={c.purple} shadow={c.purpleDeep} small onClick={() => { if (navigator.share) navigator.share({ title: "Pokémon GO code", text: wonPrize.code }); }}>Share</StickerBtn>
            </div>
          </>
        ) : null) : null}

        <div style={{ display: "inline-flex", alignItems: "center", gap: 6, background: "#fff", borderRadius: 10, padding: "5px 12px", border: `2px solid ${c.paperEdge}`, marginBottom: 6 }}>
          <span style={{ fontSize: 10, color: c.inkMute, letterSpacing: 1, fontWeight: 700 }}>SESSION</span>
          <span style={{ fontFamily: "monospace", fontSize: 13, fontWeight: 700, color: c.ink, letterSpacing: 2 }}>{sessionCode(sessionId)}</span>
        </div>
        <p style={{ fontSize: 11, color: c.inkMute, marginBottom: 14, lineHeight: 1.4 }}>If the host asks to verify your entry, show them this code — it confirms you're part of today's live session before handing over your prize.</p>

        {wonPrize ? (wonPrize.code ? (
          <div style={{ background: c.sun + "22", borderRadius: 12, padding: "10px 12px", marginBottom: 14, fontSize: 12, color: c.inkSoft, lineHeight: 1.5, textAlign: "left" }}>
            <strong>Before you redeem:</strong> make sure you're signed into the Pokémon GO store with the <strong>same account</strong> you use in the game, or the code won't apply to your account.
          </div>
        ) : null) : null}

        {/* Physical/generic prize instructions */}
        {wonPrize ? (!wonPrize.code ? (
          <div style={{ background: c.paperDim, borderRadius: 14, padding: "12px 14px", marginBottom: 14, textAlign: "left" }}>
            <div style={{ fontSize: 11, color: c.orangeDeep, fontWeight: 700, letterSpacing: 1.5, marginBottom: 4 }}>NEXT STEP</div>
            <p style={{ fontSize: 13, color: c.inkSoft, lineHeight: 1.5 }}>
              {wonPrize.type === "special" ? "This is a special prize! The host has confirmed delivery." : "See the host to collect your prize. Show them this screen!"}
            </p>
          </div>
        ) : null) : null}

        {/* v2.13.8: "On my way" — a real two-way signal, not just copy.
            Writes onMyWay/onMyWayAt onto this entrant's own record; the
            host's live screen shows a checkmark next to this winner's
            name once it lands. Shown for every prize type — even a code
            winner benefits from letting the host know they've seen it. */}
        {onMyWaySent ? (
          <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 6, color: c.grassDeep, fontWeight: 700, fontSize: 13, marginBottom: 14 }}>
            <Icon name="check" size={14} /> Host notified you're on your way
          </div>
        ) : (
          <StickerBtn fill={c.blue} shadow={c.blueDeep} onClick={sendOnMyWay} style={{ width: "100%", marginBottom: 14, display: "inline-flex", alignItems: "center", justifyContent: "center", gap: 8 }}>
            <Icon name="external" size={14} /> I'm on my way
          </StickerBtn>
        )}

        <p style={{ fontSize: 12, color: c.inkMute, lineHeight: 1.5 }}>Congratulations, {name}! 🎊</p>
      </Paper>
    );

    if (stage === "entered") return wrap(
      <Paper c={c} accent={c.grassMid} style={{ textAlign: "center", padding: "28px 22px" }}>
        <Banner c={c} fill={c.grassDeep} style={{ marginBottom: 16 }}>You're entered!</Banner>
        <div style={{ marginBottom: 16, display: "flex", justifyContent: "center" }}>
          <IconBox emoji="🎁" bg={c.sun + "33"} border={c.sunDeep} size={72} fontSize={34} />
        </div>
        <div style={{ background: c.paperDim, borderRadius: 18, padding: "18px 16px", marginBottom: 14, border: `2.5px dashed ${c.paperEdge}` }}>
          <div style={{ fontSize: 11, letterSpacing: 2, color: c.inkMute, fontWeight: 600, marginBottom: 8 }}>ENTERED AS</div>
          <div style={{ fontSize: 20, fontWeight: 700, color: c.ink }}>{name}</div>
          {entrantCount !== null ? (
            <div style={{ fontSize: 12, color: c.inkSoft, marginTop: 6, fontWeight: 600 }}>
              {entrantCount === 1 ? "You're the first one in!" : `${entrantCount} trainer${entrantCount !== 1 ? 's' : ''} in the pool`}
            </div>
          ) : null}
        </div>
        <div style={{ display: "inline-flex", alignItems: "center", gap: 6, background: "#fff", borderRadius: 10, padding: "5px 12px", border: `2px solid ${c.paperEdge}`, marginBottom: 6 }}>
          <span style={{ fontSize: 10, color: c.inkMute, letterSpacing: 1, fontWeight: 700 }}>SESSION</span>
          <span style={{ fontFamily: "monospace", fontSize: 13, fontWeight: 700, color: c.ink, letterSpacing: 2 }}>{sessionCode(sessionId)}</span>
        </div>
        <p style={{ fontSize: 11, color: c.inkMute, marginBottom: 10, lineHeight: 1.4 }}>If the host needs to verify your entry, they'll ask you to show this code — it confirms you're part of today's live session.</p>
        <button onClick={copyPageLink} style={{ background: "none", border: "none", color: c.blue, fontSize: 11, fontWeight: 700, cursor: "pointer", padding: "4px 8px", marginBottom: 12, display: "inline-flex", alignItems: "center", gap: 5 }}>
          <Icon name="external" size={11} /> {linkCopied ? "Link copied!" : "Copy link to find your way back"}
        </button>
        <DrawingInfoAlert c={c} session={sessionInfo} authUser={authUser} />
        <p style={{ fontSize: 13, color: c.inkSoft, lineHeight: 1.5 }}>Good luck! Winners are announced live by the host.</p>
      </Paper>
    );

    if (stage === "ended") return wrap(
      <Paper c={c} accent={c.blue} style={{ textAlign: "center", padding: "28px 22px" }}>
        <Banner c={c} fill={c.blueDeep} style={{ marginBottom: 16 }}>Giveaway complete</Banner>
        <div style={{ marginBottom: 16, display: "flex", justifyContent: "center" }}>
          <IconBox emoji="✨" bg={c.sun + "33"} border={c.sunDeep} size={72} fontSize={34} />
        </div>
        <p style={{ fontSize: 14, color: c.ink, fontWeight: 600, lineHeight: 1.5, marginBottom: 6 }}>Thanks for playing, {name}!</p>
        <p style={{ fontSize: 12, color: c.inkMute, lineHeight: 1.5 }}>This drawing has ended. If your name was called, the host will have confirmed your prize on their screen — check with them if you think that's you. See you at the next meetup!</p>
      </Paper>
    );

    return null;
  }

  function Banner({ children, fill, c, style = {} }) {
    return (
      <div style={{
        display: "inline-block", background: fill, color: "#fff", padding: "8px 22px", borderRadius: 12,
        border: "3px solid #fff", boxShadow: `0 0 0 2px ${fill}, 0 4px 0 ${fill}, 0 8px 12px rgba(13, 45, 82, 0.18)`,
        fontFamily: "Fredoka, sans-serif", fontWeight: 700, fontSize: 18, letterSpacing: 1,
        textTransform: "uppercase", ...style,
      }}>{children}</div>
    );
  }

  // ───────────────────────────────────────────────────────────
  // BRANDING SETTINGS (host only)
  // ───────────────────────────────────────────────────────────
  function BrandingSettings({ c, setView }) {
    const [draft, setDraft] = useState(c);
    const [saved, setSaved] = useState(false);
    const [logoOk, setLogoOk] = useState(null); // null = untested, true/false = result
    const [bgOk, setBgOk] = useState(null);
    const { confirmState: brandConfirmState, requestConfirm, handleCancel: brandCancel, handleConfirm: brandConfirm } = useConfirm();

    useEffect(() => { setDraft(c); }, [c.bgImage, c.logoImage, c.blue, c.strawberry, c.orange, c.purple, c.sun, c.grassMid]);

    // Preload-check whichever image URL is currently in the draft, so the
    // host finds out an image link is broken (404, host down, wrong URL)
    // here — before saving it as the live site-wide background or logo.
    useEffect(() => {
      if (!draft.logoImage) { setLogoOk(null); return; }
      setLogoOk(null);
      const img = new Image();
      img.onload = () => setLogoOk(true);
      img.onerror = () => setLogoOk(false);
      img.src = draft.logoImage;
    }, [draft.logoImage]);

    useEffect(() => {
      if (!draft.bgImage) { setBgOk(null); return; }
      setBgOk(null);
      const img = new Image();
      img.onload = () => setBgOk(true);
      img.onerror = () => setBgOk(false);
      img.src = draft.bgImage;
    }, [draft.bgImage]);

    const field = (key, label, type = "color", status = null) => (
      <div style={{ marginBottom: 12 }}>
        <div style={{ fontSize: 12, fontWeight: 700, color: c.inkSoft, marginBottom: 4 }}>{label}</div>
        {type === "color" ? (
          <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
            <input type="color" value={draft[key]} onChange={e => setDraft({ ...draft, [key]: e.target.value })} style={{ width: 50, height: 40, padding: 2, cursor: "pointer" }} />
            <input value={draft[key]} onChange={e => setDraft({ ...draft, [key]: e.target.value })} style={{ flex: 1 }} />
          </div>
        ) : (
          <input value={draft[key]} onChange={e => setDraft({ ...draft, [key]: e.target.value })} placeholder="https://..." />
        )}
        {status === true ? (
          <div style={{ fontSize: 11, color: c.grassDeep, fontWeight: 700, marginTop: 4, display: "flex", alignItems: "center", gap: 4 }}>
            <Icon name="check" size={11} /> Image loads OK
          </div>
        ) : null}
        {status === false ? (
          <div style={{ fontSize: 11, color: c.strawDeep, fontWeight: 700, marginTop: 4, display: "flex", alignItems: "flex-start", gap: 4 }}>
            <Icon name="warning" size={12} style={{ marginTop: 1, flexShrink: 0 }} /> Couldn't load this image — check the URL is correct, public, and points directly to the image file (not a webpage).
          </div>
        ) : null}
      </div>
    );

    const save = async () => {
      await FB.set("settings:branding", draft);
      setSaved(true);
      setTimeout(() => setSaved(false), 2500);
    };

    const reset = () => {
      requestConfirm("Reset all branding to defaults?", async () => {
        await FB.set("settings:branding", DEFAULT_BRAND);
        setDraft(DEFAULT_BRAND);
      });
    };

    return (
      <div style={{ maxWidth: 460, margin: "0 auto" }}>
        <ConfirmModal confirmState={brandConfirmState} onCancel={brandCancel} onConfirm={brandConfirm} />
        <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 20 }}>
          <BackButton c={c} onClick={() => setView("home")} />
          <div style={{ flex: 1 }}>
            <div style={{ fontWeight: 700, fontSize: 22, color: "#fff", textShadow: "0 2px 4px rgba(0,0,0,0.25)", lineHeight: 1.1 }}>Branding</div>
            <div style={{ fontSize: 13, color: c.sun, fontWeight: 600, marginTop: 2 }}>Customize the look</div>
          </div>
        </div>

        <Paper c={c} accent={c.sun} style={{ marginBottom: 14 }}>
          <div style={{ fontWeight: 700, fontSize: 15, color: c.ink, marginBottom: 12 }}>Images (URL)</div>
          {field("logoImage", "Logo image URL (replaces 'GARDEN GROVE' text)", "text", logoOk)}
          {field("bgImage", "Background image URL (optional)", "text", bgOk)}
          <p style={{ fontSize: 11, color: c.inkMute, lineHeight: 1.5, marginTop: 4 }}>
            Paste a direct link to an image (ending in .png, .jpg, etc). Host images on a free service like GitHub, Imgur, or your own site.
          </p>
        </Paper>

        <Paper c={c} accent={c.blue} style={{ marginBottom: 14 }}>
          <div style={{ fontWeight: 700, fontSize: 15, color: c.ink, marginBottom: 12 }}>Colors</div>
          {field("blue", "Code Drop accent")}
          {field("strawberry", "Giveaway accent")}
          {field("orange", "Start Session button")}
          {field("purple", "Branding / manage accent")}
          {field("sun", "Highlight / warning")}
          {field("grassMid", "Page background")}
        </Paper>

        <div style={{ display: "flex", gap: 10 }}>
          <StickerBtn fill={c.grassMid} shadow={c.grassDeep} onClick={save} style={{ flex: 1, padding: 14 }}>
            {saved ? "✓ Saved!" : "Save changes"}
          </StickerBtn>
          <StickerBtn fill={c.paperDim} shadow={c.paperEdge} onClick={reset} style={{ color: c.ink }}>Reset</StickerBtn>
        </div>
      </div>
    );
  }

  // ───────────────────────────────────────────────────────────
  // MEETUP STATS — pulls RSVP/check-in data for the configured
  // Campfire club from Topi's Campfire Tools API
  // (https://cmpf-tools.de/api/docs) and shows aggregate stats:
  // totals, monthly/quarterly/yearly breakdowns, event rankings,
  // and repeat-attendance rate. Host-only.
  //
  // The API has no CORS headers, so a direct browser fetch from
  // the WordPress site may be blocked. We try it anyway (it may
  // work depending on hosting), and fall back to letting the host
  // paste the JSON response manually — they can open the API URL
  // directly in a browser tab (which always works) and paste the
  // result here. Either way, the fetched data is cached in Firebase
  // so it persists without re-fetching every visit.
  // ───────────────────────────────────────────────────────────
  function MeetupStatsApp({ c, setView }) {
    const [clubId, setClubId] = useState("");
    const [clubIdDraft, setClubIdDraft] = useState("");
    const [rawEvents, setRawEvents] = useState(null); // array from API, or null if never loaded
    const [lastFetched, setLastFetched] = useState(null); // ms timestamp
    const [loading, setLoading] = useState(true);
    const [fetchError, setFetchError] = useState("");
    const [fetching, setFetching] = useState(false);
    const [showPaste, setShowPaste] = useState(false);
    const [pasteText, setPasteText] = useState("");
    const [pasteError, setPasteError] = useState("");

    // Date range filter (Pacific "YYYY-MM-DD" strings, both optional)
    const [fromDate, setFromDate] = useState("");
    const [toDate, setToDate] = useState("");

    // When on, events with a 0% check-in rate (no check-ins at all,
    // including events with zero RSVPs) are excluded from totals,
    // breakdowns, and rankings. Off by default — these events are real
    // data points, but a host comparing trends may want to filter out
    // cancelled/no-show events that would otherwise drag down averages.
    const [excludeZeroAttendance, setExcludeZeroAttendance] = useState(false);

    // Saved snapshots: labeled aggregate totals for a period, for trend
    // tracking over time (e.g. "save June 2026's numbers" each month).
    const [snapshots, setSnapshots] = useState([]);
    const [snapshotLabel, setSnapshotLabel] = useState("");
    const [snapshotMsg, setSnapshotMsg] = useState("");
    const { confirmState: statsConfirmState, requestConfirm, handleCancel: statsCancel, handleConfirm: statsConfirm } = useConfirm();

    // Code Drop and Giveaway history — loaded once on mount, used to
    // build per-event "codes distributed" and "prizes given" counts.
    const [codeHistory, setCodeHistory] = useState([]);
    const [gwHistory, setGwHistory] = useState([]);

    // Known Garden Grove PoGo club ID from prior setup — pre-filled as a
    // starting point if nothing has been configured yet, but the host can
    // change it (e.g. to track a different club).
    const KNOWN_CLUB_ID = "37783c12-f35f-488c-8fd1-36ea2b2e4a4d";

    // Topi's Campfire Tools API doesn't send CORS headers, so a direct
    // browser fetch is blocked. A small Cloudflare Worker proxy (deployed
    // separately) forwards requests and adds the missing header. This is
    // the Garden Grove proxy's default — the host can change it if they
    // ever redeploy the Worker at a different URL, or clear it to fall
    // back to a direct fetch attempt (which will likely hit CORS, but some
    // hosting setups vary).
    const KNOWN_PROXY_BASE = "https://ggpogo-campfire-proxy.nianiiki14.workers.dev";
    const [proxyBase, setProxyBase] = useState("");
    const [proxyBaseDraft, setProxyBaseDraft] = useState("");

    useEffect(() => {
      (async () => {
        const settings = await FB.get("stats:settings");
        const hasClubId = settings ? !!settings.clubId : false;
        if (hasClubId) {
          setClubId(settings.clubId);
          setClubIdDraft(settings.clubId);
        } else {
          setClubIdDraft(KNOWN_CLUB_ID);
        }
        const hasProxyBase = settings ? settings.proxyBase != null : false;
        if (hasProxyBase) {
          // Explicitly configured (possibly to "" if the host cleared it
          // to force a direct-fetch attempt) — use exactly what's saved.
          setProxyBase(settings.proxyBase);
          setProxyBaseDraft(settings.proxyBase || KNOWN_PROXY_BASE);
        } else {
          // Never configured — default to the known Garden Grove proxy
          // immediately, so "Fetch live" works without an extra setup step.
          setProxyBase(KNOWN_PROXY_BASE);
          setProxyBaseDraft(KNOWN_PROXY_BASE);
        }
        const cache = await FB.get("stats:cache");
        if (cache) { if (cache.events) {
          setRawEvents(cache.events);
          setLastFetched(cache.fetchedAt || null);
        } }
        const snaps = await FB.get("stats:snapshots");
        if (snaps) {
          const arr = Object.entries(snaps).map(([id, v]) => ({ id, ...v }));
          arr.sort((a, b) => (a.fromDate || "").localeCompare(b.fromDate || "") || (a.savedAt - b.savedAt));
          setSnapshots(arr);
        }
        // Load Code Drop and Giveaway history for per-event counts
        const cdHistRaw = await FB.get("cd:history");
        if (cdHistRaw) setCodeHistory(Object.values(cdHistRaw));
        const gwHistRaw = await FB.get("gw:history");
        if (gwHistRaw) setGwHistory(Object.values(gwHistRaw));
        setLoading(false);
      })();
    }, []);

    const saveClubId = async () => {
      const id = clubIdDraft.trim();
      if (!id) return;
      await FB.set("stats:settings/clubId", id);
      setClubId(id);
    };

    const saveProxyBase = async () => {
      // Allow clearing the proxy (empty string) to force a direct-fetch
      // attempt. Write "" explicitly (not null/delete) so this is
      // distinguishable from "never configured" on reload — otherwise
      // it would just snap back to the known default.
      const base = proxyBaseDraft.trim().replace(/\/$/, "");
      await FB.set("stats:settings/proxyBase", base);
      setProxyBase(base);
    };

    // The direct Topi API URL — always shown for the manual-paste fallback,
    // since that always works (it's the user's own browser tab, not subject
    // to this app's CORS restrictions).
    const apiUrl = clubId ? `https://cmpf-tools.de/api/clubs/${clubId}/events` : null;
    // The URL "Fetch live" actually calls — via the proxy if configured,
    // otherwise a direct fetch (which will likely hit CORS, but the error
    // message below explains the fallback either way).
    const fetchUrl = clubId ? (proxyBase ? `${proxyBase}/clubs/${clubId}/events` : apiUrl) : null;

    const cacheEvents = async (events) => {
      const fetchedAt = Date.now();
      setRawEvents(events);
      setLastFetched(fetchedAt);
      // Cache only what's needed for stats — drop avatar URLs, badges,
      // usernames/display names aren't needed either, but we keep IDs
      // for repeat-attendance. Stripping extra fields keeps this small.
      const slim = events.map(e => ({
        id: e.id, name: e.name, time: e.time, url: e.url,
        members: (e.members || []).map(m => ({ id: m.id, rsvp_status: m.rsvp_status })),
      }));
      await FB.set("stats:cache", { events: slim, fetchedAt });
    };

    const fetchLive = async () => {
      if (!fetchUrl) return;
      setFetching(true);
      setFetchError("");
      try {
        const res = await fetch(fetchUrl);
        if (!res.ok) throw new Error(`API returned HTTP ${res.status}`);
        const data = await res.json();
        if (!Array.isArray(data)) throw new Error("Unexpected response format (expected a list of events)");
        await cacheEvents(data);
        setShowPaste(false);
      } catch (e) {
        // Most likely a CORS failure — browsers report these as a generic
        // "Failed to fetch" / TypeError with no useful detail.
        setFetchError(
          "Couldn't fetch live data — this is most likely a browser CORS restriction, not a problem with your data. " +
          "Use \"Paste data manually\" below instead: open the API link in a new tab, copy the page's full text, and paste it here."
        );
      } finally {
        setFetching(false);
      }
    };

    const applyPaste = async () => {
      setPasteError("");
      let data;
      try {
        data = JSON.parse(pasteText);
      } catch (e) {
        setPasteError("That doesn't look like valid JSON. Make sure you copied the entire response (it should start with [ and end with ]).");
        return;
      }
      if (!Array.isArray(data)) {
        setPasteError("Expected a list of events (the response should start with [ ). Double-check you copied the full page.");
        return;
      }
      await cacheEvents(data);
      setPasteText("");
      setShowPaste(false);
    };

    // ─── Derived stats ───
    const summaries = useMemo(() => rawEvents ? summarizeEvents(rawEvents) : [], [rawEvents]);
    const inRangeAll = useMemo(() => filterEventsForRange(summaries, fromDate || null, toDate || null), [summaries, fromDate, toDate]);
    const zeroAttendanceCount = useMemo(() => inRangeAll.filter(e => e.checkedIn === 0).length, [inRangeAll]);
    const inRange = useMemo(() => excludeZeroAttendance ? inRangeAll.filter(e => e.checkedIn > 0) : inRangeAll, [inRangeAll, excludeZeroAttendance]);
    const totals = useMemo(() => aggregateTotals(inRange), [inRange]);
    const repeatStats = useMemo(() => computeRepeatAttendance(inRange), [inRange]);

    // Per-event code/prize distribution counts from session history
    const codeCountMap = useMemo(() => buildEventCountMap(codeHistory, "claims"), [codeHistory]);
    const prizeCountMap = useMemo(() => buildEventCountMap(gwHistory, "draws"), [gwHistory]);
    const totalCodesInRange = useMemo(() => {
      let sum = 0;
      for (const e of inRange) { sum += codeCountMap.get(e.id) || 0; }
      return sum;
    }, [inRange, codeCountMap]);
    const totalPrizesInRange = useMemo(() => {
      let sum = 0;
      for (const e of inRange) { sum += prizeCountMap.get(e.id) || 0; }
      return sum;
    }, [inRange, prizeCountMap]);

    // Most recent completed event (for "Last Event Stats" card)
    const lastEvent = useMemo(() => {
      const completed = summaries.filter(e => e.includeInDashboard);
      if (!completed.length) return null;
      completed.sort((a, b) => new Date(b.timeUtc).getTime() - new Date(a.timeUtc).getTime());
      return completed[0];
    }, [summaries]);

    const monthly = useMemo(() => groupEvents(
      inRange,
      e => e.yearQuarter ? `${e.year}-${String(e.month).padStart(2, "0")}` : null,
      e => e.monthLabel,
      (e, key) => key
    ), [inRange]);

    const quarterly = useMemo(() => groupEvents(
      inRange,
      e => e.yearQuarter,
      e => e.yearQuarter,
      (e, key) => key
    ), [inRange]);

    const yearly = useMemo(() => groupEvents(
      inRange,
      e => e.year,
      e => String(e.year),
      (e, key) => key
    ), [inRange]);

    const topByCheckIns = useMemo(() => [...inRange].sort((a, b) => b.checkedIn - a.checkedIn).slice(0, 10), [inRange]);
    const lowestRate = useMemo(() => [...inRange].filter(e => e.rsvpTotal > 0).sort((a, b) => a.checkInRate - b.checkInRate).slice(0, 10), [inRange]);

    const futureCount = summaries.length - summaries.filter(e => e.includeInDashboard).length;

    // Save the currently-displayed aggregate totals as a labeled snapshot,
    // for trend tracking over time. Stores computed numbers only (not raw
    // event data — that stays in stats:cache and can be re-fetched anytime).
    const saveSnapshot = async () => {
      const label = snapshotLabel.trim();
      if (!label) return;
      const id = genId();
      const snapshot = {
        label,
        fromDate: fromDate || null,
        toDate: toDate || null,
        savedAt: Date.now(),
        totalEvents: totals.totalEvents,
        totalCheckIns: totals.totalCheckIns,
        totalRsvps: totals.totalRsvps,
        overallRate: totals.overallRate,
        avgCheckIns: totals.avgCheckIns,
        avgRsvps: totals.avgRsvps,
        overallRepeatRate: repeatStats.overallRepeatRate,
        uniqueAttendees: repeatStats.uniqueAttendees,
      };
      await FB.set(`stats:snapshots/${id}`, snapshot);
      setSnapshots(prev => [...prev, { id, ...snapshot }].sort((a, b) => (a.fromDate || "").localeCompare(b.fromDate || "") || (a.savedAt - b.savedAt)));
      setSnapshotLabel("");
      setSnapshotMsg(`✓ Saved "${label}"`);
      setTimeout(() => setSnapshotMsg(""), 4000);
    };

    const deleteSnapshot = (id) => {
      requestConfirm("Delete this snapshot? This can't be undone.", async () => {
        await FB.remove(`stats:snapshots/${id}`);
        setSnapshots(prev => prev.filter(s => s.id !== id));
      });
    };

    const exportSummary = () => {
      const csvRows = [
        ["From", "To", "Events", "Check-ins", "RSVPs", "Check-in rate", "Avg check-ins/event", "Avg RSVPs/event", "Repeat check-in rate", "Unique attendees", "Codes distributed", "Prizes given"],
        [
          fromDate || "(all time)", toDate || "(all time)",
          totals.totalEvents, totals.totalCheckIns, totals.totalRsvps,
          `${(totals.overallRate * 100).toFixed(1)}%`,
          totals.avgCheckIns.toFixed(2), totals.avgRsvps.toFixed(2),
          `${(repeatStats.overallRepeatRate * 100).toFixed(1)}%`,
          repeatStats.uniqueAttendees,
          totalCodesInRange, totalPrizesInRange,
        ],
      ];
      downloadCsv(`meetup-stats-summary-${new Date().toISOString().slice(0, 10)}.csv`, csvRows);
    };

    const exportSnapshots = () => {
      const csvRows = [["Label", "From", "To", "Events", "Check-ins", "RSVPs", "Check-in rate", "Avg check-ins/event", "Avg RSVPs/event", "Repeat check-in rate", "Unique attendees", "Saved at"]];
      snapshots.forEach(s => csvRows.push([
        s.label, s.fromDate || "", s.toDate || "",
        s.totalEvents, s.totalCheckIns, s.totalRsvps,
        `${(s.overallRate * 100).toFixed(1)}%`,
        s.avgCheckIns.toFixed(2), s.avgRsvps.toFixed(2),
        `${(s.overallRepeatRate * 100).toFixed(1)}%`,
        s.uniqueAttendees, new Date(s.savedAt).toLocaleString(),
      ]));
      downloadCsv(`meetup-stats-snapshots-${new Date().toISOString().slice(0, 10)}.csv`, csvRows);
    };

    if (loading) return <CenterMsg c={c} text="Loading…" />;

    return (
      <div style={{ maxWidth: 520, margin: "0 auto" }}>
        <ConfirmModal confirmState={statsConfirmState} onCancel={statsCancel} onConfirm={statsConfirm} />
        <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 20 }}>
          <BackButton c={c} onClick={() => setView("home")} />
          <div style={{ flex: 1 }}>
            <div style={{ fontWeight: 700, fontSize: 22, color: "#fff", textShadow: "0 2px 4px rgba(0,0,0,0.25)", lineHeight: 1.1 }}>Meetup Stats</div>
            <div style={{ fontSize: 13, color: c.grassMid, fontWeight: 600, marginTop: 2 }}>RSVPs &amp; check-ins from Campfire</div>
          </div>
        </div>

        {/* ─── Club ID setup ─── */}
        <Paper c={c} accent={c.grassMid} style={{ marginBottom: 16 }}>
          <div style={{ fontWeight: 700, fontSize: 14, color: c.ink, marginBottom: 8 }}>Campfire Club ID</div>
          <div style={{ display: "flex", gap: 8, marginBottom: 8 }}>
            <input value={clubIdDraft} onChange={e => setClubIdDraft(e.target.value)} placeholder="e.g. 37783c12-f35f-488c-8fd1-36ea2b2e4a4d" style={{ flex: 1, fontFamily: "monospace", fontSize: 12 }} />
            <StickerBtn fill={c.grassMid} shadow={c.grassDeep} small onClick={saveClubId} disabled={!clubIdDraft.trim() || clubIdDraft.trim() === clubId}>Save</StickerBtn>
          </div>
          <div style={{ fontSize: 11, color: c.inkMute, lineHeight: 1.5, marginBottom: 8 }}>
            Data comes from <a href="https://cmpf-tools.de/api/docs" target="_blank" rel="noopener noreferrer" style={{ color: c.blue, fontWeight: 600 }}>Topi's Campfire Tools API</a>, which tracks events for clubs registered with it. Your club's events must be imported/tracked there to appear.
          </div>
          <details>
            <summary style={{ fontSize: 11, color: c.inkMute, fontWeight: 700, cursor: "pointer" }}>Advanced: CORS proxy URL</summary>
            <div style={{ marginTop: 8 }}>
              <div style={{ display: "flex", gap: 8, marginBottom: 8 }}>
                <input value={proxyBaseDraft} onChange={e => setProxyBaseDraft(e.target.value)} placeholder="https://your-worker.workers.dev" style={{ flex: 1, fontFamily: "monospace", fontSize: 11 }} />
                <StickerBtn fill={c.blue} shadow={c.blueDeep} small onClick={saveProxyBase} disabled={proxyBaseDraft.trim() === proxyBase}>Save</StickerBtn>
              </div>
              <div style={{ fontSize: 11, color: c.inkMute, lineHeight: 1.5 }}>
                Topi's API doesn't allow direct browser requests from other sites (CORS), so "Fetch live" goes through a small proxy that adds the missing permission. This is pre-filled with the Garden Grove proxy. Clear it to attempt a direct fetch instead (will likely fail, but "Paste data manually" always works as a fallback).
              </div>
            </div>
          </details>
        </Paper>

        {!clubId ? (
          <Paper c={c} style={{ textAlign: "center", padding: "24px 20px", color: c.inkMute }}>
            <div style={{ fontSize: 14, fontWeight: 600, color: c.ink, marginBottom: 6 }}>Enter your club ID above to get started</div>
            <p style={{ fontSize: 12, lineHeight: 1.5 }}>This is the same ID used in your Campfire group's tracker URL.</p>
          </Paper>
        ) : (
          <>
            {/* ─── Fetch / refresh ─── */}
            <Paper c={c} style={{ marginBottom: 16 }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 10 }}>
                <div>
                  <div style={{ fontWeight: 700, fontSize: 14, color: c.ink }}>Event data</div>
                  <div style={{ fontSize: 11, color: c.inkMute, marginTop: 2 }}>
                    {lastFetched ? `Last updated ${new Date(lastFetched).toLocaleString()}` : "No data loaded yet"}
                    {rawEvents ? ` · ${rawEvents.length} event${rawEvents.length !== 1 ? 's' : ''}` : null}
                  </div>
                </div>
                <StickerBtn fill={c.blue} shadow={c.blueDeep} small onClick={fetchLive} disabled={fetching} style={{ display: "inline-flex", alignItems: "center", gap: 6 }}>
                  <Icon name="refresh" size={13} /> {fetching ? "Fetching…" : "Fetch live"}
                </StickerBtn>
              </div>
              {fetchError ? (
                <div style={{ marginTop: 10, padding: "8px 10px", background: c.sun + "22", borderRadius: 8, fontSize: 12, color: c.inkSoft, lineHeight: 1.5 }}>
                  {fetchError}
                </div>
              ) : null}
              <div style={{ marginTop: 10 }}>
                <button onClick={() => setShowPaste(!showPaste)} style={{ background: "none", border: "none", color: c.blue, fontWeight: 700, fontSize: 12, cursor: "pointer", textDecoration: "underline", padding: 0 }}>
                  {showPaste ? "Hide manual paste" : "Paste data manually"}
                </button>
              </div>
              {showPaste ? (
                <div style={{ marginTop: 10 }}>
                  <ol style={{ fontSize: 12, color: c.inkSoft, lineHeight: 1.6, paddingLeft: 18, marginBottom: 8 }}>
                    <li>Open <a href={apiUrl} target="_blank" rel="noopener noreferrer" style={{ color: c.blue, fontWeight: 600, wordBreak: "break-all" }}>{apiUrl}</a> in a new tab</li>
                    <li>Select all the text on that page (Ctrl/Cmd+A) and copy it</li>
                    <li>Paste it into the box below and click Apply</li>
                  </ol>
                  <textarea value={pasteText} onChange={e => setPasteText(e.target.value)} placeholder="[...]" rows={5} style={{ marginBottom: 8, fontFamily: "monospace", fontSize: 11 }} />

  // Shared table for Monthly/Quarterly/Yearly breakdowns
  function StatsBreakdownTable({ c, title, rows }) {
    if (!rows.length) return null;
    const columnLabel = title === "Monthly" ? "Month" : title === "Quarterly" ? "Quarter" : "Year";
    const exportRows = () => {
      const csvRows = [[columnLabel, "Events", "Check-ins", "RSVPs", "Check-in rate"]];
      rows.forEach(r => csvRows.push([r.label, r.totalEvents, r.totalCheckIns, r.totalRsvps, `${(r.overallRate * 100).toFixed(1)}%`]));
      downloadCsv(`meetup-stats-${title.toLowerCase()}-${new Date().toISOString().slice(0, 10)}.csv`, csvRows);
    };
    return (
      <Paper c={c} accent={c.blue} style={{ marginBottom: 16 }}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 10 }}>
          <div style={{ fontWeight: 700, fontSize: 14, color: c.ink, display: "flex", alignItems: "center", gap: 6 }}>
            <Icon name="chart" size={14} /> {title}
          </div>
          <button onClick={exportRows} style={{ background: "none", border: "none", color: c.blue, cursor: "pointer", display: "flex", alignItems: "center", gap: 4, padding: 0 }} aria-label={`Download ${title} as CSV`}>
            <Icon name="download" size={14} />
          </button>
        </div>
        <div style={{ maxHeight: 280, overflowY: "auto" }}>
          <table>
            <thead>
              <tr style={{ borderBottom: `2px solid ${c.paperEdge}` }}>
                <th style={{ fontSize: 11, color: c.inkMute, letterSpacing: 1 }}>{columnLabel.toUpperCase()}</th>
                <th style={{ fontSize: 11, color: c.inkMute, letterSpacing: 1, textAlign: "right" }}>EVENTS</th>
                <th style={{ fontSize: 11, color: c.inkMute, letterSpacing: 1, textAlign: "right" }}>CHECK-INS</th>
                <th style={{ fontSize: 11, color: c.inkMute, letterSpacing: 1, textAlign: "right" }}>RSVPS</th>
                <th style={{ fontSize: 11, color: c.inkMute, letterSpacing: 1, textAlign: "right" }}>RATE</th>
              </tr>
            </thead>
            <tbody>
              {rows.map(r => (
                <tr key={r.key} style={{ borderBottom: `1px dashed ${c.paperEdge}` }}>
                  <td style={{ fontSize: 13, fontWeight: 600, color: c.ink }}>{r.label}</td>
                  <td style={{ fontSize: 13, color: c.inkSoft, textAlign: "right" }}>{r.totalEvents}</td>
                  <td style={{ fontSize: 13, color: c.inkSoft, textAlign: "right" }}>{r.totalCheckIns}</td>
                  <td style={{ fontSize: 13, color: c.inkSoft, textAlign: "right" }}>{r.totalRsvps}</td>
                  <td style={{ fontSize: 13, color: c.inkSoft, textAlign: "right" }}>{(r.overallRate * 100).toFixed(0)}%</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </Paper>
    );
  }

  // Shared table for event ranking lists (top check-ins / lowest rate)

      const csvRows = [["Event", "Date", valueLabel, "Codes", "Prizes"]];
      events.forEach(e => csvRows.push([e.name, e.dateStr, String(valueFn(e)), codeCountMap ? (codeCountMap.get(e.id) || 0) : 0, prizeCountMap ? (prizeCountMap.get(e.id) || 0) : 0]));
      downloadCsv(`meetup-stats-${title.toLowerCase().replace(/[^a-z0-9]+/g, "-")}-${new Date().toISOString().slice(0, 10)}.csv`, csvRows);
    };
    return (
      <>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 10 }}>
          <div style={{ fontWeight: 700, fontSize: 14, color: c.ink, display: "flex", alignItems: "center", gap: 6 }}>
            {icon ? <Icon name={icon} size={14} /> : null} {title}
          </div>
          {events.length > 0 ? (
            <button onClick={exportRows} style={{ background: "none", border: "none", color: c.blue, cursor: "pointer", display: "flex", alignItems: "center", gap: 4, padding: 0 }} aria-label={`Download ${title} as CSV`}>
              <Icon name="download" size={14} />
            </button>
          ) : null}
        </div>
        {events.length === 0 ? (
          emptyMessage ? <div style={{ fontSize: 12, color: c.inkMute, textAlign: "center" }}>{emptyMessage}</div> : null
        ) : (
          <table>
            <thead>
              <tr style={{ borderBottom: `2px solid ${c.paperEdge}` }}>
                <th style={{ fontSize: 11, color: c.inkMute, letterSpacing: 1 }}>EVENT</th>

              </tr>
            </thead>
            <tbody>
              {events.map(e => {

                <tr key={e.id} style={{ borderBottom: `1px dashed ${c.paperEdge}` }}>

                    {e.url ? <a href={e.url} target="_blank" rel="noopener noreferrer" style={{ color: c.ink, textDecoration: "none" }}>{e.name}</a> : e.name}
                    {codes > 0 || prizes > 0 ? (
                      <div style={{ display: "flex", gap: 6, marginTop: 2 }}>
                        {codes > 0 ? <span style={{ fontSize: 10, color: c.blue, fontWeight: 700 }}>{codes} code{codes !== 1 ? "s" : ""}</span> : null}
                        {prizes > 0 ? <span style={{ fontSize: 10, color: c.strawberry, fontWeight: 700 }}>{prizes} prize{prizes !== 1 ? "s" : ""}</span> : null}
                      </div>

                  </td>
                  <td style={{ fontSize: 12, color: c.inkMute, whiteSpace: "nowrap" }}>{e.dateStr}</td>
                  <td style={{ fontSize: 13, color: c.inkSoft, textAlign: "right", fontWeight: 700 }}>{valueFn(e)}</td>
                </tr>
                );
              })}
            </tbody>
          </table>
        )}
      </>
    );
  }

    // v2.13.7: optional prize claim timer. "Unlimited" (0) is the default

    // set, this is informational only — see claimWindowMinutes usage on
    // the attendee "You won!" screen and the host's live countdown. No

    // v2.13.8: drawing time + location, set once per session (applies to

    const [drawingTime, setDrawingTime] = useState(""); // "" = not set, else "HH:MM" local time string
