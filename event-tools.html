    const [drawingLocationManual, setDrawingLocationManual] = useState("");
    const [savedLocations, setSavedLocations] = useState([]);
    const [showLocationForm, setShowLocationForm] = useState(false);
    const [newLocationName, setNewLocationName] = useState("");
    const [newLocationLat, setNewLocationLat] = useState("");
    const [newLocationLng, setNewLocationLng] = useState("");

    useEffect(() => {
      const unwatch1 = FB.watch("gw:prizes", (val) => { setPrizes(prizesObjToArray(val)); setLoading(false); });
      const unwatch2 = FB.watch("gw:entrants", (val) => setEntrants(entrantsObjToArray(val)));
      const unwatch3 = FB.watch("gw:templates", (val) => {
        const arr = val ? Object.entries(val).map(([id, v]) => ({ id, ...v })) : [];
        arr.sort((a, b) => (b.savedAt || 0) - (a.savedAt || 0));
        setTemplates(arr);
      });
      const unwatch4 = FB.watch("gw:locations", (val) => {
        const arr = val ? Object.entries(val).map(([id, v]) => ({ id, ...v })) : [];
        arr.sort((a, b) => (a.name || "").localeCompare(b.name || ""));
        setSavedLocations(arr);
      });
      return () => { unwatch1(); unwatch2(); unwatch3(); unwatch4(); };
    }, []);

    const addLocation = async () => {
      const name = newLocationName.trim();
      const lat = Number(newLocationLat);
      const lng = Number(newLocationLng);
      if (!name || !Number.isFinite(lat) || !Number.isFinite(lng)) return;
      const id = genId();
      await FB.set(`gw:locations/${id}`, { name, lat, lng });
      setNewLocationName("");
      setNewLocationLat("");
      setNewLocationLng("");
    };

    const removeLocation = async (id) => {
      await FB.remove(`gw:locations/${id}`);
      if (drawingLocationId === id) setDrawingLocationId("");
    };

    // Load cached Campfire events for the event picker
    useEffect(() => {
      (async () => {
        const cache = await FB.get("stats:cache");
        if (cache ? cache.events : false) {
          setCachedEvents(cache.events);
          const closest = findClosestEvent(cache.events, Date.now());
          if (closest) {
            setSelectedEventId(closest.id);
            setSelectedEventName(closest.name);
          }
        }
      })();
    }, []);

    useEffect(() => {
      const unwatch = FB.watch("gw:session", (val) => {
        const active = !!val;
        setSessionActive(active);
        if (active) { if (screen === "dashboard") setScreen("session"); }
      });
      return unwatch;
    }, []);

    const addPrize = async () => {
      const name = newPrizeName.trim();
      const qty = Math.max(1, Number(newPrizeQty) || 1);
      if (!name) return;
      const id = genId();
      const prize = { name, quantity: qty, remaining: qty, type: newPrizeType };
      if (newPrizeType === "physical") prize.description = newPrizeDesc.trim() || null;
      if (newPrizeType === "special") {
        prize.delivery = newSpecialDelivery;
        if (newSpecialDelivery === "physical") prize.description = newPrizeDesc.trim() || null;
      }
      await FB.set(`gw:prizes/${id}`, prize);
      setNewPrizeName("");
      setNewPrizeQty(1);
      setNewPrizeDesc("");
    };
    const removePrize = (id) => {
      requestConfirm("Remove this prize?", async () => {
        await FB.remove(`gw:prizes/${id}`);
      });
    };

    const toggleSelected = (id) => {
      setSelected(prev => {
        const next = new Set(prev);
        if (next.has(id)) next.delete(id); else next.add(id);
        return next;
      });
    };
    const deleteSelected = () => {
      if (!selected.size) return;
      requestConfirm(`Remove ${selected.size} selected prize${selected.size !== 1 ? 's' : ''} permanently?`, async () => {
        const updates = {};
        selected.forEach(id => { updates[`gw:prizes/${id}`] = null; });
        await FB.update(updates);
        setSelected(new Set());
      });
    };
    const removeAllPrizes = () => {
      requestConfirm("Remove all prizes? This can't be undone.", async () => {
        await FB.set("gw:prizes", null);
      });
    };
    const exitSelectMode = () => { setSelectMode(false); setSelected(new Set()); };

    // Save the current prize pool as a named template — strips id and
    // remaining (those are per-pool/per-session state, not part of the
    // reusable definition).
    const saveTemplate = async () => {
      const name = newTemplateName.trim();
      if (!name) return;
      if (!prizes.length) return;
      const id = genId();
      const template = {
        name,
        savedAt: Date.now(),
        prizes: prizes.map(p => {
          const def = { name: p.name, type: p.type, quantity: p.quantity };
          if (p.description) def.description = p.description;
          if (p.delivery) def.delivery = p.delivery;
          return def;
        }),
      };
      await FB.set(`gw:templates/${id}`, template);
      setNewTemplateName("");
      setTemplateMsg(`✓ Saved "${name}"`);
      setTimeout(() => setTemplateMsg(""), 4000);
    };

    // Apply a saved template to the current prize pool. `mode` is either
    // "replace" (clear existing prizes first) or "add" (append to the
    // existing pool). Each prize gets a fresh id and remaining = quantity.
    const applyTemplate = (template, mode) => {
      const doApply = async () => {
        if (mode === "replace") await FB.set("gw:prizes", null);
        const updates = {};
        template.prizes.forEach(def => {
          const id = genId();
          updates[`gw:prizes/${id}`] = { ...def, remaining: def.quantity };
        });
        await FB.update(updates);
        setShowTemplates(false);
        setTemplateMsg(`✓ Loaded "${template.name}"`);
        setTimeout(() => setTemplateMsg(""), 4000);
      };
      if (mode === "replace") {
        if (prizes.length) {
          requestConfirm(`Replace the current prize pool (${prizes.length} prize${prizes.length !== 1 ? 's' : ''}) with "${template.name}"?`, doApply);
        } else {
          doApply();
        }
      } else {
        doApply();
      }
    };

    const deleteTemplate = (id, name) => {
      requestConfirm(`Delete the "${name}" template? This can't be undone.`, async () => {
        await FB.remove(`gw:templates/${id}`);
      });
    };

    const startSession = async () => {
      const existing = await FB.get("gw:session");
      if (existing) { setScreen("session"); return; }
      const sessId = genId();
      // v2.13.8: drawing time/location, resolved once at session start.
      // A manually-typed location wins over a saved-location selection if
      // both are somehow present (manual entry is the more specific,
      // more recently-edited signal).
      const selectedLoc = savedLocations.find(l => l.id === drawingLocationId);
      const drawingLocationLabel = drawingLocationManual.trim() || (selectedLoc ? selectedLoc.name : "");
      const drawingLocationLat = drawingLocationManual.trim() ? null : (selectedLoc ? selectedLoc.lat : null);
      const drawingLocationLng = drawingLocationManual.trim() ? null : (selectedLoc ? selectedLoc.lng : null);
      await FB.set("gw:session", {
        id: sessId, startedAt: Date.now(), currentPrizeId: null, draws: null,
        eventId: selectedEventId || null,
        eventName: selectedEventName || null,
        // v2.13.7: 0 means unlimited claim time (no timer shown to
        // winners). Any positive number is the number of minutes a
        // winner has before the host may choose to re-roll.
        claimWindowMinutes: Number(claimWindowMinutes) || 0,
        // v2.13.8: drawing time ("HH:MM" 24h local string, or "" for not
        // set) and location (label + optional lat/lng if it came from a
        // saved location, for a future "get directions" link).
        drawingTime: drawingTime || "",
        drawingLocationLabel: drawingLocationLabel || "",
        drawingLocationLat, drawingLocationLng,
      });
      await FB.set("gw:entrants", null);
      setScreen("session");
    };

    if (loading) return <CenterMsg c={c} text="Loading…" />;

    if (screen === "session") return <GiveawaySession c={c} prizes={prizes} onExit={() => setScreen("dashboard")} />;
    if (screen === "history") return <GiveawayHistory c={c} onBack={() => setScreen("dashboard")} />;

    const totalPrizeSlots = prizes.reduce((sum, p) => sum + p.quantity, 0);

    const typeLabel = { generic: "Generic", code: "Code", physical: "Physical", special: "Special" };
    const typeColor = { generic: c.blue, code: c.purple, physical: c.orange, special: c.sun };
    const typeIcon = { generic: "gift", code: "code", physical: "gift", special: "star" };

    return (
      <div style={{ maxWidth: 460, margin: "0 auto" }}>
        <ConfirmModal confirmState={gwConfirmState} onCancel={gwCancel} onConfirm={gwConfirm} />
        <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 20 }}>
          <BackButton c={c} onClick={() => setView("home")} />
          <div style={{ flex: 1 }}>
            <div style={{ fontWeight: 700, fontSize: 22, color: "#fff", textShadow: "0 2px 4px rgba(0,0,0,0.25)", lineHeight: 1.1 }}>Giveaway</div>
            <div style={{ fontSize: 13, color: c.strawberry, fontWeight: 600, marginTop: 2 }}>Raffle</div>
          </div>
        </div>

        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, marginBottom: 16 }}>
          <Paper c={c} style={{ padding: "14px 12px", textAlign: "center" }}>
            <div style={{ fontSize: 30, fontWeight: 700, color: c.ink, lineHeight: 1 }}>{prizes.length}</div>
            <div style={{ fontSize: 11, color: c.inkMute, letterSpacing: 1.5, fontWeight: 700, marginTop: 4 }}>PRIZE TYPES</div>
          </Paper>
          <Paper c={c} style={{ padding: "14px 12px", textAlign: "center" }}>
            <div style={{ fontSize: 30, fontWeight: 700, color: c.ink, lineHeight: 1 }}>{totalPrizeSlots}</div>
            <div style={{ fontSize: 11, color: c.inkMute, letterSpacing: 1.5, fontWeight: 700, marginTop: 4 }}>WINNERS TOTAL</div>
          </Paper>
        </div>

        <div style={{ marginBottom: 16 }}>
          <StickerBtn fill={c.sun} shadow={c.sunDeep} small onClick={() => setScreen("history")} style={{ color: c.ink, display: "inline-flex", alignItems: "center", justifyContent: "center", gap: 6, width: "100%" }}>
            <Icon name="list" size={14} /> Past Giveaways
          </StickerBtn>
        </div>

        {/* ─── Prize Pool List — always visible ─── */}
        <Paper c={c} accent={c.strawberry} style={{ marginBottom: 16 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12, gap: 8 }}>
            <div style={{ fontWeight: 700, fontSize: 15, color: c.ink }}>Prize Pool</div>
            <div style={{ display: "flex", gap: 8 }}>
              <StickerBtn fill={showTemplates ? c.purple : c.paperDim} shadow={showTemplates ? c.purpleDeep : c.paperEdge} small onClick={() => setShowTemplates(!showTemplates)} style={{ color: showTemplates ? "#fff" : c.ink, padding: "6px 14px" }}>
                Templates
              </StickerBtn>
              {prizes.length > 0 ? (
                <StickerBtn fill={selectMode ? c.paperDim : c.purple} shadow={selectMode ? c.paperEdge : c.purpleDeep} small onClick={() => selectMode ? exitSelectMode() : setSelectMode(true)} style={{ color: selectMode ? c.ink : "#fff", padding: "6px 14px" }}>
                  {selectMode ? "Done" : "Select"}
                </StickerBtn>
              ) : null}
            </div>
          </div>

          {showTemplates ? (
            <div style={{ marginBottom: 12, padding: "10px 12px", background: c.paperDim, borderRadius: 10 }}>
              <div style={{ fontSize: 12, fontWeight: 700, color: c.inkSoft, marginBottom: 8 }}>Saved templates</div>
              {templates.length === 0 ? (
                <div style={{ fontSize: 12, color: c.inkMute, marginBottom: 8 }}>No templates saved yet. Build a prize pool below, then save it as a template to reuse next time.</div>
              ) : (
                <div style={{ display: "flex", flexDirection: "column", gap: 6, marginBottom: 10 }}>
                  {templates.map(t => (
                    <div key={t.id} style={{ display: "flex", alignItems: "center", gap: 8, padding: "8px 10px", background: "#fff", borderRadius: 8 }}>
                      <div style={{ flex: 1, minWidth: 0 }}>
                        <div style={{ fontWeight: 700, fontSize: 13, color: c.ink }}>{t.name}</div>
                        <div style={{ fontSize: 11, color: c.inkMute, marginTop: 2 }}>{t.prizes.length} prize{t.prizes.length !== 1 ? 's' : ''}</div>
                      </div>
                      <StickerBtn fill={c.purple} shadow={c.purpleDeep} small onClick={() => applyTemplate(t, "replace")}>Replace</StickerBtn>
                      <StickerBtn fill={c.blue} shadow={c.blueDeep} small onClick={() => applyTemplate(t, "add")}>Add</StickerBtn>
                      <button onClick={() => deleteTemplate(t.id, t.name)} style={{ background: "transparent", border: "none", color: c.strawberry, cursor: "pointer", fontSize: 16, fontWeight: 700, flexShrink: 0 }} aria-label={`Delete ${t.name} template`}>×</button>
                    </div>
                  ))}
                </div>
              )}
              {prizes.length > 0 ? (
                <div style={{ paddingTop: 10, borderTop: `1px dashed ${c.paperEdge}` }}>
                  <div style={{ fontSize: 12, fontWeight: 700, color: c.inkSoft, marginBottom: 6 }}>Save current pool ({prizes.length} prize{prizes.length !== 1 ? 's' : ''}) as a template</div>
                  <div style={{ display: "flex", gap: 8 }}>
                    <input value={newTemplateName} onChange={e => setNewTemplateName(e.target.value)} placeholder="e.g. Weekly Raid Hour" style={{ flex: 1, fontSize: 12 }} onKeyDown={e => { if (e.key === "Enter") saveTemplate(); }} />
                    <StickerBtn fill={c.purple} shadow={c.purpleDeep} small onClick={saveTemplate} disabled={!newTemplateName.trim()}>Save</StickerBtn>
                  </div>
                </div>
              ) : null}
              {templateMsg ? <div style={{ fontSize: 11, color: c.grassDeep, fontWeight: 700, marginTop: 8 }}>{templateMsg}</div> : null}
            </div>
          ) : null}

          {selectMode ? (prizes.length > 0 ? (
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10, paddingBottom: 10, borderBottom: `1px dashed ${c.paperEdge}` }}>
              <label style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 12, color: c.inkSoft, fontWeight: 600, cursor: "pointer" }}>
                <input
                  type="checkbox"
                  style={{ width: "auto", padding: 0 }}
                  checked={prizes.length > 0 ? prizes.every(x => selected.has(x.id)) : false}
                  onChange={e => {
                    setSelected(prev => {
                      const next = new Set(prev);
                      if (e.target.checked) prizes.forEach(x => next.add(x.id));
                      else prizes.forEach(x => next.delete(x.id));
                      return next;
                    });
                  }}
                />
                Select all ({prizes.length})
              </label>
              <span style={{ fontSize: 12, color: c.inkMute, fontWeight: 600 }}>{selected.size} selected</span>
            </div>
          ) : null) : null}

          {prizes.length === 0 ? (
            <div style={{ textAlign: "center", color: c.inkMute, fontSize: 13, padding: "10px 0" }}>No prizes added yet.</div>
          ) : (
            <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 12, maxHeight: 320, overflowY: "auto" }}>
              {prizes.map(p => {
                const isSel = selectMode ? selected.has(p.id) : false;
                const tc = typeColor[p.type] || c.blue;
                return (
                  <div key={p.id} style={{ display: "flex", alignItems: "center", gap: 10, padding: "10px 12px", background: isSel ? (c.purple + "1A") : c.paperDim, borderRadius: 10 }}>
                    {selectMode ? (
                      <input type="checkbox" checked={selected.has(p.id)} onChange={() => toggleSelected(p.id)} style={{ width: "auto", padding: 0, flexShrink: 0 }} />
                    ) : null}
                    <div style={{ display: "inline-flex", alignItems: "center", justifyContent: "center", width: 28, height: 28, borderRadius: 8, background: tc + "22", color: tc, flexShrink: 0 }}>
                      <Icon name={typeIcon[p.type] || "gift"} size={14} />
                    </div>
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <div style={{ fontWeight: 700, fontSize: 14, color: c.ink }}>{p.name}</div>
                      <div style={{ fontSize: 11, color: c.inkMute, marginTop: 2, display: "flex", gap: 6, flexWrap: "wrap", alignItems: "center" }}>
                        <span style={{ background: tc + "22", color: tc, padding: "1px 7px", borderRadius: 6, fontWeight: 700, fontSize: 10, letterSpacing: 0.5, textTransform: "uppercase" }}>{typeLabel[p.type] || "Generic"}</span>
                        <span>{p.quantity} winner{p.quantity !== 1 ? 's' : ''}</span>
                        {p.type === "special" ? (p.delivery ? <span>· {p.delivery === "code" ? "Code delivery" : "Physical delivery"}</span> : null) : null}
                      </div>
                      {p.description ? <div style={{ fontSize: 11, color: c.inkMute, marginTop: 2, fontStyle: "italic" }}>{p.description}</div> : null}
                    </div>
                    {!selectMode ? <button onClick={() => removePrize(p.id)} style={{ background: "transparent", border: "none", color: c.strawberry, cursor: "pointer", fontSize: 18, fontWeight: 700, flexShrink: 0 }}>×</button> : null}
                  </div>
                );
              })}
            </div>
          )}

          {selectMode ? (
            <div style={{ textAlign: "center", marginBottom: 12 }}>
              <StickerBtn fill={c.strawberry} shadow={c.strawDeep} small disabled={selected.size === 0} onClick={deleteSelected}>
                Delete selected ({selected.size})
              </StickerBtn>
            </div>
          ) : null}
          {!selectMode ? (prizes.length > 1 ? (
            <div style={{ textAlign: "center", marginBottom: 12 }}>
              <button onClick={removeAllPrizes} style={{ background: "transparent", border: "none", color: c.strawberry, cursor: "pointer", fontSize: 12, fontWeight: 600, textDecoration: "underline" }}>Remove all prizes</button>
            </div>
          ) : null) : null}
        </Paper>

        {/* ─── Start / Resume — promoted above setup ─── */}
        {sessionActive ? (
          <div style={{ textAlign: "center", marginBottom: 16, padding: "10px 14px", background: "#fff", borderRadius: 14, border: `2px solid ${c.strawberry}` }}>
            <div style={{ fontSize: 12, color: c.strawDeep, fontWeight: 700, marginBottom: 8 }}>● A giveaway is currently live</div>
            <StickerBtn fill={c.strawberry} shadow={c.strawDeep} small onClick={() => setScreen("session")}>Resume live giveaway</StickerBtn>
          </div>
        ) : (
          <>
            {/* Campfire event association */}
            <Paper c={c} accent={c.purple} style={{ marginBottom: 16, padding: "14px 16px" }}>
              <div style={{ fontSize: 12, fontWeight: 700, color: c.inkSoft, marginBottom: 8 }}>Associated Campfire event</div>
              {cachedEvents.length > 0 ? (
                <select value={selectedEventId} onChange={e => { const ev = cachedEvents.find(x => x.id === e.target.value); setSelectedEventId(ev ? ev.id : ""); setSelectedEventName(ev ? ev.name : ""); }} style={{ width: "100%", fontSize: 13, padding: "8px 10px", borderRadius: 8 }}>
                  <option value="">None (no event linked)</option>
                  {cachedEvents.map(ev => (
                    <option key={ev.id} value={ev.id}>{ev.name} — {new Date(ev.time).toLocaleDateString()}</option>
                  ))}
                </select>
              ) : (
                <div style={{ fontSize: 12, color: c.inkMute }}>No cached events. Fetch data in Meetup Stats first to enable event linking.</div>
              )}
              {selectedEventName ? (
                <div style={{ fontSize: 11, color: c.purple, fontWeight: 600, marginTop: 6 }}>This session will be linked to: {selectedEventName}</div>
              ) : null}
            </Paper>

            {/* Prize claim timer (v2.13.7) — informational only; see the
                comment on gw:session.claimWindowMinutes above. */}
            <Paper c={c} accent={c.sun} style={{ marginBottom: 16, padding: "14px 16px" }}>
              <div style={{ fontSize: 12, fontWeight: 700, color: c.inkSoft, marginBottom: 8 }}>Prize claim timer</div>
              <select value={claimWindowMinutes} onChange={e => setClaimWindowMinutes(Number(e.target.value))} style={{ height: 48, minHeight: 48, padding: "0 42px 0 14px", lineHeight: "normal" }}>
                <option value={0}>Unlimited time</option>
                <option value={5}>5 minutes</option>
                <option value={10}>10 minutes</option>
                <option value={15}>15 minutes</option>
                <option value={30}>30 minutes</option>
              </select>
              <div style={{ fontSize: 11, color: c.inkMute, marginTop: 6, lineHeight: 1.4 }}>
                {claimWindowMinutes > 0
                  ? `Winners will see a ${claimWindowMinutes}-minute countdown to claim their prize. Nothing happens automatically when it runs out — you decide whether to re-roll.`
                  : "Winners won't see a countdown — no time pressure to claim."}
              </div>
            </Paper>

            {/* Drawing time + location (v2.13.8) — shown to winners on
                their "You won!" screen and in the pre-draw alert box, so
                they know when/where to be. Set once per session, same
                scope as the claim timer above. Saved locations are a
                small reusable database (gw:locations) managed right
                here rather than a separate settings page. */}
            <Paper c={c} accent={c.purple} style={{ marginBottom: 16, padding: "14px 16px" }}>
              <div style={{ fontSize: 12, fontWeight: 700, color: c.inkSoft, marginBottom: 8 }}>Drawing time & location</div>

              <div style={{ marginBottom: 10 }}>
                <div style={{ fontSize: 11, color: c.inkMute, fontWeight: 600, marginBottom: 4 }}>Time (optional)</div>
                <input type="time" value={drawingTime} onChange={e => setDrawingTime(e.target.value)} style={{ height: 48, minHeight: 48 }} />
              </div>

              <div style={{ marginBottom: 8 }}>
                <div style={{ fontSize: 11, color: c.inkMute, fontWeight: 600, marginBottom: 4 }}>Location (optional)</div>
                {savedLocations.length > 0 ? (
                  <select
                    value={drawingLocationId}
                    onChange={e => { setDrawingLocationId(e.target.value); if (e.target.value) setDrawingLocationManual(""); }}
                    style={{ height: 48, minHeight: 48, padding: "0 42px 0 14px", lineHeight: "normal", marginBottom: 8 }}
                  >
                    <option value="">Type a location instead…</option>
                    {savedLocations.map(l => <option key={l.id} value={l.id}>{l.name}</option>)}
                  </select>
                ) : null}
                {(!savedLocations.length || !drawingLocationId) ? (
                  <input
                    value={drawingLocationManual}
                    onChange={e => { setDrawingLocationManual(e.target.value); if (e.target.value) setDrawingLocationId(""); }}
                    placeholder="e.g. Main pavilion, near the fountain"
                  />
                ) : null}
              </div>

              <button onClick={() => setShowLocationForm(!showLocationForm)} style={{ background: "none", border: "none", color: c.purple, fontWeight: 700, fontSize: 11, cursor: "pointer", textDecoration: "underline", padding: 0 }}>
                {showLocationForm ? "Hide saved locations" : "Manage saved locations"}
              </button>

              {showLocationForm ? (
                <div style={{ marginTop: 10, background: c.paperDim, borderRadius: 12, padding: "10px 12px" }}>
                  {savedLocations.length > 0 ? (
                    <div style={{ display: "flex", flexDirection: "column", gap: 6, marginBottom: 10 }}>
                      {savedLocations.map(l => (
                        <div key={l.id} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8, background: "#fff", borderRadius: 8, padding: "6px 10px" }}>
                          <div style={{ minWidth: 0 }}>
                            <div style={{ fontSize: 12, fontWeight: 700, color: c.ink }}>{l.name}</div>
                            <div style={{ fontSize: 10, color: c.inkMute, fontFamily: "monospace" }}>{l.lat}, {l.lng}</div>
                          </div>
                          <button onClick={() => removeLocation(l.id)} style={{ background: "transparent", border: "none", color: c.strawberry, cursor: "pointer", fontSize: 16, fontWeight: 700, flexShrink: 0 }}>×</button>
                        </div>
                      ))}
                    </div>
                  ) : (
                    <div style={{ fontSize: 11, color: c.inkMute, marginBottom: 10 }}>No saved locations yet.</div>
                  )}
                  <div style={{ fontSize: 11, fontWeight: 700, color: c.inkSoft, marginBottom: 6 }}>Add a location</div>
                  <input value={newLocationName} onChange={e => setNewLocationName(e.target.value)} placeholder="Name (e.g. Garden Grove Park)" style={{ marginBottom: 6, fontSize: 13, padding: "8px 10px" }} />
                  <div className="gg-date-row" style={{ marginBottom: 8 }}>
                    <div>
                      <input type="number" step="0.0001" value={newLocationLat} onChange={e => setNewLocationLat(e.target.value)} placeholder="Latitude" style={{ fontSize: 13, padding: "8px 10px" }} />
                    </div>
                    <div>
                      <input type="number" step="0.0001" value={newLocationLng} onChange={e => setNewLocationLng(e.target.value)} placeholder="Longitude" style={{ fontSize: 13, padding: "8px 10px" }} />
                    </div>
                  </div>
                  <StickerBtn fill={c.purple} shadow={c.purpleDeep} small onClick={addLocation} disabled={!newLocationName.trim() || !newLocationLat || !newLocationLng} style={{ width: "100%" }}>
                    Save location
                  </StickerBtn>
                </div>
              ) : null}
            </Paper>

            <div style={{ textAlign: "center", marginBottom: 20 }}>
              <StickerBtn fill={c.orange} shadow={c.orangeDeep} onClick={startSession} disabled={prizes.length === 0} style={{ fontSize: 17, padding: "16px 36px", display: "inline-flex", alignItems: "center", justifyContent: "center", gap: 8 }}>
                <Icon name="play" size={16} /> START GIVEAWAY
              </StickerBtn>
              {prizes.length === 0 ? <div style={{ marginTop: 10, fontSize: 12, color: c.strawberry, fontWeight: 700 }}>Add at least one prize first.</div> : null}
            </div>
          </>
        )}

        {/* ─── Setup accordion ─── */}
        <button onClick={() => setShowSetup(!showSetup)} style={{
          width: "100%", display: "flex", alignItems: "center", justifyContent: "space-between",
          background: c.paperDim, border: `2px solid ${c.paperEdge}`, borderRadius: 14,
          padding: "12px 16px", cursor: "pointer",
          fontFamily: "Fredoka, sans-serif", fontWeight: 700, fontSize: 14, color: c.inkSoft,
        }}>
          <span>{showSetup ? "Hide setup" : "Setup (add prizes)"}</span>
          <span style={{ fontSize: 18, lineHeight: 1 }}>{showSetup ? "▲" : "▼"}</span>
        </button>

        {showSetup ? (
          <div style={{ marginTop: 12 }}>
            <Paper c={c} accent={c.purple} style={{ marginBottom: 16 }}>
              <div style={{ fontWeight: 700, fontSize: 15, color: c.ink, marginBottom: 12 }}>Add Prize</div>

              {/* Type selector */}
              <div style={{ display: "flex", gap: 6, marginBottom: 12 }}>
                {["generic", "code", "physical", "special"].map(t => (
                  <button key={t} onClick={() => setNewPrizeType(t)} style={{
                    flex: 1, padding: "8px 0", borderRadius: 10, border: `2px solid ${newPrizeType === t ? (typeColor[t] || c.blue) : c.paperEdge}`,
                    background: newPrizeType === t ? (typeColor[t] || c.blue) : "#fff", color: newPrizeType === t ? "#fff" : c.inkMute,
                    fontFamily: "Fredoka, sans-serif", fontWeight: 700, fontSize: 11, cursor: "pointer", textTransform: "uppercase", letterSpacing: 0.3
                  }}>{typeLabel[t]}</button>
                ))}
              </div>

              {/* Type description */}
              <div style={{ fontSize: 11, color: c.inkMute, marginBottom: 10, lineHeight: 1.5, padding: "6px 8px", background: c.paperDim, borderRadius: 8 }}>
                {newPrizeType === "generic" ? "Basic prize — winner is announced, you hand it out." : null}
                {newPrizeType === "code" ? "Pulls a code from your Code Drop pool and reveals it on the winner's phone." : null}
                {newPrizeType === "physical" ? "Tangible prize with a description — winner is announced live." : null}
                {newPrizeType === "special" ? "Premium prize — requires you to confirm delivery on-screen." : null}
              </div>

              {/* Prize name */}
              <input value={newPrizeName} onChange={e => setNewPrizeName(e.target.value)} placeholder={
                newPrizeType === "code" ? "Prize label (e.g. Elite Raid Pass Code)" :
                newPrizeType === "physical" ? "Prize name (e.g. Pokémon Pin Set)" :
                newPrizeType === "special" ? "Prize name (e.g. Exclusive Shiny Trade)" :
                "Prize name (e.g. Sticker Pack)"
              } style={{ marginBottom: 8 }} onKeyDown={e => { if (e.key === "Enter") addPrize(); }} />

              {/* Description for physical and special-physical */}
              {(() => {
                const specialWithPhysicalDelivery = newPrizeType === "special" ? newSpecialDelivery === "physical" : false;
                return (newPrizeType === "physical" || specialWithPhysicalDelivery) ? (
                  <textarea value={newPrizeDesc} onChange={e => setNewPrizeDesc(e.target.value)} placeholder="Description (optional)" rows={2} style={{ marginBottom: 8 }} />
                ) : null;
              })()}

              {/* Special delivery type */}
              {newPrizeType === "special" ? (
                <div style={{ display: "flex", gap: 8, marginBottom: 8 }}>
                  <label style={{ flex: 1, display: "flex", alignItems: "center", gap: 8, padding: "8px 10px", borderRadius: 10, cursor: "pointer", background: newSpecialDelivery === "code" ? (c.purple + "1A") : c.paperDim, border: `2px solid ${newSpecialDelivery === "code" ? c.purple : "transparent"}` }}>
                    <input type="radio" name="specialDelivery" checked={newSpecialDelivery === "code"} onChange={() => setNewSpecialDelivery("code")} style={{ width: "auto", padding: 0 }} />
                    <div><div style={{ fontWeight: 700, fontSize: 12, color: c.ink }}>Code</div><div style={{ fontSize: 10, color: c.inkMute }}>From code pool</div></div>
                  </label>
                  <label style={{ flex: 1, display: "flex", alignItems: "center", gap: 8, padding: "8px 10px", borderRadius: 10, cursor: "pointer", background: newSpecialDelivery === "physical" ? (c.orange + "1A") : c.paperDim, border: `2px solid ${newSpecialDelivery === "physical" ? c.orange : "transparent"}` }}>
                    <input type="radio" name="specialDelivery" checked={newSpecialDelivery === "physical"} onChange={() => setNewSpecialDelivery("physical")} style={{ width: "auto", padding: 0 }} />
                    <div><div style={{ fontWeight: 700, fontSize: 12, color: c.ink }}>Physical</div><div style={{ fontSize: 10, color: c.inkMute }}>Hand-delivered</div></div>
                  </label>
                </div>
              ) : null}

              {/* Quantity + Add button */}
              <div style={{ display: "flex", gap: 8 }}>
                <input type="number" min={1} value={newPrizeQty} onChange={e => setNewPrizeQty(e.target.value)} style={{ flex: 1 }} placeholder="Qty" />
                <StickerBtn fill={c.purple} shadow={c.purpleDeep} small onClick={addPrize} disabled={!newPrizeName.trim()}>
                  <Icon name="add" size={13} /> Add
                </StickerBtn>
              </div>
            </Paper>
          </div>
        ) : null}
      </div>
    );
  }

  // ───────────────────────────────────────────────────────────
  // GIVEAWAY — LIVE SESSION (host view)
  // ───────────────────────────────────────────────────────────
  function GiveawaySession({ c, prizes, onExit }) {
    const [session, setSession] = useState(null);
    const [sessionLoaded, setSessionLoaded] = useState(false);
    const [entrants, setEntrants] = useState([]);
    const [link, setLink] = useState("");
    const [fullscreen, setFullscreen] = useState(false);
    const [manualName, setManualName] = useState("");
    const [selectedPrizeId, setSelectedPrizeId] = useState("");
    const [spinning, setSpinning] = useState(false);
    const [spinName, setSpinName] = useState("");
    const [winner, setWinner] = useState(null); // { entrantId, name, prizeId }
    const [ending, setEnding] = useState(false);
    const [endError, setEndError] = useState("");
    // For code prizes: the code assigned to the winner, and what it redeems
    const [wonCode, setWonCode] = useState(null);
    const [wonCodeReward, setWonCodeReward] = useState(null);
    // For special prizes: delivery confirmation step
    const [awaitingDelivery, setAwaitingDelivery] = useState(false);
    // v2.13.7: guards the whole confirm/re-roll button row while
    // confirmWinner's async write chain (decrementCounter, FB.update,
    // FB.push) is in flight. Without this, a double-tap on "Confirm &
    // Next" — very plausible at a loud live event — could fire
    // confirmWinner() twice before the first call's `won: true` write
    // propagated back through the gw:entrants watcher, letting the same
    // entrant get drawn and confirmed as a winner a second time.
    const [confirming, setConfirming] = useState(false);
    const { confirmState, requestConfirm, handleCancel, handleConfirm } = useConfirm();
    // v2.13.7: copy-to-clipboard winner announcement (see buildAnnouncement
    // below and its render site) — short-lived "Copied!" feedback state,
    // same pattern as PassportSession's copyLink.
    const [announceCopied, setAnnounceCopied] = useState(false);

    useEffect(() => {
      const unwatch1 = FB.watch("gw:session", (val) => { setSession(val); setSessionLoaded(true); });
      const unwatch2 = FB.watch("gw:entrants", (val) => setEntrants(entrantsObjToArray(val)));
      return () => { unwatch1(); unwatch2(); };
    }, []);

    useEffect(() => {
      if (session) {
        setLink(`${window.location.origin}${window.location.pathname}?gw_join=${session.id}`);
        if (!selectedPrizeId) { if (session.currentPrizeId) setSelectedPrizeId(session.currentPrizeId); }
      }
    }, [session]);

    if (!sessionLoaded) return <CenterMsg c={c} text="Loading giveaway…" />;

    if (!session) {
      return (
        <div style={{ maxWidth: 460, margin: "0 auto" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 20 }}>
            <BackButton c={c} onClick={onExit} />
            <div style={{ fontWeight: 700, fontSize: 22, color: "#fff", textShadow: "0 2px 4px rgba(0,0,0,0.25)", lineHeight: 1.1 }}>Giveaway</div>
          </div>
          <Paper c={c} style={{ textAlign: "center", padding: "28px 20px", color: c.inkMute }}>
            <div style={{ fontSize: 15, fontWeight: 600, color: c.ink, marginBottom: 8 }}>No giveaway is currently live</div>
            <p style={{ fontSize: 13, lineHeight: 1.5 }}>This giveaway may have ended already. Head back to the dashboard to start a new one.</p>
          </Paper>
        </div>
      );
    }

    const eligible = entrants.filter(e => !e.won);
    const remainingPrizes = prizes.filter(p => p.remaining > 0);
    const selectedPrize = prizes.find(p => p.id === selectedPrizeId);

    const typeLabel = { generic: "Generic", code: "Code", physical: "Physical", special: "Special" };
    const typeColor = { generic: c.blue, code: c.purple, physical: c.orange, special: c.sun };
    const typeIcon = { generic: "gift", code: "code", physical: "gift", special: "star" };

    const addManualEntrant = async () => {
      const name = manualName.trim();
      if (!name) return;
      if (entrants.some(e => e.name.toLowerCase() === name.toLowerCase())) {
        alert("This name is already entered.");
        return;
      }
      const id = genId();
      await FB.set(`gw:entrants/${id}`, { name, fp: null, enteredAt: Date.now(), won: false });
      setManualName("");
    };

    const removeEntrant = async (id) => {
      await FB.remove(`gw:entrants/${id}`);
    };

    // Build a weighted pool: each entrant appears (1 + extraEntries) times.
    // Used by both draw() and reroll() so bonus entries are always honoured.
    const buildWeightedPool = (source) => {
      const pool = [];
      source.forEach(e => {
        const slots = 1 + (e.extraEntries || 0);
        for (let i = 0; i < slots; i++) pool.push(e);
      });
      return pool;
    };

    const draw = () => {
      if (!selectedPrize || eligible.length === 0 || spinning || confirming) return;
      setSpinning(true);
      setWinner(null);
      setWonCode(null);
      setWonCodeReward(null);
      setAwaitingDelivery(false);
      const pool = buildWeightedPool(eligible);
      const finalPick = pool[Math.floor(Math.random() * pool.length)];
      // Slot-machine cycling animation
      let ticks = 0;
      const totalTicks = 18 + Math.floor(Math.random() * 6);
      const interval = setInterval(() => {
        const r = pool[Math.floor(Math.random() * pool.length)];
        setSpinName(r.name);
        ticks++;
        if (ticks >= totalTicks) {
          clearInterval(interval);
          setSpinName(finalPick.name);
          setSpinning(false);
          setWinner({ entrantId: finalPick.id, name: finalPick.name, prizeId: selectedPrize.id });
        }
      }, 80);
    };

    // Claim a code from cd:codes pool for code-type prizes. Uses the same
    // transaction-and-retry pattern as the attendee Code Drop flow, so a
    // giveaway draw can't collide with a simultaneous attendee QR claim.
    // Returns { value, reward } or null if no code could be claimed.
    const claimCodeForWinner = async (winnerName) => {
      const codes = codesObjToArray(await FB.get("cd:codes"));
      const candidates = codes.filter(x => !x.claimed ? !isExpired(x) : !x.claimed).sort(byClaimPriority);
      for (const candidate of candidates) {
        const { committed } = await claimCodeNode(candidate.id, winnerName + " (giveaway)");
        if (committed) return { value: candidate.value, reward: candidate.reward || null };
        // Lost the race on this one (e.g. an attendee claimed it a moment
        // ago) — try the next candidate.
      }
      return null;
    };

    const confirmWinner = async () => {
      if (!winner || confirming) return;
      const prize = prizes.find(p => p.id === winner.prizeId);
      if (!prize) return;

      // For special prizes, require delivery confirmation step first
      if (prize.type === "special") { if (!awaitingDelivery) {
        // Enter delivery confirmation mode
        setAwaitingDelivery(true);
        return;
      } }

      // v2.13.7: busy-guard the whole async chain below, and re-verify
      // against a fresh Firebase read (not local `entrants` state, which
      // may not have caught up yet) that this entrant hasn't already been
      // confirmed a winner. Closes the double-tap / two-host-devices race
      // that could otherwise draw and confirm the same person twice.
      setConfirming(true);
      try {
        const freshEntrant = await FB.get(`gw:entrants/${winner.entrantId}`);
        if (freshEntrant ? freshEntrant.won : false) {
          // Someone else's confirm already landed for this entrant —
          // don't award a second prize. Reset to a clean draw state.
          setWinner(null);
          setSpinName("");
          setAwaitingDelivery(false);
          return;
        }

        let codeValue = null;
        let codeReward = null;
        // If this is a code prize (or special w/ code delivery), claim a code
        const specialWithCodeDelivery = prize.type === "special" ? prize.delivery === "code" : false;
        if (prize.type === "code" || specialWithCodeDelivery) {
          const claimed = await claimCodeForWinner(winner.name);
          if (!claimed) {
            alert("No unclaimed codes available in the pool. Add more codes in Code Drop, or change this prize.");
            setAwaitingDelivery(false);
            return;
          }
          codeValue = claimed.value;
          codeReward = claimed.reward;
          setWonCode(codeValue);
          setWonCodeReward(codeReward);
        }

        // Build the wonPrize object for the attendee's screen
        const wonPrize = {
          name: prize.name,
          type: prize.type,
          description: prize.description || null,
          delivery: prize.delivery || null,
          confirmed: true,
          // v2.13.7: claim timer, snapshotted onto the win itself rather
          // than read live from gw:session — the session (and its
          // claimWindowMinutes) gets wiped when the giveaway ends, but a
          // winner should still be able to see how much time they had /
          // have left if they reload the claim page before then.
          claimWindowMinutes: session.claimWindowMinutes || 0,
          confirmedAt: Date.now(),
        };
        if (codeValue) wonPrize.code = codeValue;
        if (codeReward) wonPrize.codeReward = codeReward;

        // Decrement remaining via transaction — lost-update safe if the host
        // somehow double-confirms or has two devices open on this session.
        const newRemainingResult = await decrementCounter(`gw:prizes/${winner.prizeId}/remaining`);
        const newRemaining = newRemainingResult !== null ? newRemainingResult : Math.max(0, (prize.remaining ?? 1) - 1);

        const confirmedAt = Date.now();
        // Mark entrant as won + store wonPrize
        await FB.update({
          [`gw:entrants/${winner.entrantId}/won`]: true,
          [`gw:entrants/${winner.entrantId}/wonPrize`]: wonPrize,
        });
        await FB.push("gw:draws", {
          entrantId: winner.entrantId, name: winner.name,
          prizeId: winner.prizeId, prizeName: prize.name,
          prizeType: prize.type, code: codeValue || null, codeReward: codeReward || null,
          time: confirmedAt,
        });

        // v2.13.8: patch the winner's OWN My Activity record (not create
        // a new one) so it reads "Claimed [prize] @ [time]" instead of a
        // static "Giveaway Entry". Runs on the HOST's device, using the
        // uid/activityRecordId the attendee's own entry write stashed on
        // the entrant node — a guest entrant (no uid) or a pre-v2.13.8
        // entry (no activityRecordId) just silently has nothing to patch.
        if (freshEntrant ? freshEntrant.uid : false) {
          await updateProfileActivity(freshEntrant.uid, "giveawayEntries", freshEntrant.activityRecordId, {
            status: "claimed", prizeName: prize.name, claimedAt: confirmedAt,
          });
        }

        // Show code to host for a moment (for code prizes), then reset
        if (!codeValue) {
          setWinner(null);
          setSpinName("");
          setAwaitingDelivery(false);
        }
        // For code prizes, leave winner and wonCode visible until host clicks "Next"
        if (newRemaining <= 0) setSelectedPrizeId("");
      } finally {
        setConfirming(false);
      }
    };

    const dismissWinner = () => {
      setWinner(null);
      setWonCode(null);
      setWonCodeReward(null);
      setSpinName("");
      setAwaitingDelivery(false);
      setAnnounceCopied(false);
    };

    // v2.13.7: builds the shareable "you won!" text block a host can copy
    // and paste into Discord/a group chat/wherever they announce winners.
    // Short on purpose — this is meant to be dropped into a chat message
    // as-is, not edited first.
    const buildAnnouncement = () => {
      if (!winner) return "";
      const prize = prizes.find(p => p.id === winner.prizeId);
      const prizeName = prize ? prize.name : "a prize";
      return `\u0040${winner.name} you won ${prizeName}! See the host to receive the prize!`;
    };

    const copyAnnouncement = async () => {
      try {
        await navigator.clipboard.writeText(buildAnnouncement());
        setAnnounceCopied(true);
        setTimeout(() => setAnnounceCopied(false), 2500);
      } catch (e) { /* clipboard unavailable — nothing to fall back to here */ }
    };

    // Re-roll: the drawn entrant isn't available/doesn't want the prize.
    // Re-spin among the remaining eligible entrants, excluding the current
    // pick — they keep their "not yet won" status and remain eligible for
    // future draws, they just don't get this particular prize.
    // Weighted pool is rebuilt excluding the skipped entrant so bonus
    // entries are still honoured for everyone else in the re-roll.
    const reroll = () => {
      if (!winner || spinning || confirming) return;
      // v2.13.8: patch the outgoing entrant's own My Activity record so
      // it reads "Picked as winner @ [time], did not claim" instead of
      // staying stuck on "Entered". Best-effort/fire-and-forget — reroll
      // itself stays synchronous like before, this just piggybacks off
      // the local entrants array (uid/activityRecordId already exposed
      // via entrantsObjToArray) rather than adding a fresh server read.
      const outgoing = entrants.find(e => e.id === winner.entrantId);
      if (outgoing) {
      if (outgoing.uid) {
      if (outgoing.activityRecordId) {
        updateProfileActivity(outgoing.uid, "giveawayEntries", outgoing.activityRecordId, {
          status: "picked_not_claimed", pickedAt: Date.now(),
        });
      }
      }
      }
      const eligibleForReroll = eligible.filter(e => e.id !== winner.entrantId);
      setWinner(null);
      setWonCode(null);
      setWonCodeReward(null);
      setAwaitingDelivery(false);
      if (eligibleForReroll.length === 0) {
        setSpinName("No other entrants left");
        return;
      }
      setSpinning(true);
      const pool = buildWeightedPool(eligibleForReroll);
      const finalPick = pool[Math.floor(Math.random() * pool.length)];
      let ticks = 0;
      const totalTicks = 18 + Math.floor(Math.random() * 6);
      const interval = setInterval(() => {
        const r = pool[Math.floor(Math.random() * pool.length)];
        setSpinName(r.name);
        ticks++;
        if (ticks >= totalTicks) {
          clearInterval(interval);
          setSpinName(finalPick.name);
          setSpinning(false);
          setWinner({ entrantId: finalPick.id, name: finalPick.name, prizeId: selectedPrize.id });
        }
      }, 80);
    };

    // v2.13.7: renamed from endGiveaway — now the confirmed action fired
    // via requestConfirm below, rather than firing directly off the
    // button click. Ending wipes gw:entrants/gw:draws immediately with
    // no undo, so a single mistaken tap during a live event could lose
    // the whole entrant pool; this matches the confirm-gated pattern
    // already used for other destructive actions in this file (delete
    // code, remove all prizes, etc).
    const doEndGiveaway = async () => {
      setEnding(true);
      setEndError("");
      try {
        const draws = logObjToArray(await FB.get("gw:draws"));
        const historyEntry = {
          startedAt: session.startedAt,
          endedAt: Date.now(),
          draws: draws.map(({ key, ...rest }) => rest),
          eventId: session.eventId || null,
          eventName: session.eventName || null,
        };
        await FB.push("gw:history", historyEntry);
        await FB.set("gw:session", null);
        await FB.set("gw:entrants", null);
        await FB.set("gw:draws", null);
        onExit();
      } catch (e) {
        setEndError("Couldn't end giveaway: " + (e ? (e.message ? e.message : String(e)) : String(e)));
      } finally {
        setEnding(false);
      }
    };

    return (
      <div style={{ maxWidth: 460, margin: "0 auto" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 20 }}>
          <BackButton c={c} onClick={onExit} />
          <div style={{ flex: 1 }}>
            <div style={{ fontWeight: 700, fontSize: 22, color: "#fff", textShadow: "0 2px 4px rgba(0,0,0,0.25)", lineHeight: 1.1 }}>Giveaway</div>
            <div style={{ fontSize: 13, color: c.strawberry, fontWeight: 600, marginTop: 2, display: "flex", alignItems: "center", gap: 8 }}>
              ● LIVE
              {session.claimWindowMinutes > 0 ? (
                <span style={{ background: "#fff", color: c.sunDeep, borderRadius: 8, padding: "1px 8px", fontSize: 11, fontWeight: 700 }}>{session.claimWindowMinutes}-min timer</span>
              ) : null}
            </div>
          </div>
          <div style={{ background: "#fff", borderRadius: 10, padding: "6px 10px", border: `2px solid ${c.paperEdge}`, textAlign: "center" }} title="Session code — should match the code on attendees' screens">
            <div style={{ fontSize: 9, color: c.inkMute, letterSpacing: 1, fontWeight: 700 }}>SESSION</div>
            <div style={{ fontFamily: "monospace", fontSize: 14, fontWeight: 700, color: c.ink, letterSpacing: 2 }}>{sessionCode(session.id)}</div>
          </div>
        </div>

        <Paper c={c} accent={c.strawberry} style={{ textAlign: "center", marginBottom: 16, padding: "24px 20px" }}>
          <div style={{ display: "inline-block", background: c.strawDeep, color: "#fff", padding: "6px 16px", borderRadius: 10, border: "2px solid #fff", boxShadow: `0 0 0 1.5px ${c.strawDeep}, 0 2px 0 ${c.strawDeep}`, fontSize: 13, fontWeight: 700, letterSpacing: 1.5, marginBottom: 18 }}>
            Scan to enter
          </div>
          <div style={{ display: "flex", justifyContent: "center", marginBottom: 16 }}>
            <div style={{ background: "#fff", padding: 12, borderRadius: 18, border: `3px solid ${c.paperEdge}` }}>
              <QR data={link} size={fullscreen ? 240 : 180} />
            </div>
          </div>
          <StickerBtn fill={c.paperDim} shadow={c.paperEdge} small onClick={() => setFullscreen(!fullscreen)} style={{ color: c.ink, display: "inline-flex", alignItems: "center", justifyContent: "center", gap: 6 }}>
            {fullscreen ? <><Icon name="collapse" size={13} /> Smaller</> : <><Icon name="expand" size={13} /> Bigger</>}
          </StickerBtn>
        </Paper>

        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 16 }}>
          <Paper c={c} style={{ padding: "12px", textAlign: "center" }}>
            <div style={{ fontSize: 26, fontWeight: 700, color: c.ink, lineHeight: 1 }}>{eligible.length}</div>
            <div style={{ fontSize: 10, color: c.inkMute, letterSpacing: 1, fontWeight: 700, marginTop: 4 }}>ELIGIBLE ENTRANTS</div>
          </Paper>
          <Paper c={c} style={{ padding: "12px", textAlign: "center" }}>
            <div style={{ fontSize: 26, fontWeight: 700, color: c.ink, lineHeight: 1 }}>{remainingPrizes.reduce((s, p) => s + p.remaining, 0)}</div>
            <div style={{ fontSize: 10, color: c.inkMute, letterSpacing: 1, fontWeight: 700, marginTop: 4 }}>PRIZES LEFT</div>
          </Paper>
        </div>

        {/* Prize picker */}
        <Paper c={c} accent={c.purple} style={{ marginBottom: 16 }}>

                            await FB.set(`gw:entrants/${e.id}/extraEntries`, next);

                          style={{ background: c.sun, border: "none", color: "#fff", cursor: "pointer", borderRadius: 8, width: 26, height: 26, display: "inline-flex", alignItems: "center", justifyContent: "center", fontSize: 16, fontWeight: 700, lineHeight: 1 }}
