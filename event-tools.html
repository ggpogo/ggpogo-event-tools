  async function rememberTrainerNameForProfile(authUser, trainerName) {
    if (!authUser) return false;
    const cleanName = (trainerName || "").trim();
    if (!cleanName) return false;
    return FB.set(`users/${authUser.uid}/trainerName`, cleanName);
  }

  async function loadSavedProfileTrainerName(authUser) {
    if (!authUser) return "";
    const profile = await FB.get(`users/${authUser.uid}`);
    return profile ? (profile.trainerName || "") : "";
  }

  // Returns the generated activity record's id on success (or null on
  // failure/no-op), so callers that may need to UPDATE this same record
  // later — e.g. a giveaway entry that later becomes a win or a re-roll,
  // see updateProfileActivity below — can find it again without a scan.
  async function recordProfileActivity(authUser, bucket, data) {
    if (!authUser) return null;
    const id = genId();
    const payload = { ...data, recordedAt: Date.now() };
    const ok = await FB.set(`users/${authUser.uid}/activity/${bucket}/${id}`, payload);
    return ok ? id : null;
  }

  // v2.13.8: patches fields onto an EXISTING activity record (rather than
  // creating a new one) — used to turn a giveaway entry's "Entered" status
  // into "Claimed X" or "Picked as winner, did not claim" once the host
  // confirms a winner or re-rolls. uid/bucket/recordId together identify
  // the record; silently no-ops if any are missing (e.g. a guest entrant
  // with no uid — there's no profile activity to update for them).
  async function updateProfileActivity(uid, bucket, recordId, patch) {
    if (!uid || !bucket || !recordId) return false;
    return FB.update(
      Object.fromEntries(Object.entries(patch).map(([k, v]) => [`users/${uid}/activity/${bucket}/${recordId}/${k}`, v]))
    );
  }

  // The attendee landing view for logged-out visitors. Watches cd:session
  // and gw:session (both publicly readable) so it only shows tiles for
  // tools that are actually running — no dead-end buttons between events.
  // When nothing is active, shows a community landing with social links.
  function AttendeeHome({ setView, c, authUser, communityMode, onGoogleSignIn, onGuestMode, onSignOut, authBusy, authError, profileTrainerName }) {
    const [logoFailed, setLogoFailed] = useState(false);
    const [cdSession, setCdSession] = useState(undefined);
    const [gwSession, setGwSession] = useState(undefined);
    const [ppSession, setPpSession] = useState(undefined);
    const savedName = getSavedTrainerName();

    useEffect(() => {
      const u1 = FB.watch("cd:session", (val) => setCdSession(val || null));
      const u2 = FB.watch("gw:session", (val) => setGwSession(val || null));
      const u3 = FB.watch("pp:session", (val) => setPpSession(val || null));
      return () => { u1(); u2(); u3(); };
    }, []);

    const showCustomLogo = c.logoImage ? !logoFailed : c.logoImage;
    const loading = cdSession === undefined || gwSession === undefined || ppSession === undefined;
    const cdActive = !!cdSession;
    const gwActive = !!gwSession;
    const ppActive = !!ppSession;
    const anyActive = cdActive || gwActive || ppActive;

    // Campfire deep link built at runtime to avoid literal & in source
    const campfireUrl = useMemo(() => {
      const u = new URL("https://campfire.onelink.me/eBr8");
      u.searchParams.set("af_dp", "campfire://");
      u.searchParams.set("af_force_deeplink", "true");
      u.searchParams.set("deep_link_sub1", "cj1jbHVicyZjPTM3NzgzYzEyLWYzNWYtNDg4Yy04ZmQxLTM2ZWEyYjJlNGE0ZCZpPXRydWU=");
      return u.toString();
    }, []);

    // Determine greeting and user display info
    const isSignedIn = communityMode === "signed_in" ? !!authUser : false;
    const isGuest = communityMode === "guest";
    const guestDisplayName = getGuestName();
    const showSignInChooser = !isSignedIn ? !isGuest : false;
    const signedInDisplayName = profileTrainerName || savedName || "Trainer";
    const greeting = isSignedIn
      ? `Hey, ${signedInDisplayName}!`
      : isGuest
        ? (guestDisplayName ? `Hey, ${guestDisplayName}!` : (savedName ? `Hey, ${savedName}!` : "Welcome!"))
        : (savedName ? `Hey, ${savedName}!` : "Welcome!");

    return (
      <div style={{ maxWidth: 460, margin: "0 auto" }}>
        {/* Logo */}
        <div style={{ textAlign: "center", marginBottom: 24 }}>
          {showCustomLogo ? (
            <img src={c.logoImage} alt="Logo" onError={() => setLogoFailed(true)} style={{ maxWidth: 200, display: "inline-block" }} />
          ) : (

              <button onClick={onSignOut} style={{
                background: "transparent", border: "none", color: c.inkMute, fontSize: 11,

              <button onClick={() => setView("activity")} style={{
                background: c.blue + "14", border: `1.5px solid ${c.blue}33`, borderRadius: 10,
                padding: "8px 16px", cursor: "pointer",
                display: "inline-flex", alignItems: "center", gap: 6,
                fontFamily: "Fredoka, sans-serif", fontWeight: 600, fontSize: 12, color: c.blue,
              }}>
                <Icon name="list" size={13} /> My Activity
              </button>
              <button onClick={() => setView("mypassport")} style={{
                background: c.purple + "14", border: `1.5px solid ${c.purple}33`, borderRadius: 10,
                padding: "8px 16px", cursor: "pointer",
                display: "inline-flex", alignItems: "center", gap: 6,
                fontFamily: "Fredoka, sans-serif", fontWeight: 600, fontSize: 12, color: c.purple,
              }}>
                <Icon name="trophy" size={13} /> My Passport
              </button>
            </div>
          ) : null}

          {/* Guest banner */}
          {isGuest ? <GuestBanner c={c} onSignIn={onGoogleSignIn} /> : null}

          {loading ? (
            <p style={{ color: c.inkMute, fontSize: 13 }}>Checking for active events...</p>
          ) : anyActive ? (
            <>
              <p style={{ color: c.inkSoft, fontSize: 13, marginBottom: 18 }}>There's an event happening now</p>
              <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
                {cdActive ? (
                  <div onClick={() => {
                    const params = new URLSearchParams();
                    params.set("cd_claim", cdSession.id);
                    if (cdSession.claimToken) params.set("t", cdSession.claimToken);
                    window.location.href = window.location.pathname + "?" + params.toString();
                  }} style={{ cursor: "pointer" }}>
                    <Paper c={c} accent={c.blue} style={{ padding: "16px 18px" }}>
                      <div style={{ display: "flex", alignItems: "center", gap: 14 }}>
                        <IconBox emoji="📦" bg={c.blue + "33"} border={c.blueDeep} size={48} fontSize={22} />
                        <div style={{ flex: 1, textAlign: "left" }}>
                          <div style={{ fontWeight: 700, fontSize: 18, color: c.ink, lineHeight: 1 }}>Code Drop</div>
                          <div style={{ color: c.inkSoft, fontSize: 12, marginTop: 4 }}>Claim your code</div>
                        </div>
                        <div style={{ color: c.blue, fontSize: 24, fontWeight: 700 }}>›</div>
                      </div>
                    </Paper>
                  </div>
                ) : null}
                {gwActive ? (
                  <div onClick={() => { window.location.href = window.location.pathname + "?gw_join=" + gwSession.id; }} style={{ cursor: "pointer" }}>
                    <Paper c={c} accent={c.strawberry} style={{ padding: "16px 18px" }}>
                      <div style={{ display: "flex", alignItems: "center", gap: 14 }}>
                        <IconBox emoji="🎁" bg={c.strawberry + "33"} border={c.strawDeep} size={48} fontSize={22} />
                        <div style={{ flex: 1, textAlign: "left" }}>
                          <div style={{ fontWeight: 700, fontSize: 18, color: c.ink, lineHeight: 1 }}>Giveaway</div>
                          <div style={{ color: c.inkSoft, fontSize: 12, marginTop: 4 }}>Enter the raffle</div>
                        </div>
                        <div style={{ color: c.strawberry, fontSize: 24, fontWeight: 700 }}>›</div>
                      </div>
                    </Paper>
                  </div>
                ) : null}
                {ppActive ? (
                  <PassportCheckIn c={c} session={ppSession} authUser={isSignedIn ? authUser : null} onGoogleSignIn={onGoogleSignIn} authBusy={authBusy} />
                ) : null}
              </div>
            </>
          ) : (
            <>
              <p style={{ color: c.inkSoft, fontSize: 13, marginBottom: 4 }}>Garden Grove PoGo community</p>
              <div style={{ background: c.paperDim, borderRadius: 12, padding: "12px 14px", marginBottom: 18 }}>
                <p style={{ fontSize: 13, color: c.inkSoft, lineHeight: 1.5 }}>No events are running right now. Check back during our next meetup!</p>
              </div>
              <div style={{ display: "flex", justifyContent: "center", gap: 20, marginBottom: 6 }}>
                <a href="https://discord.gg/xk6AgkMgtv" target="_blank" rel="noopener noreferrer" style={{ textDecoration: "none", textAlign: "center" }}>
                  <div style={{ width: 44, height: 44, borderRadius: "50%", background: c.purple + "22", display: "flex", alignItems: "center", justifyContent: "center", margin: "0 auto 4px" }}>
                    <IconBox emoji="💬" bg="transparent" border="transparent" size={28} fontSize={18} />
                  </div>
                  <div style={{ fontSize: 11, color: c.inkSoft, fontWeight: 600 }}>Discord</div>
                </a>
                <a href="https://www.instagram.com/gardengrovepogo/" target="_blank" rel="noopener noreferrer" style={{ textDecoration: "none", textAlign: "center" }}>
                  <div style={{ width: 44, height: 44, borderRadius: "50%", background: c.strawberry + "22", display: "flex", alignItems: "center", justifyContent: "center", margin: "0 auto 4px" }}>
                    <IconBox emoji="📸" bg="transparent" border="transparent" size={28} fontSize={18} />
                  </div>
                  <div style={{ fontSize: 11, color: c.inkSoft, fontWeight: 600 }}>Instagram</div>
                </a>
                <a href={campfireUrl} target="_blank" rel="noopener noreferrer" style={{ textDecoration: "none", textAlign: "center" }}>
                  <div style={{ width: 44, height: 44, borderRadius: "50%", background: c.orange + "22", display: "flex", alignItems: "center", justifyContent: "center", margin: "0 auto 4px" }}>
                    <IconBox emoji="🔥" bg="transparent" border="transparent" size={28} fontSize={18} />
                  </div>
                  <div style={{ fontSize: 11, color: c.inkSoft, fontWeight: 600 }}>Campfire</div>
                </a>
              </div>
            </>
          )}

          {/* Sign-in section: only show chooser if not yet signed in or in guest mode */}
          {showSignInChooser ? (
            <div style={{ borderTop: `1.5px dashed ${c.paperEdge}`, marginTop: 18, paddingTop: 14 }}>
              <CommunitySignInChooser c={c} onGoogleSignIn={onGoogleSignIn} onGuestMode={onGuestMode} authBusy={authBusy} authError={authError} />
            </div>
          ) : null}
        </Paper>
        <div style={{ textAlign: "center", marginTop: 12 }}>
          <a href="/privacy-policy/" target="_blank" rel="noopener noreferrer" style={{ color: c.inkMute, fontSize: 10, fontWeight: 600, fontFamily: "Fredoka, sans-serif" }}>Privacy Policy</a>
        </div>
      </div>
    );
  }

  // ───────────────────────────────────────────────────────────
  // CODE DROP — HOST DASHBOARD
  // ───────────────────────────────────────────────────────────
  function CodeDropApp({ setView, c }) {
    const [screen, setScreen] = useState("dashboard"); // dashboard | session | manage | history
    const [codes, setCodes] = useState([]);
    const [raw, setRaw] = useState("");
    const [loading, setLoading] = useState(true);
    const [addMsg, setAddMsg] = useState("");
    const [limitEnabled, setLimitEnabled] = useState(false);
    const [limitValue, setLimitValue] = useState(10);
    const [sessionActive, setSessionActive] = useState(null); // null = checking, true/false once known
    const [expiresDate, setExpiresDate] = useState(""); // optional shared expiry for a pasted batch
    const [rewardLabel, setRewardLabel] = useState(""); // optional shared reward label for a pasted batch
    const [csvMode, setCsvMode] = useState(false); // CSV import mode (code,expiresAt,reward per line)
    // Setup panels collapsed by default when codes are already loaded
    const [showSetup, setShowSetup] = useState(false);

    // Campfire event association — auto-suggest closest event when starting a session
    const [cachedEvents, setCachedEvents] = useState([]);
    const [selectedEventId, setSelectedEventId] = useState("");
    const [selectedEventName, setSelectedEventName] = useState("");

    // Passport badge config for this session (v2.13.6) — same shape and
    // auto-detect/override pattern as PassportApp's setup screen, so a
    // Code Drop session can also award a named event badge to signed-in
    // claimers, not just Passport check-ins.
    const [eventType, setEventType] = useState("communityDay");
    const [badgeEnabled, setBadgeEnabled] = useState(true);
    const [pokemonName, setPokemonName] = useState("");
    const [iconOverrideUrl, setIconOverrideUrl] = useState("");
    const [badgeTypesEnabled, setBadgeTypesEnabled] = useState({});
    const [typeManuallySet, setTypeManuallySet] = useState(false);
    const [previewFailed, setPreviewFailed] = useState(false);

    useEffect(() => {
      const unwatch1 = FB.watch("cd:codes", (val) => { setCodes(codesObjToArray(val)); setLoading(false); });
      const unwatch2 = FB.watch("cd:settings", (val) => {
        if (val) {
          setLimitEnabled(!!val.limitEnabled);
          setLimitValue(val.limitValue || 10);
        }
      });
      return () => { unwatch1(); unwatch2(); };
    }, []);

    // Load cached Campfire events for the event picker
    useEffect(() => {
      (async () => {
        const cache = await FB.get("stats:cache");
        if (cache ? cache.events : false) {
          setCachedEvents(cache.events);
          const closest = findClosestEvent(cache.events, Date.now());
          if (closest) {
            setSelectedEventId(closest.id);
            setSelectedEventName(closest.name);
            if (!typeManuallySet) {
              const guessedType = guessEventTypeFromName(closest.name);
              if (guessedType) setEventType(guessedType);
            }
          }
        }
      })();
    }, []);

    // Shared badge-type toggle settings (same settings:passport doc
    // Passport Settings edits, so "Raid hour badges on/off" is one
    // switch that applies everywhere, not per-tool).
    useEffect(() => {
      (async () => {
        const settings = await FB.get("settings:passport");
        setBadgeTypesEnabled(settings ? (settings.badgeTypesEnabled || {}) : {});
      })();
    }, []);

    const typeAlwaysNamed = eventTypeInfo(eventType).alwaysNamed;
    const typeToggledOn = !!badgeTypesEnabled[eventType];
    const effectiveBadgeEnabled = typeAlwaysNamed ? true : (badgeEnabled ? typeToggledOn : false);

    const detectedPokemon = useMemo(() => guessPokemonNameFromEventName(selectedEventName), [selectedEventName]);
    useEffect(() => { setPokemonName(detectedPokemon); }, [detectedPokemon]);
    const previewIconUrl = iconOverrideUrl.trim() || pokemonIconUrl(pokemonName) || DEFAULT_BADGE_ICON;
    useEffect(() => { setPreviewFailed(false); }, [previewIconUrl]);

    // If a live session already exists in Firebase, jump straight to it
    // (so navigating away and back doesn't lose track of an in-progress session,
    // and so "Start New Session" can't be double-clicked to wipe an active one).
    useEffect(() => {
      const unwatch = FB.watch("cd:session", (val) => {
        const active = !!val;
        setSessionActive(active);
        if (active) { if (screen === "dashboard") setScreen("session"); }
      });
      return unwatch;
    }, []);

    const addCodes = async () => {
      if (csvMode) return addCodesCsv();
      const lines = raw.split(/[\n,]+/).map(s => s.trim()).filter(Boolean);
      if (!lines.length) return;
      const existingValues = new Set(codes.map(x => x.value.toLowerCase()));
      const seen = new Set();
      let added = 0, dupes = 0;
      const newOnes = [];
      // New codes go after the highest existing order value, so they're
      // handed out after codes already in the pool (sequential by add order).
      let nextOrder = codes.reduce((max, x) => Math.max(max, x.order || 0), 0) + 1;
      const sharedExpiry = expiresDate ? new Date(expiresDate + "T23:59:59").getTime() : null;
      const sharedReward = rewardLabel.trim() || null;
      // One timestamp for the whole batch, not per-line — a paste of
      // hundreds of codes is one "added on" moment, not hundreds of
      // microseconds apart.
      const batchAddedAt = Date.now();
      for (const v of lines) {
        const key = v.toLowerCase();
        if (existingValues.has(key) || seen.has(key)) { dupes++; continue; }
        seen.add(key);
        newOnes.push({ id: genId(), value: v, claimed: false, claimedBy: null, order: nextOrder++, expiresAt: sharedExpiry, reward: sharedReward, addedAt: batchAddedAt });
        added++;
      }
      if (newOnes.length) {
        const updated = [...codes, ...newOnes];
        await FB.set("cd:codes", codesArrayToObj(updated));
      }
      setRaw("");
      if (dupes > 0) {
        setAddMsg(`✓ ${added} code${added !== 1 ? 's' : ''} added. ${dupes} duplicate${dupes !== 1 ? 's' : ''} skipped.`);
      } else {
        setAddMsg(`✓ ${added} code${added !== 1 ? 's' : ''} added.`);
      }
      setTimeout(() => setAddMsg(""), 4000);
    };

    // CSV mode: each line is "code,expiresAt,reward" — expiresAt as
    // YYYY-MM-DD (or blank for no expiration), reward as free text (or
    // blank to fall back to the shared reward label below, if set).
    // Lets a host import a batch where different codes have different
    // expiration dates and/or different rewards (e.g. a mixed PokéCoin
    // gift card batch with varying amounts).
    const addCodesCsv = async () => {
      const lines = raw.split("\n").map(s => s.trim()).filter(Boolean);
      if (!lines.length) return;
      const existingValues = new Set(codes.map(x => x.value.toLowerCase()));
      const seen = new Set();
      let added = 0, dupes = 0, badRows = 0;
      const newOnes = [];
      let nextOrder = codes.reduce((max, x) => Math.max(max, x.order || 0), 0) + 1;
      const sharedReward = rewardLabel.trim() || null;
      const batchAddedAt = Date.now();
      for (const line of lines) {
        const parts = line.split(",").map(s => s.trim());
        const v = parts[0];
        if (!v) continue;
        const dateStr = parts[1] || "";
        let expiresAt = null;
        if (dateStr) {
          const t = new Date(dateStr + "T23:59:59").getTime();
          if (isNaN(t)) { badRows++; continue; }
          expiresAt = t;
        }
        const rewardField = (parts[2] || "").trim();
        const reward = rewardField || sharedReward;
        const key = v.toLowerCase();
        if (existingValues.has(key) || seen.has(key)) { dupes++; continue; }
        seen.add(key);
        newOnes.push({ id: genId(), value: v, claimed: false, claimedBy: null, order: nextOrder++, expiresAt, reward, addedAt: batchAddedAt });
        added++;
      }
      if (newOnes.length) {
        const updated = [...codes, ...newOnes];
        await FB.set("cd:codes", codesArrayToObj(updated));
      }
      setRaw("");
      let msg = `✓ ${added} code${added !== 1 ? 's' : ''} added.`;
      if (dupes > 0) msg += ` ${dupes} duplicate${dupes !== 1 ? 's' : ''} skipped.`;
      if (badRows > 0) msg += ` ${badRows} row${badRows !== 1 ? 's' : ''} had an unreadable date and were skipped.`;
      setAddMsg(msg);
      setTimeout(() => setAddMsg(""), 5000);
    };

    const saveSessionSettings = async (enabled, val) => {
      setLimitEnabled(enabled);
      setLimitValue(val);
      await FB.set("cd:settings", { limitEnabled: enabled, limitValue: val });
    };

    const startSession = async () => {
      // Safety check: never overwrite an in-progress session (would wipe its claims/log)
      const existing = await FB.get("cd:session");
      if (existing) { setScreen("session"); return; }
      const sessId = genId();
      const sess = {
        id: sessId, paused: false, startedAt: Date.now(),
        limitEnabled, limitValue: limitEnabled ? Number(limitValue) : null,
        claimedCount: 0,
        eventId: selectedEventId || null,
        eventName: selectedEventName || null,
        // Rotating claim token (v2.12.23) — claimToken is the currently
        // valid token; prevClaimToken is kept live for one more rotation
        // cycle so a scan right as the QR flips still succeeds.
        claimToken: newClaimToken(), prevClaimToken: null, claimTokenAt: Date.now(),
        // Passport badge config (v2.13.6) — same fields PassportSession
        // uses, so a signed-in claimer can earn this session's named
        // badge via awardPassportBadges, same as a Passport check-in.
        eventType,
        badgeEnabled: effectiveBadgeEnabled,
        iconUrl: effectiveBadgeEnabled ? (previewFailed ? DEFAULT_BADGE_ICON : previewIconUrl) : null,
      };
      await FB.set("cd:session", sess);
      await FB.set("cd:claims", {});
      await FB.set("cd:sessionLog", null);
      setScreen("session");
    };

    const unused = codes.filter(x => !x.claimed ? !isExpired(x) : !x.claimed);
    const claimed = codes.filter(x => x.claimed);
    const expired = codes.filter(x => !x.claimed ? isExpired(x) : !x.claimed);

    if (loading) return <CenterMsg c={c} text="Loading…" />;

    if (screen === "session") return <CodeDropSession c={c} codes={codes} onExit={() => setScreen("dashboard")} />;
    if (screen === "manage") return <CodeManage c={c} codes={codes} onBack={() => setScreen("dashboard")} />;
    if (screen === "history") return <SessionHistory c={c} onBack={() => setScreen("dashboard")} />;

    return (
      <div style={{ maxWidth: 460, margin: "0 auto" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 20 }}>
          <BackButton c={c} onClick={() => setView("home")} />
          <div style={{ flex: 1 }}>
            <div style={{ fontWeight: 700, fontSize: 22, color: "#fff", textShadow: "0 2px 4px rgba(0,0,0,0.25)", lineHeight: 1.1 }}>Code Drop</div>
            <div style={{ fontSize: 13, color: c.blue, fontWeight: 600, marginTop: 2 }}>Distributor</div>
          </div>
        </div>

        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, marginBottom: 16 }}>
          <Paper c={c} style={{ padding: "14px 12px", textAlign: "center" }}>
            <div style={{ fontSize: 30, fontWeight: 700, color: c.ink, lineHeight: 1 }}>{unused.length}</div>
            <div style={{ fontSize: 11, color: c.inkMute, letterSpacing: 1.5, fontWeight: 700, marginTop: 4 }}>UNUSED</div>
          </Paper>
          <Paper c={c} style={{ padding: "14px 12px", textAlign: "center" }}>
            <div style={{ fontSize: 30, fontWeight: 700, color: c.ink, lineHeight: 1 }}>{claimed.length}</div>
            <div style={{ fontSize: 11, color: c.inkMute, letterSpacing: 1.5, fontWeight: 700, marginTop: 4 }}>CLAIMED</div>
          </Paper>
        </div>

        {/* Quick links */}
        <div style={{ display: "flex", gap: 10, marginBottom: 16 }}>
          <StickerBtn fill={c.purple} shadow={c.purpleDeep} small onClick={() => setScreen("manage")} style={{ flex: 1, display: "inline-flex", alignItems: "center", justifyContent: "center", gap: 6 }}><Icon name="folder" size={14} /> Manage codes</StickerBtn>
          <StickerBtn fill={c.sun} shadow={c.sunDeep} small onClick={() => setScreen("history")} style={{ flex: 1, color: c.ink, display: "inline-flex", alignItems: "center", justifyContent: "center", gap: 6 }}><Icon name="list" size={14} /> History</StickerBtn>
        </div>

        {expired.length > 0 ? (
          <div style={{ textAlign: "center", marginBottom: 16, padding: "8px 12px", background: "#fff", borderRadius: 12, color: c.strawDeep, fontWeight: 700, fontSize: 12, border: `2px solid ${c.strawberry}`, display: "flex", alignItems: "center", justifyContent: "center", gap: 6, flexWrap: "wrap" }}>
            <Icon name="warning" size={13} /> {expired.length} unused code{expired.length !== 1 ? 's' : ''} expired and won't be handed out. <button onClick={() => setScreen("manage")} style={{ background: "none", border: "none", color: c.strawDeep, fontWeight: 700, fontSize: 12, textDecoration: "underline", cursor: "pointer", padding: 0 }}>Review in Manage Codes</button>
          </div>
        ) : null}

        {/* ─── Start / Resume — promoted to top when codes are ready ─── */}
        {sessionActive ? (
          <div style={{ textAlign: "center", marginBottom: 16, padding: "10px 14px", background: "#fff", borderRadius: 14, border: `2px solid ${c.strawberry}` }}>
            <div style={{ fontSize: 12, color: c.strawDeep, fontWeight: 700, marginBottom: 8 }}>● A session is currently live</div>
            <StickerBtn fill={c.strawberry} shadow={c.strawDeep} small onClick={() => setScreen("session")}>Resume live session</StickerBtn>
          </div>
        ) : codes.length > 0 ? (
          <>
            {/* Campfire event association */}
            <Paper c={c} accent={c.purple} style={{ marginBottom: 16, padding: "14px 16px" }}>
              <div style={{ fontSize: 12, fontWeight: 700, color: c.inkSoft, marginBottom: 8 }}>Associated Campfire event</div>
              {cachedEvents.length > 0 ? (
                <select value={selectedEventId} onChange={e => { const ev = cachedEvents.find(x => x.id === e.target.value); setSelectedEventId(ev ? ev.id : ""); setSelectedEventName(ev ? ev.name : ""); }} style={{ width: "100%", fontSize: 13, padding: "8px 10px", borderRadius: 8 }}>
                  <option value="">None (no event linked)</option>
                  {cachedEvents.map(ev => (
                    <option key={ev.id} value={ev.id}>{ev.name} — {new Date(ev.time).toLocaleDateString()}</option>
                  ))}
                </select>
              ) : (
                <div style={{ fontSize: 12, color: c.inkMute }}>No cached events. Fetch data in Meetup Stats first to enable event linking.</div>
              )}
              {selectedEventName ? (
                <div style={{ fontSize: 11, color: c.purple, fontWeight: 600, marginTop: 6 }}>This session will be linked to: {selectedEventName}</div>
              ) : null}
            </Paper>
            <div style={{ textAlign: "center", marginBottom: 20 }}>
              <StickerBtn fill={c.orange} shadow={c.orangeDeep} onClick={startSession} disabled={unused.length === 0} style={{ fontSize: 17, padding: "16px 36px", display: "inline-flex", alignItems: "center", justifyContent: "center", gap: 8 }}>
                <Icon name="play" size={16} /> START NEW SESSION
              </StickerBtn>
              {unused.length === 0 ? <div style={{ marginTop: 10, fontSize: 12, color: c.strawberry, fontWeight: 700 }}>No unused codes available. Add more below.</div> : null}
            </div>
          </>
        ) : null}

        {/* ─── Setup accordion ─── */}
        <button onClick={() => setShowSetup(!showSetup)} style={{
          width: "100%", display: "flex", alignItems: "center", justifyContent: "space-between",
          background: c.paperDim, border: `2px solid ${c.paperEdge}`, borderRadius: 14,
          padding: "12px 16px", cursor: "pointer", marginBottom: showSetup ? 0 : 0,
          fontFamily: "Fredoka, sans-serif", fontWeight: 700, fontSize: 14, color: c.inkSoft,
        }}>
          <span>{showSetup ? "Hide setup" : "Setup (add codes, session settings)"}</span>
          <span style={{ fontSize: 18, lineHeight: 1 }}>{showSetup ? "▲" : "▼"}</span>
        </button>

        {showSetup ? (
          <div style={{ marginTop: 12 }}>
            <Paper c={c} accent={c.blue} style={{ marginBottom: 16 }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
                <div style={{ fontWeight: 700, fontSize: 15, color: c.ink }}>Add Codes</div>
                <button onClick={() => setCsvMode(!csvMode)} style={{
                  background: csvMode ? c.blue : "transparent", color: csvMode ? "#fff" : c.inkMute,
                  border: `2px solid ${csvMode ? c.blue : c.paperEdge}`, borderRadius: 8, padding: "4px 10px",
                  fontFamily: "Fredoka, sans-serif", fontWeight: 700, fontSize: 11, cursor: "pointer", letterSpacing: 0.5
                }}>CSV mode</button>
              </div>
              {csvMode ? (
                <>
                  <textarea value={raw} onChange={e => setRaw(e.target.value)} placeholder={"code,expiresAt,reward\nABCD-1234-EFGH,2026-07-01,Elite Raid Pass\nWXYZ-5678-IJKL,,100 PokéCoins"} rows={5} style={{ marginBottom: 10, fontFamily: "monospace", fontSize: 13 }} />
                  <div style={{ fontSize: 11, color: c.inkMute, lineHeight: 1.5, marginBottom: 10, padding: "8px 10px", background: c.paperDim, borderRadius: 8 }}>
                    One code per line: <strong>code,expiresAt,reward</strong>. Date format <strong>YYYY-MM-DD</strong> (e.g. 2026-07-01), or leave blank for no expiration. Leave reward blank to use the batch label below for that row.
                  </div>
                  <div style={{ marginBottom: 10 }}>
                    <div style={{ fontSize: 12, fontWeight: 700, color: c.inkSoft, marginBottom: 4 }}>Batch reward label (used when a row's reward is blank)</div>
                    <input value={rewardLabel} onChange={e => setRewardLabel(e.target.value)} placeholder="e.g. Elite Raid Pass" />
                  </div>
                </>
              ) : (
                <>
                  <textarea value={raw} onChange={e => setRaw(e.target.value)} placeholder="Paste codes here, one per line..." rows={4} style={{ marginBottom: 10 }} />
                  <div className="gg-date-row" style={{ marginBottom: 10 }}>
                    <div>
                      <div style={{ fontSize: 12, fontWeight: 700, color: c.inkSoft, marginBottom: 4 }}>Reward label (optional)</div>
                      <input value={rewardLabel} onChange={e => setRewardLabel(e.target.value)} placeholder="e.g. Elite Raid Pass" />
                    </div>
                    <div>
                      <div style={{ fontSize: 12, fontWeight: 700, color: c.inkSoft, marginBottom: 4 }}>Expires (optional)</div>
                      <input type="date" value={expiresDate} onChange={e => setExpiresDate(e.target.value)} />
                    </div>
                  </div>
                  <div style={{ fontSize: 11, color: c.inkMute, lineHeight: 1.5, marginBottom: 10, padding: "8px 10px", background: c.paperDim, borderRadius: 8 }}>
                    The reward label is shown to whoever claims one of these codes, e.g. "This code redeems: Elite Raid Pass."
                  </div>
                </>
              )}
              <StickerBtn fill={c.blue} shadow={c.blueDeep} onClick={addCodes} style={{ width: "100%", padding: 14 }}>+ ADD TO POOL</StickerBtn>
              {addMsg ? <div style={{ marginTop: 10, fontSize: 12, fontWeight: 700, color: c.grassDeep, textAlign: "center" }}>{addMsg}</div> : null}
            </Paper>

            <Paper c={c} accent={c.orange} style={{ marginBottom: 16 }}>
              <div style={{ fontWeight: 700, fontSize: 15, color: c.ink, marginBottom: 10 }}>Session Settings</div>
              <label style={{ display: "flex", alignItems: "center", gap: 10, fontSize: 13, color: c.inkSoft, fontWeight: 600, marginBottom: limitEnabled ? 10 : 0, cursor: "pointer" }}>
                <input type="checkbox" checked={limitEnabled} onChange={e => saveSessionSettings(e.target.checked, limitValue)} style={{ width: "auto", padding: 0 }} />
                Limit codes given out this session
              </label>
              {limitEnabled ? (
                <input type="number" min={1} value={limitValue} onChange={e => saveSessionSettings(true, Number(e.target.value))} placeholder="Max codes to give away" />
              ) : null}
              {!limitEnabled ? <div style={{ fontSize: 12, color: c.inkMute }}>Unlimited — gives out codes until the pool runs dry.</div> : null}
            </Paper>

            {/* Passport badge config (v2.13.6) — same pattern as
                PassportApp's setup screen: event type picker, named-badge
                toggle (or auto-on notice for always-named types), and an
                icon preview/override. Lets a signed-in code claimer earn
                this session's named badge, not just Passport check-ins. */}
            <Paper c={c} accent={c.grassMid} style={{ marginBottom: 16 }}>
              <div style={{ fontWeight: 700, fontSize: 15, color: c.ink, marginBottom: 10 }}>Passport Badge</div>

              <div style={{ marginBottom: 10 }}>
                <div style={{ fontSize: 11, color: c.inkMute, fontWeight: 600, marginBottom: 4 }}>Event type</div>
                <select value={eventType} onChange={e => { setEventType(e.target.value); setTypeManuallySet(true); }} style={{ height: 48, minHeight: 48, padding: "0 42px 0 14px", lineHeight: "normal" }}>
                  {EVENT_TYPES.map(t => <option key={t.id} value={t.id}>{t.label}</option>)}
                </select>
              </div>

              {typeAlwaysNamed ? (
                <div style={{ fontSize: 12, color: c.grassDeep, fontWeight: 600, marginBottom: 10, display: "flex", alignItems: "center", gap: 6 }}>
                  <Icon name="check" size={13} /> This event gets its own badge automatically
                </div>
              ) : (
                <label style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 12, color: c.inkSoft, fontWeight: 600, cursor: typeToggledOn ? "pointer" : "not-allowed", marginBottom: 10, opacity: typeToggledOn ? 1 : 0.5 }}>
                  <input type="checkbox" checked={badgeEnabled ? typeToggledOn : false} disabled={!typeToggledOn} onChange={e => setBadgeEnabled(e.target.checked)} style={{ width: "auto" }} />
                  Give this event its own badge
                </label>
              )}
              {typeAlwaysNamed ? false : !typeToggledOn ? (
                <div style={{ fontSize: 11, color: c.inkMute, marginBottom: 10, lineHeight: 1.5 }}>
                  {eventTypeInfo(eventType).label} badges are turned off. Enable them in Passport Settings to use this here.
                </div>
              ) : null}

              {effectiveBadgeEnabled ? (
                <div style={{ background: c.paperDim, borderRadius: 14, padding: "12px 14px" }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
                    <div style={{ width: 48, height: 48, borderRadius: "50%", background: "#fff", border: `3px solid ${c.paperEdge}`, overflow: "hidden", flexShrink: 0 }}>
                      <img src={previewFailed ? DEFAULT_BADGE_ICON : previewIconUrl} onError={() => setPreviewFailed(true)} alt="" style={{ width: "100%", height: "100%", objectFit: "cover" }} />
                    </div>
                    <div style={{ flex: 1 }}>
                      <div style={{ fontSize: 11, color: c.inkMute, fontWeight: 600 }}>Badge icon</div>
                      <input value={pokemonName} onChange={e => { setPokemonName(e.target.value); setIconOverrideUrl(""); }} placeholder="Pokemon name" style={{ fontSize: 13, padding: "6px 10px", marginTop: 2 }} />
                    </div>
                  </div>
                  <details style={{ marginTop: 8 }}>
                    <summary style={{ fontSize: 11, color: c.inkMute, fontWeight: 700, cursor: "pointer" }}>Use a custom image instead</summary>
                    <input value={iconOverrideUrl} onChange={e => setIconOverrideUrl(e.target.value)} placeholder="https://..." style={{ fontSize: 12, marginTop: 6 }} />
                  </details>
                  <div style={{ fontSize: 10, color: c.inkMute, marginTop: 6, lineHeight: 1.4 }}>
                    Not found yet? The GGPoGo logo will be used until this Pokemon's icon is added to the library.
                  </div>
                </div>
              ) : null}
            </Paper>
          </div>
        ) : null}
      </div>
    );
  }

  function CenterMsg({ c, text }) {
    return <div style={{ maxWidth: 460, margin: "0 auto", textAlign: "center", color: "#fff", paddingTop: 40, fontWeight: 600 }}>{text}</div>;
  }

  // ───────────────────────────────────────────────────────────
  // SORTABLE HEADER — clickable <th> with an up/down indicator, used by
  // CodeManage. Clicking flips direction if it's already the active sort
  // field, otherwise switches to that field with the default direction.
  // ───────────────────────────────────────────────────────────
  function SortableHeader({ c, label, field, sortField, sortDir, onSort }) {
    const active = sortField === field;
    return (
      <th style={{ fontSize: 11, color: active ? c.purple : c.inkMute, letterSpacing: 1, cursor: "pointer", userSelect: "none" }} onClick={() => onSort(field)}>
        {label}{active ? (sortDir === "asc" ? " ▲" : " ▼") : ""}
      </th>
    );
  }

  // ───────────────────────────────────────────────────────────
  // CODE MANAGEMENT (CRUD table)
  // ───────────────────────────────────────────────────────────
  function CodeManage({ c, codes, onBack }) {
    const [search, setSearch] = useState("");
    const [filter, setFilter] = useState("all"); // all | unused | claimed | expired
    const [newCode, setNewCode] = useState("");
    const [newCodeExpiry, setNewCodeExpiry] = useState("");
    const [newCodeReward, setNewCodeReward] = useState("");
    const [selectMode, setSelectMode] = useState(false);
    const [selected, setSelected] = useState(() => new Set());
    // Column sort — click a header to sort by it, click again to flip
    // direction. Purely a display order for this screen; never affects
    // which code gets handed out next (that's byClaimPriority, elsewhere).
    const [sortField, setSortField] = useState("order"); // order | code | status | expires | added
    const [sortDir, setSortDir] = useState("asc"); // asc | desc
    // Bulk add (v2.12.24) — same paste/CSV pattern as the Code Drop setup
    // screen, so a host doesn't have to leave Manage Codes to bulk-import.
    const [showBulkAdd, setShowBulkAdd] = useState(false);
    const [bulkRaw, setBulkRaw] = useState("");
    const [bulkCsvMode, setBulkCsvMode] = useState(false);
    const [bulkExpiry, setBulkExpiry] = useState("");
    const [bulkReward, setBulkReward] = useState("");
    const [bulkMsg, setBulkMsg] = useState("");
    const { confirmState, requestConfirm, handleCancel, handleConfirm } = useConfirm();

    const toggle = async (id) => {
      const target = codes.find(x => x.id === id);
      if (!target) return;
      const willBeClaimed = !target.claimed;
      await FB.update({
        [`cd:codes/${id}/claimed`]: willBeClaimed,
        [`cd:codes/${id}/claimedBy`]: willBeClaimed ? (target.claimedBy || "Manually marked") : null,
        [`cd:codes/${id}/claimedAt`]: willBeClaimed ? Date.now() : null,
      });
    };
    const remove = (id) => {
      requestConfirm("Delete this code permanently?", async () => {
        await FB.remove(`cd:codes/${id}`);
      });
    };
    const addOne = async () => {
      const v = newCode.trim();
      if (!v) return;
      if (codes.some(x => x.value.toLowerCase() === v.toLowerCase())) {
        alert("This code already exists in the pool.");
        return;
      }
      const nextOrder = codes.reduce((max, x) => Math.max(max, x.order || 0), 0) + 1;
      const expiresAt = newCodeExpiry ? new Date(newCodeExpiry + "T23:59:59").getTime() : null;
      const reward = newCodeReward.trim() || null;
      const id = genId();
      await FB.set(`cd:codes/${id}`, { value: v, claimed: false, claimedBy: null, order: nextOrder, expiresAt, reward, addedAt: Date.now() });
      setNewCode("");
      setNewCodeExpiry("");
      setNewCodeReward("");
    };

    // Bulk add (v2.12.24) — line-paste mode. Mirrors CodeDropApp's
    // addCodes() so behavior (dedup, order assignment, shared
    // expiry/reward) is identical no matter which screen a host uses.
    const addBulkCodes = async () => {
      if (bulkCsvMode) return addBulkCodesCsv();
      const lines = bulkRaw.split(/[\n,]+/).map(s => s.trim()).filter(Boolean);
      if (!lines.length) return;
      const existingValues = new Set(codes.map(x => x.value.toLowerCase()));
      const seen = new Set();
      let added = 0, dupes = 0;
      const newOnes = [];
      let nextOrder = codes.reduce((max, x) => Math.max(max, x.order || 0), 0) + 1;
      const sharedExpiry = bulkExpiry ? new Date(bulkExpiry + "T23:59:59").getTime() : null;
      const sharedReward = bulkReward.trim() || null;
      const batchAddedAt = Date.now();
      for (const v of lines) {
        const key = v.toLowerCase();
        if (existingValues.has(key) || seen.has(key)) { dupes++; continue; }
        seen.add(key);
        newOnes.push({ id: genId(), value: v, claimed: false, claimedBy: null, order: nextOrder++, expiresAt: sharedExpiry, reward: sharedReward, addedAt: batchAddedAt });
        added++;
      }
      if (newOnes.length) {
        const updated = [...codes, ...newOnes];
        await FB.set("cd:codes", codesArrayToObj(updated));
      }
      setBulkRaw("");
      setBulkMsg(dupes > 0
        ? `✓ ${added} code${added !== 1 ? 's' : ''} added. ${dupes} duplicate${dupes !== 1 ? 's' : ''} skipped.`
        : `✓ ${added} code${added !== 1 ? 's' : ''} added.`);
      setTimeout(() => setBulkMsg(""), 4000);
    };

    // Bulk add — CSV mode ("code,expiresAt,reward" per line). Mirrors
    // CodeDropApp's addCodesCsv().
    const addBulkCodesCsv = async () => {
      const lines = bulkRaw.split("\n").map(s => s.trim()).filter(Boolean);
      if (!lines.length) return;
      const existingValues = new Set(codes.map(x => x.value.toLowerCase()));
      const seen = new Set();
      let added = 0, dupes = 0, badRows = 0;
      const newOnes = [];
      let nextOrder = codes.reduce((max, x) => Math.max(max, x.order || 0), 0) + 1;
      const sharedReward = bulkReward.trim() || null;
      const batchAddedAt = Date.now();
      for (const line of lines) {
        const parts = line.split(",").map(s => s.trim());
        const v = parts[0];
        if (!v) continue;
        const dateStr = parts[1] || "";
        let expiresAt = null;
        if (dateStr) {
          const t = new Date(dateStr + "T23:59:59").getTime();
          if (isNaN(t)) { badRows++; continue; }
          expiresAt = t;
        }
        const rewardField = (parts[2] || "").trim();
        const reward = rewardField || sharedReward;
        const key = v.toLowerCase();
        if (existingValues.has(key) || seen.has(key)) { dupes++; continue; }
        seen.add(key);
        newOnes.push({ id: genId(), value: v, claimed: false, claimedBy: null, order: nextOrder++, expiresAt, reward, addedAt: batchAddedAt });
        added++;
      }
      if (newOnes.length) {
        const updated = [...codes, ...newOnes];
        await FB.set("cd:codes", codesArrayToObj(updated));
      }
      setBulkRaw("");
      let msg = `✓ ${added} code${added !== 1 ? 's' : ''} added.`;
      if (dupes > 0) msg += ` ${dupes} duplicate${dupes !== 1 ? 's' : ''} skipped.`;
      if (badRows > 0) msg += ` ${badRows} row${badRows !== 1 ? 's' : ''} had an unreadable date and were skipped.`;
      setBulkMsg(msg);
      setTimeout(() => setBulkMsg(""), 5000);
    };

    const setExpiry = async (id, dateStr) => {
      const expiresAt = dateStr ? new Date(dateStr + "T23:59:59").getTime() : null;
      await FB.set(`cd:codes/${id}/expiresAt`, expiresAt);
    };
    const setReward = async (id, value) => {
      await FB.set(`cd:codes/${id}/reward`, value.trim() || null);
    };
    const deleteAllClaimed = () => {
      requestConfirm("Remove all claimed codes from the pool? This can't be undone.", async () => {
        const remaining = codes.filter(x => !x.claimed);
        await FB.set("cd:codes", codesArrayToObj(remaining));
      });
    };
    const deleteAllExpired = () => {
      requestConfirm("Remove all expired, unclaimed codes from the pool? This can't be undone.", async () => {
        const remaining = codes.filter(x => !isExpired(x) || x.claimed);
        await FB.set("cd:codes", codesArrayToObj(remaining));
      });
    };

    const toggleSelected = (id) => {
      setSelected(prev => {
        const next = new Set(prev);
        if (next.has(id)) next.delete(id); else next.add(id);
        return next;
      });
    };
    const deleteSelected = () => {
      if (!selected.size) return;
      requestConfirm(`Delete ${selected.size} selected code${selected.size !== 1 ? 's' : ''} permanently?`, async () => {
        const remaining = codes.filter(x => !selected.has(x.id));
        await FB.set("cd:codes", codesArrayToObj(remaining));
        setSelected(new Set());
      });
    };
    const exitSelectMode = () => {
      setSelectMode(false);
      setSelected(new Set());
    };

    // Status has a meaningful natural order for sorting purposes:
    // unused (still actionable) before claimed before expired (dead weight).
    const STATUS_RANK = { unused: 0, claimed: 1, expired: 2 };
    const statusOf = (x) => x.claimed ? "claimed" : (isExpired(x) ? "expired" : "unused");

    const compareByField = (a, b) => {
      switch (sortField) {
        case "code": return a.value.localeCompare(b.value);
        case "status": return STATUS_RANK[statusOf(a)] - STATUS_RANK[statusOf(b)];
        // Nulls (never-expires) sort after any real date, in both directions
        // of this base comparator — "asc" then reads as soonest-first with
        // never-expiring codes trailing, which matches how expiry actually
        // matters to a host.
        case "expires": {
          const aVal = a.expiresAt ?? Infinity, bVal = b.expiresAt ?? Infinity;
          return aVal - bVal;
        }
        // Codes added before this field existed (addedAt: null) sort after
        // codes with a real timestamp, so the newest/dated entries surface
        // first rather than an arbitrary null-vs-number comparison.
        case "added": {
          const aVal = a.addedAt ?? -Infinity, bVal = b.addedAt ?? -Infinity;
          return bVal - aVal; // newest first by default
        }
        default: return (a.order || 0) - (b.order || 0);
      }
    };

    const filtered = codes.filter(x => {
      if (filter === "unused") { if (x.claimed || isExpired(x)) return false; }
      if (filter === "claimed") { if (!x.claimed) return false; }
      // "expired" filter: show only unclaimed codes that are expired.
      // Equivalent to NOT (expired AND unclaimed), via De Morgan's law.
      if (filter === "expired") { if (!isExpired(x) || x.claimed) return false; }
      if (filter === "noreward") { if (x.reward) return false; }
      // Search matches code value, claimed-by name, or reward text.
      // Equivalent to NOT (A OR B OR C), via De Morgan's law.
      if (search) {
        const matchesCode = x.value.toLowerCase().includes(search.toLowerCase());
        const matchesClaimedBy = (x.claimedBy || "").toLowerCase().includes(search.toLowerCase());
        const matchesReward = (x.reward || "").toLowerCase().includes(search.toLowerCase());
        if (!(matchesCode || matchesClaimedBy || matchesReward)) return false;
      }
      return true;
    }).sort((a, b) => sortDir === "asc" ? compareByField(a, b) : -compareByField(a, b));

    const toggleSort = (field) => {
      if (sortField === field) { setSortDir(sortDir === "asc" ? "desc" : "asc"); return; }
      setSortField(field);
      // Each field has a sensible default direction on first click —
      // "added" defaults newest-first (desc feel, but the comparator
      // already returns newest-first for "asc" so this stays asc),
      // others default to a straightforward ascending read.
      setSortDir("asc");
    };

    const expiredUnusedCount = codes.filter(x => isExpired(x) ? !x.claimed : isExpired(x)).length;
    const noRewardCount = codes.filter(x => !x.claimed ? !x.reward : !x.claimed).length;

    return (
      <div style={{ maxWidth: 520, margin: "0 auto" }}>
        <ConfirmModal confirmState={confirmState} onCancel={handleCancel} onConfirm={handleConfirm} />
        <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 20 }}>
          <BackButton c={c} onClick={onBack} />
          <div style={{ flex: 1 }}>
            <div style={{ fontWeight: 700, fontSize: 22, color: "#fff", textShadow: "0 2px 4px rgba(0,0,0,0.25)", lineHeight: 1.1 }}>Manage Codes</div>
            <div style={{ fontSize: 13, color: c.blue, fontWeight: 600, marginTop: 2 }}>{codes.length} total</div>
          </div>
          <StickerBtn fill={selectMode ? c.paperDim : c.purple} shadow={selectMode ? c.paperEdge : c.purpleDeep} small onClick={() => selectMode ? exitSelectMode() : setSelectMode(true)} style={{ color: selectMode ? c.ink : "#fff" }}>
            {selectMode ? "Done" : "Select"}
          </StickerBtn>
        </div>

        <Paper c={c} accent={c.purple} style={{ marginBottom: 14 }}>
          <div style={{ display: "flex", gap: 8, marginBottom: 8 }}>
            <input value={newCode} onChange={e => setNewCode(e.target.value)} placeholder="Add a single code..." onKeyDown={e => { if (e.key === "Enter") addOne(); }} />
            <StickerBtn fill={c.purple} shadow={c.purpleDeep} small onClick={addOne}>Add</StickerBtn>
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 8 }}>
            <span style={{ fontSize: 11, color: c.inkMute, fontWeight: 600, whiteSpace: "nowrap" }}>Reward (optional)</span>
            <input value={newCodeReward} onChange={e => setNewCodeReward(e.target.value)} placeholder="e.g. Elite Raid Pass" style={{ flex: 1 }} />
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 10 }}>
            <span style={{ fontSize: 11, color: c.inkMute, fontWeight: 600, whiteSpace: "nowrap" }}>Expires (optional)</span>
            <input type="date" value={newCodeExpiry} onChange={e => setNewCodeExpiry(e.target.value)} style={{ flex: 1 }} />
          </div>

          <button onClick={() => setShowBulkAdd(!showBulkAdd)} style={{
            width: "100%", display: "flex", alignItems: "center", justifyContent: "space-between",
            background: "transparent", border: "none", borderTop: `1.5px dashed ${c.paperEdge}`, borderRadius: 0,
            padding: "10px 0 0", cursor: "pointer", marginBottom: showBulkAdd ? 10 : 10,
            fontFamily: "Fredoka, sans-serif", fontWeight: 700, fontSize: 12, color: c.purple,
          }}>
            <span>{showBulkAdd ? "Hide bulk add" : "Bulk add codes (paste or CSV)"}</span>
            <span style={{ fontSize: 14, lineHeight: 1 }}>{showBulkAdd ? "▲" : "▼"}</span>
          </button>

          {showBulkAdd ? (
            <div style={{ marginBottom: 10, padding: "10px 12px", background: c.paperDim, borderRadius: 12 }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
                <div style={{ fontWeight: 700, fontSize: 13, color: c.ink }}>Add multiple codes</div>
                <button onClick={() => setBulkCsvMode(!bulkCsvMode)} style={{
                  background: bulkCsvMode ? c.blue : "transparent", color: bulkCsvMode ? "#fff" : c.inkMute,
                  border: `2px solid ${bulkCsvMode ? c.blue : c.paperEdge}`, borderRadius: 8, padding: "4px 10px",
                  fontFamily: "Fredoka, sans-serif", fontWeight: 700, fontSize: 11, cursor: "pointer", letterSpacing: 0.5
                }}>CSV mode</button>
              </div>
              {bulkCsvMode ? (
                <>
                  <textarea value={bulkRaw} onChange={e => setBulkRaw(e.target.value)} placeholder={"code,expiresAt,reward\nABCD-1234-EFGH,2026-07-01,Elite Raid Pass\nWXYZ-5678-IJKL,,100 PokéCoins"} rows={5} style={{ marginBottom: 8, fontFamily: "monospace", fontSize: 12 }} />
                  <div style={{ fontSize: 11, color: c.inkMute, lineHeight: 1.5, marginBottom: 8 }}>
                    One code per line: code,expiresAt,reward. Date format YYYY-MM-DD, or leave blank for no expiration. Leave reward blank to use the batch label below.
                  </div>
                  <div style={{ marginBottom: 8 }}>
                    <div style={{ fontSize: 11, fontWeight: 700, color: c.inkSoft, marginBottom: 4 }}>Batch reward label (used when a row's reward is blank)</div>
                    <input value={bulkReward} onChange={e => setBulkReward(e.target.value)} placeholder="e.g. Elite Raid Pass" />
                  </div>
                </>
              ) : (
                <>

  // ───────────────────────────────────────────────────────────
  // SESSION HISTORY
  // ───────────────────────────────────────────────────────────
  function SessionHistory({ c, onBack }) {
    const [history, setHistory] = useState([]);
    const [loading, setLoading] = useState(true);
    const [fromDate, setFromDate] = useState("");
    const [toDate, setToDate] = useState("");

    useEffect(() => {
      const unwatch = FB.watch("cd:history", (val) => {
        const arr = val ? Object.entries(val).map(([key, v]) => ({ key, ...v })) : [];
        arr.sort((a, b) => b.endedAt - a.endedAt);
        setHistory(arr);
        setLoading(false);
      });
      return unwatch;
    }, []);

    const exportCsv = (session) => {
      const rows = [["Name", "Code", "Reward", "Time"]];
      (session.claims || []).forEach(cl => rows.push([cl.name, cl.code, cl.reward || "", new Date(cl.time).toLocaleString()]));
      downloadCsv(`codedrop-session-${new Date(session.startedAt).toISOString().slice(0, 10)}.csv`, rows);
    };

    // fromDate/toDate are YYYY-MM-DD strings (inclusive range, by session start time)
    const inRange = (h) => {
      if (fromDate) {
        const from = new Date(fromDate + "T00:00:00").getTime();
        if (h.startedAt < from) return false;
      }
      if (toDate) {
        const to = new Date(toDate + "T23:59:59").getTime();
        if (h.startedAt > to) return false;
      }
      return true;
    };

    const filteredHistory = history.filter(inRange);
    const hasRange = !!(fromDate || toDate);

    const exportCombined = (sessions, label) => {
      if (!sessions.length) { alert("No sessions to export for this range."); return; }
      const rows = [["Session Date", "Event", "Name", "Code", "Reward", "Time"]];
      sessions.forEach(h => {
        const dateLabel = new Date(h.startedAt).toLocaleDateString();
        (h.claims || []).forEach(cl => rows.push([dateLabel, h.eventName || "", cl.name, cl.code, cl.reward || "", new Date(cl.time).toLocaleString()]));
      });
      downloadCsv(`codedrop-history-${label}.csv`, rows);
    };

    return (
      <div style={{ maxWidth: 460, margin: "0 auto" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 20 }}>
          <BackButton c={c} onClick={onBack} />
          <div style={{ flex: 1 }}>
            <div style={{ fontWeight: 700, fontSize: 22, color: "#fff", textShadow: "0 2px 4px rgba(0,0,0,0.25)", lineHeight: 1.1 }}>Session History</div>
            <div style={{ fontSize: 13, color: c.blue, fontWeight: 600, marginTop: 2 }}>{history.length} past session{history.length !== 1 ? 's' : ''}</div>
          </div>
        </div>

        <Paper c={c} accent={c.blue} style={{ marginBottom: 14 }}>
          <div style={{ fontWeight: 700, fontSize: 13, color: c.ink, marginBottom: 10 }}>Export</div>
          <div className="gg-date-row" style={{ marginBottom: 10 }}>
            <div>
              <div style={{ fontSize: 11, color: c.inkMute, fontWeight: 600, marginBottom: 4 }}>From</div>
              <input type="date" value={fromDate} onChange={e => setFromDate(e.target.value)} />
            </div>
            <div>
              <div style={{ fontSize: 11, color: c.inkMute, fontWeight: 600, marginBottom: 4 }}>To</div>
              <input type="date" value={toDate} onChange={e => setToDate(e.target.value)} />
            </div>
          </div>
          <div style={{ display: "flex", gap: 8 }}>
            <StickerBtn fill={c.blue} shadow={c.blueDeep} small onClick={() => exportCombined(history, "all")} style={{ flex: 1 }}>
              <Icon name="download" size={12} /> Export all ({history.length})
            </StickerBtn>
            {hasRange ? (
              <StickerBtn fill={c.purple} shadow={c.purpleDeep} small onClick={() => exportCombined(filteredHistory, `${fromDate || "start"}_to_${toDate || "now"}`)} style={{ flex: 1 }}>
                <Icon name="download" size={12} /> Export range ({filteredHistory.length})
              </StickerBtn>
            ) : null}
          </div>
          {hasRange ? (
            <div style={{ fontSize: 11, color: c.inkMute, marginTop: 8, textAlign: "center" }}>
              Showing {filteredHistory.length} of {history.length} session{history.length !== 1 ? 's' : ''} in this range.
              <button onClick={() => { setFromDate(""); setToDate(""); }} style={{ background: "none", border: "none", color: c.blue, fontWeight: 700, cursor: "pointer", marginLeft: 6, textDecoration: "underline", fontSize: 11 }}>Clear</button>
            </div>
          ) : null}
        </Paper>

        {loading ? <CenterMsg c={c} text="Loading…" /> : null}
        {!loading ? (filteredHistory.length === 0 ? (
          <Paper c={c} style={{ textAlign: "center", padding: "28px 20px", color: c.inkMute }}>{hasRange ? "No sessions in this date range." : "No past sessions yet."}</Paper>
        ) : null) : null}
        {filteredHistory.map(h => (
          <Paper key={h.key} c={c} style={{ marginBottom: 12 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6 }}>
              <div style={{ fontWeight: 700, fontSize: 14, color: c.ink }}>{new Date(h.startedAt).toLocaleDateString()} · {new Date(h.startedAt).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}</div>
              <StickerBtn fill={c.blue} shadow={c.blueDeep} small onClick={() => exportCsv(h)}><Icon name="download" size={12} /> CSV</StickerBtn>
            </div>
            {h.eventName ? (
              <div style={{ fontSize: 11, color: c.purple, fontWeight: 600, marginBottom: 6, display: "flex", alignItems: "center", gap: 4 }}>
                <Icon name="star" size={11} /> {h.eventName}
              </div>
            ) : null}
            <div style={{ fontSize: 12, color: c.inkMute, marginBottom: 8 }}>{(h.claims || []).length} code{(h.claims || []).length !== 1 ? 's' : ''} claimed</div>
            {(h.claims || []).length > 0 ? (
              <div style={{ maxHeight: 140, overflowY: "auto" }}>
                {h.claims.map((cl, i) => (
                  <div key={i} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", fontSize: 12, padding: "4px 0", borderBottom: i < h.claims.length - 1 ? `1px dashed ${c.paperEdge}` : "none" }}>
                    <span style={{ fontWeight: 600, color: c.ink }}>
                      {cl.name}
                      {cl.reward ? <span style={{ display: "block", fontSize: 10, color: c.inkMute, fontWeight: 600 }}>{cl.reward}</span> : null}
                    </span>
                    <span style={{ fontFamily: "monospace", color: c.inkMute }}>{cl.code.length > 14 ? cl.code.slice(0, 12) + "…" : cl.code}</span>
                  </div>
                ))}
              </div>
            ) : null}
          </Paper>
        ))}
      </div>
    );
  }

  // ───────────────────────────────────────────────────────────
  // CODE DROP — LIVE SESSION (host view)
  // ───────────────────────────────────────────────────────────
  function CodeDropSession({ c, codes, onExit }) {
    const [fullscreen, setFullscreen] = useState(false);
    const [session, setSession] = useState(null);
    const [sessionLoaded, setSessionLoaded] = useState(false);
    const [link, setLink] = useState("");
    const [ending, setEnding] = useState(false);
    const [endError, setEndError] = useState("");
    const [manualMode, setManualMode] = useState(false);
    const [manualCode, setManualCode] = useState(null);
    const [manualReward, setManualReward] = useState(null);
    const [manualClaiming, setManualClaiming] = useState(false);
    const [manualError, setManualError] = useState("");

    useEffect(() => {
      const unwatch1 = FB.watch("cd:session", (val) => { setSession(val); setSessionLoaded(true); });
      return () => { unwatch1(); };
    }, []);

    useEffect(() => {
      if (session) {
        const params = new URLSearchParams();
        params.set("cd_claim", session.id);
        if (session.claimToken) params.set("t", session.claimToken);
        setLink(`${window.location.origin}${window.location.pathname}?${params.toString()}`);
      }
    }, [session ? session.claimToken : null, session ? session.id : null]);

    // Rotate the claim token on an interval so a screenshotted or
    // bookmarked QR/link goes stale within ~2 rotations (v2.12.23).
    // The outgoing token is kept as prevClaimToken for one more cycle,
    // so a scan that lands right as the QR flips still succeeds instead
    // of erroring on the attendee.
    useEffect(() => {
      if (!session || session.paused) return undefined;
      const interval = setInterval(async () => {
        const current = await FB.get("cd:session");
        if (!current || current.id !== session.id) return;
        await FB.update({
          "cd:session/claimToken": newClaimToken(),
          "cd:session/prevClaimToken": current.claimToken || null,
          "cd:session/claimTokenAt": Date.now(),
        });
      }, CLAIM_TOKEN_TTL_MS);
      return () => clearInterval(interval);
    }, [session ? session.id : null, session ? session.paused : null]);

    if (!sessionLoaded) return <CenterMsg c={c} text="Loading session…" />;

    if (!session) {
      return (
        <div style={{ maxWidth: 460, margin: "0 auto" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 20 }}>
            <BackButton c={c} onClick={onExit} />
            <div style={{ fontWeight: 700, fontSize: 22, color: "#fff", textShadow: "0 2px 4px rgba(0,0,0,0.25)", lineHeight: 1.1 }}>Code Distributor</div>
          </div>
          <Paper c={c} style={{ textAlign: "center", padding: "28px 20px", color: c.inkMute }}>
            <div style={{ fontSize: 15, fontWeight: 600, color: c.ink, marginBottom: 8 }}>No session is currently live</div>
            <p style={{ fontSize: 13, lineHeight: 1.5 }}>This session may have ended already. Head back to the dashboard to start a new one.</p>
          </Paper>
        </div>
      );
    }

    const unused = codes.filter(x => !x.claimed ? !isExpired(x) : !x.claimed);
    const claimedList = codes.filter(x => x.claimed).sort((a, b) => (b.claimedAt || 0) - (a.claimedAt || 0));
    const claimedThisSession = session.claimedCount || 0;
    const limitReached = session.limitEnabled ? claimedThisSession >= session.limitValue : session.limitEnabled;
    const lowStock = unused.length > 0 ? unused.length <= 3 : false;

    const togglePause = async () => {
      await FB.set("cd:session", { ...session, paused: !session.paused });
    };

    const endSession = async () => {
      setEnding(true);
      setEndError("");
      try {
        // Save to history
        const sessionLog = logObjToArray(await FB.get("cd:sessionLog"));
        const historyEntry = {
          startedAt: session.startedAt,
          endedAt: Date.now(),
          claims: sessionLog.map(({ key, ...rest }) => rest),
          eventId: session.eventId || null,
          eventName: session.eventName || null,
        };
        await FB.push("cd:history", historyEntry);
        await FB.set("cd:session", null);
        await FB.set("cd:claims", {});
        await FB.set("cd:sessionLog", null);
        onExit();
      } catch (e) {
        setEndError("Couldn't end session: " + (e ? (e.message ? e.message : String(e)) : String(e)));
      } finally {
        setEnding(false);
      }
    };

    const undoLast = async () => {
      const sessionLog = logObjToArray(await FB.get("cd:sessionLog"));
      if (!sessionLog.length) return;
      const last = sessionLog[sessionLog.length - 1];
      // Find the code and unclaim it (host is authenticated, so a direct node write is fine)
      const target = codes.find(x => x.value === last.code);
      if (target) await unclaimCodeNode(target.id);
      // Remove just this entrant's claim entry — NOT a full-map overwrite,
      // which could wipe out another attendee's claim that landed in
      // cd:claims between this component's last snapshot and now.
      await FB.remove(`cd:claims/${last.fp}`);
      // Remove just the last log entry by its push key
      await FB.remove(`cd:sessionLog/${last.key}`);
      // Decrement claimed count via transaction — avoids clobbering a
      // concurrent attendee claim that increments this at the same moment,
      // and avoids overwriting the whole cd:session node (which could
      // stomp a concurrent pause toggle).
      await decrementCounter("cd:session/claimedCount");
    };

    const claimManualCode = async () => {
      setManualClaiming(true);
      setManualError("");
      try {
        const freshCodes = codesObjToArray(await FB.get("cd:codes"));
        const candidates = freshCodes
          .filter(x => !x.claimed ? !isExpired(x) : false)
          .sort(byClaimPriority);
        if (candidates.length === 0) {
          setManualError("No unclaimed codes available in the pool.");
          setManualClaiming(false);
          return;
        }
        // Try each candidate until one succeeds (same retry pattern as attendee flow)
        let claimed = null;
        for (const candidate of candidates) {
          const result = await claimCodeNode(candidate.id, "Manual (host)");
          if (result.committed) {
            claimed = { value: candidate.value, reward: candidate.reward || null, id: candidate.id };
            break;
          }
        }
        if (!claimed) {
          setManualError("Could not claim a code. All candidates were taken.");
          setManualClaiming(false);
          return;
        }
        // Register under a synthetic fp key so undo can find and remove it
        const manualFp = "manual_" + Date.now();
        await FB.set(`cd:claims/${manualFp}`, claimed.id);
        await incrementCounter("cd:session/claimedCount");
        const claimTime = Date.now();
        await FB.push("cd:sessionLog", {
          name: "Manual (host)",
          code: claimed.value,
          reward: claimed.reward,
          time: claimTime,
          fp: manualFp,
          uid: null,
          entryMode: "manual",
        });
        setManualCode(claimed.value);
        setManualReward(claimed.reward);
        setManualMode(true);
      } catch (e) {
        setManualError("Error claiming code: " + (e ? (e.message ? e.message : String(e)) : "Unknown"));
      }
      setManualClaiming(false);
    };

    const dismissManual = () => {
      setManualMode(false);
      setManualCode(null);
      setManualReward(null);
      setManualError("");
    };

    return (
      <div style={{ maxWidth: 460, margin: "0 auto" }}>
        {/* ─── Manual Code Overlay ─── */}
        {manualMode ? (
          <div style={{
            position: "fixed", top: 0, left: 0, right: 0, bottom: 0,
            background: "rgba(0,0,0,0.65)", zIndex: 9999,
            display: "flex", alignItems: "center", justifyContent: "center",
            padding: 16,
          }}>
            <Paper c={c} accent={c.grassMid} style={{
              maxWidth: 380, width: "100%", textAlign: "center",
              padding: "28px 22px", position: "relative",
              maxHeight: "90vh", overflowY: "auto",
            }}>
              <Banner c={c} fill={c.grassDeep} style={{ marginBottom: 16 }}>Manual Code</Banner>

              <div style={{ background: c.paperDim, borderRadius: 18, padding: "16px 16px", marginBottom: 14, border: `2.5px dashed ${c.paperEdge}` }}>
                <div style={{ fontSize: 11, letterSpacing: 2, color: c.inkMute, fontWeight: 600, marginBottom: 8 }}>SHOW THIS CODE</div>
                <div style={{ fontFamily: "monospace", fontSize: 22, fontWeight: 700, color: c.ink, letterSpacing: 2, wordBreak: "break-all", lineHeight: 1.3 }}>{manualCode}</div>
              </div>

              <a href={`https://store.pokemongo.com/offer-redemption?passcode=${encodeURIComponent(manualCode)}`} target="_blank" rel="noopener noreferrer" style={{ textDecoration: "none", display: "block", marginBottom: 6 }}>
                <StickerBtn fill={c.grassMid} shadow={c.grassDeep} style={{ width: "100%", fontSize: 17, padding: "16px", display: "inline-flex", alignItems: "center", justifyContent: "center", gap: 8 }}><Icon name="external" size={16} /> REDEEM NOW</StickerBtn>
              </a>
              <p style={{ fontSize: 12, color: c.inkMute, marginBottom: 16 }}>Opens the store in a new tab, or let the attendee scan the QR below.</p>

              <div style={{ display: "flex", justifyContent: "center", marginBottom: 14 }}>
                <div style={{ background: "#fff", padding: 10, borderRadius: 14, border: `2px solid ${c.paperEdge}`, display: "inline-block" }}>
                  <QR data={`https://store.pokemongo.com/offer-redemption?passcode=${encodeURIComponent(manualCode)}`} size={160} />
                </div>
              </div>
              <div style={{ fontSize: 11, color: c.inkMute, marginBottom: 14 }}>Scan to go directly to the store redemption page.</div>

              {manualReward ? (
                <div style={{ display: "inline-block", background: c.sun + "33", color: c.sunDeep, padding: "6px 16px", borderRadius: 10, fontSize: 13, fontWeight: 700, marginBottom: 14 }}>
                  Redeems: {manualReward}
                </div>
              ) : null}

              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 14 }}>
                <StickerBtn fill={c.blue} shadow={c.blueDeep} small onClick={() => navigator.clipboard.writeText(manualCode)}>Copy code</StickerBtn>
                <StickerBtn fill={c.purple} shadow={c.purpleDeep} small onClick={() => { if (navigator.share) navigator.share({ title: "Code", text: manualCode }); }}>Share</StickerBtn>

              <StickerBtn fill={c.orange} shadow={c.orangeDeep} onClick={dismissManual} style={{ width: "100%", fontSize: 16, padding: 14 }}>Done</StickerBtn>
            </Paper>
          </div>
        ) : null}

        <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 20 }}>
          <BackButton c={c} onClick={onExit} />
          <div style={{ flex: 1 }}>
            <div style={{ fontWeight: 700, fontSize: 22, color: "#fff", textShadow: "0 2px 4px rgba(0,0,0,0.25)", lineHeight: 1.1 }}>Code Distributor</div>
            <div style={{ fontSize: 13, color: session.paused ? c.sun : c.strawberry, fontWeight: 600, marginTop: 2 }}>{session.paused ? "⏸ PAUSED" : "● LIVE"}</div>
          </div>
          <div style={{ background: "#fff", borderRadius: 10, padding: "6px 10px", border: `2px solid ${c.paperEdge}`, textAlign: "center" }} title="Session code — should match the code on attendees' screens">
            <div style={{ fontSize: 9, color: c.inkMute, letterSpacing: 1, fontWeight: 700 }}>SESSION</div>
            <div style={{ fontFamily: "monospace", fontSize: 14, fontWeight: 700, color: c.ink, letterSpacing: 2 }}>{sessionCode(session.id)}</div>
          </div>
