  // ───────────────────────────────────────────────────────────
  // CODE DROP — HOST DASHBOARD
  // ───────────────────────────────────────────────────────────
  function CodeDropApp({ setView, c }) {
    const [screen, setScreen] = useState("dashboard"); // dashboard | session | manage | history
    const [codes, setCodes] = useState([]);
    const [raw, setRaw] = useState("");
    const [loading, setLoading] = useState(true);
    const [addMsg, setAddMsg] = useState("");
    const [limitEnabled, setLimitEnabled] = useState(false);
    const [limitValue, setLimitValue] = useState(10);
    const [sessionActive, setSessionActive] = useState(null); // null = checking, true/false once known
    const [expiresDate, setExpiresDate] = useState(""); // optional shared expiry for a pasted batch
    const [rewardLabel, setRewardLabel] = useState(""); // optional shared reward label for a pasted batch
    const [csvMode, setCsvMode] = useState(false); // CSV import mode (code,expiresAt,reward per line)

    useEffect(() => {
      const unwatch1 = FB.watch("cd:codes", (val) => { setCodes(codesObjToArray(val)); setLoading(false); });
      const unwatch2 = FB.watch("cd:settings", (val) => {
        if (val) {
          setLimitEnabled(!!val.limitEnabled);
          setLimitValue(val.limitValue || 10);
        }
      });
      return () => { unwatch1(); unwatch2(); };
    }, []);

    // If a live session already exists in Firebase, jump straight to it
    // (so navigating away and back doesn't lose track of an in-progress session,
    // and so "Start New Session" can't be double-clicked to wipe an active one).
    useEffect(() => {
      const unwatch = FB.watch("cd:session", (val) => {
        const active = !!val;
        setSessionActive(active);
        if (active) { if (screen === "dashboard") setScreen("session"); }
      });
      return unwatch;
    }, []);

    const addCodes = async () => {
      if (csvMode) return addCodesCsv();
      const lines = raw.split(/[\n,]+/).map(s => s.trim()).filter(Boolean);
      if (!lines.length) return;
      const existingValues = new Set(codes.map(x => x.value.toLowerCase()));
      const seen = new Set();
      let added = 0, dupes = 0;
      const newOnes = [];
      // New codes go after the highest existing order value, so they're
      // handed out after codes already in the pool (sequential by add order).
      let nextOrder = codes.reduce((max, x) => Math.max(max, x.order || 0), 0) + 1;
      const sharedExpiry = expiresDate ? new Date(expiresDate + "T23:59:59").getTime() : null;
      const sharedReward = rewardLabel.trim() || null;
      for (const v of lines) {
        const key = v.toLowerCase();
        if (existingValues.has(key) || seen.has(key)) { dupes++; continue; }
        seen.add(key);
        newOnes.push({ id: genId(), value: v, claimed: false, claimedBy: null, order: nextOrder++, expiresAt: sharedExpiry, reward: sharedReward });
        added++;
      }
      if (newOnes.length) {
        const updated = [...codes, ...newOnes];
        await FB.set("cd:codes", codesArrayToObj(updated));
      }
      setRaw("");
      if (dupes > 0) {
        setAddMsg(`✓ ${added} code${added !== 1 ? 's' : ''} added. ${dupes} duplicate${dupes !== 1 ? 's' : ''} skipped.`);
      } else {
        setAddMsg(`✓ ${added} code${added !== 1 ? 's' : ''} added.`);
      }
      setTimeout(() => setAddMsg(""), 4000);
    };

    // CSV mode: each line is "code,expiresAt,reward" — expiresAt as
    // YYYY-MM-DD (or blank for no expiration), reward as free text (or
    // blank to fall back to the shared reward label below, if set).
    // Lets a host import a batch where different codes have different
    // expiration dates and/or different rewards (e.g. a mixed PokéCoin
    // gift card batch with varying amounts).
    const addCodesCsv = async () => {
      const lines = raw.split("\n").map(s => s.trim()).filter(Boolean);
      if (!lines.length) return;
      const existingValues = new Set(codes.map(x => x.value.toLowerCase()));
      const seen = new Set();
      let added = 0, dupes = 0, badRows = 0;
      const newOnes = [];
      let nextOrder = codes.reduce((max, x) => Math.max(max, x.order || 0), 0) + 1;
      const sharedReward = rewardLabel.trim() || null;
      for (const line of lines) {
        const parts = line.split(",").map(s => s.trim());
        const v = parts[0];
        if (!v) continue;
        const dateStr = parts[1] || "";
        let expiresAt = null;
        if (dateStr) {
          const t = new Date(dateStr + "T23:59:59").getTime();
          if (isNaN(t)) { badRows++; continue; }
          expiresAt = t;
        }
        const rewardField = (parts[2] || "").trim();
        const reward = rewardField || sharedReward;
        const key = v.toLowerCase();
        if (existingValues.has(key) || seen.has(key)) { dupes++; continue; }
        seen.add(key);
        newOnes.push({ id: genId(), value: v, claimed: false, claimedBy: null, order: nextOrder++, expiresAt, reward });
        added++;
      }
      if (newOnes.length) {
        const updated = [...codes, ...newOnes];
        await FB.set("cd:codes", codesArrayToObj(updated));
      }
      setRaw("");
      let msg = `✓ ${added} code${added !== 1 ? 's' : ''} added.`;
      if (dupes > 0) msg += ` ${dupes} duplicate${dupes !== 1 ? 's' : ''} skipped.`;
      if (badRows > 0) msg += ` ${badRows} row${badRows !== 1 ? 's' : ''} had an unreadable date and were skipped.`;
      setAddMsg(msg);
      setTimeout(() => setAddMsg(""), 5000);
    };

    const saveSessionSettings = async (enabled, val) => {
      setLimitEnabled(enabled);
      setLimitValue(val);
      await FB.set("cd:settings", { limitEnabled: enabled, limitValue: val });
    };

    const startSession = async () => {
      // Safety check: never overwrite an in-progress session (would wipe its claims/log)
      const existing = await FB.get("cd:session");
      if (existing) { setScreen("session"); return; }
      const sessId = genId();
      const sess = {
        id: sessId, paused: false, startedAt: Date.now(),
        limitEnabled, limitValue: limitEnabled ? Number(limitValue) : null,
        claimedCount: 0,
      };
      await FB.set("cd:session", sess);
      await FB.set("cd:claims", {});
      await FB.set("cd:sessionLog", null);
      setScreen("session");
    };

    const unused = codes.filter(x => !x.claimed ? !isExpired(x) : !x.claimed);
    const claimed = codes.filter(x => x.claimed);
    const expired = codes.filter(x => !x.claimed ? isExpired(x) : !x.claimed);

    if (loading) return <CenterMsg c={c} text="Loading…" />;

    if (screen === "session") return <CodeDropSession c={c} codes={codes} onExit={() => setScreen("dashboard")} />;
    if (screen === "manage") return <CodeManage c={c} codes={codes} onBack={() => setScreen("dashboard")} />;
    if (screen === "history") return <SessionHistory c={c} onBack={() => setScreen("dashboard")} />;

    return (
      <div style={{ maxWidth: 460, margin: "0 auto" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 20 }}>
          <BackButton c={c} onClick={() => setView("home")} />
          <div style={{ flex: 1 }}>
            <div style={{ fontWeight: 700, fontSize: 22, color: "#fff", textShadow: "0 2px 4px rgba(0,0,0,0.25)", lineHeight: 1.1 }}>Code Drop</div>
            <div style={{ fontSize: 13, color: c.blue, fontWeight: 600, marginTop: 2 }}>Distributor</div>
          </div>
        </div>

        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, marginBottom: 16 }}>
          <Paper c={c} style={{ padding: "14px 12px", textAlign: "center" }}>
            <div style={{ fontSize: 30, fontWeight: 700, color: c.ink, lineHeight: 1 }}>{unused.length}</div>
            <div style={{ fontSize: 11, color: c.inkMute, letterSpacing: 1.5, fontWeight: 700, marginTop: 4 }}>UNUSED</div>
          </Paper>
          <Paper c={c} style={{ padding: "14px 12px", textAlign: "center" }}>
            <div style={{ fontSize: 30, fontWeight: 700, color: c.ink, lineHeight: 1 }}>{claimed.length}</div>
            <div style={{ fontSize: 11, color: c.inkMute, letterSpacing: 1.5, fontWeight: 700, marginTop: 4 }}>CLAIMED</div>
          </Paper>
        </div>

        {/* Quick links */}
        <div style={{ display: "flex", gap: 10, marginBottom: 16 }}>
          <StickerBtn fill={c.purple} shadow={c.purpleDeep} small onClick={() => setScreen("manage")} style={{ flex: 1, display: "inline-flex", alignItems: "center", justifyContent: "center", gap: 6 }}><Icon name="folder" size={14} /> Manage codes</StickerBtn>
          <StickerBtn fill={c.sun} shadow={c.sunDeep} small onClick={() => setScreen("history")} style={{ flex: 1, color: c.ink, display: "inline-flex", alignItems: "center", justifyContent: "center", gap: 6 }}><Icon name="list" size={14} /> History</StickerBtn>
        </div>

        {expired.length > 0 ? (
          <div style={{ textAlign: "center", marginBottom: 16, padding: "8px 12px", background: "#fff", borderRadius: 12, color: c.strawDeep, fontWeight: 700, fontSize: 12, border: `2px solid ${c.strawberry}`, display: "flex", alignItems: "center", justifyContent: "center", gap: 6, flexWrap: "wrap" }}>
            <Icon name="warning" size={13} /> {expired.length} unused code{expired.length !== 1 ? 's' : ''} expired and won't be handed out. <button onClick={() => setScreen("manage")} style={{ background: "none", border: "none", color: c.strawDeep, fontWeight: 700, fontSize: 12, textDecoration: "underline", cursor: "pointer", padding: 0 }}>Review in Manage Codes</button>
          </div>
        ) : null}

        <Paper c={c} accent={c.blue} style={{ marginBottom: 16 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
            <div style={{ fontWeight: 700, fontSize: 15, color: c.ink }}>Add Codes</div>
            <button onClick={() => setCsvMode(!csvMode)} style={{
              background: csvMode ? c.blue : "transparent", color: csvMode ? "#fff" : c.inkMute,
              border: `2px solid ${csvMode ? c.blue : c.paperEdge}`, borderRadius: 8, padding: "4px 10px",
              fontFamily: "Fredoka, sans-serif", fontWeight: 700, fontSize: 11, cursor: "pointer", letterSpacing: 0.5
            }}>CSV mode</button>
          </div>
          {csvMode ? (
            <>
              <textarea value={raw} onChange={e => setRaw(e.target.value)} placeholder={"code,expiresAt,reward\nABCD-1234-EFGH,2026-07-01,Elite Raid Pass\nWXYZ-5678-IJKL,,100 PokéCoins"} rows={5} style={{ marginBottom: 10, fontFamily: "monospace", fontSize: 13 }} />
              <div style={{ fontSize: 11, color: c.inkMute, lineHeight: 1.5, marginBottom: 10, padding: "8px 10px", background: c.paperDim, borderRadius: 8 }}>
                One code per line: <strong>code,expiresAt,reward</strong>. Date format <strong>YYYY-MM-DD</strong> (e.g. 2026-07-01), or leave blank for no expiration. Leave reward blank to use the batch label below for that row.
              </div>
              <div style={{ marginBottom: 10 }}>
                <div style={{ fontSize: 12, fontWeight: 700, color: c.inkSoft, marginBottom: 4 }}>Batch reward label (used when a row's reward is blank)</div>
                <input value={rewardLabel} onChange={e => setRewardLabel(e.target.value)} placeholder="e.g. Elite Raid Pass" />
              </div>
            </>
          ) : (
            <>
              <textarea value={raw} onChange={e => setRaw(e.target.value)} placeholder="Paste codes here, one per line..." rows={4} style={{ marginBottom: 10 }} />
              <div style={{ display: "flex", gap: 8, marginBottom: 10 }}>
                <div style={{ flex: 1 }}>
                  <div style={{ fontSize: 12, fontWeight: 700, color: c.inkSoft, marginBottom: 4 }}>Reward label (optional)</div>
                  <input value={rewardLabel} onChange={e => setRewardLabel(e.target.value)} placeholder="e.g. Elite Raid Pass" />
                </div>
                <div style={{ flex: 1 }}>
                  <div style={{ fontSize: 12, fontWeight: 700, color: c.inkSoft, marginBottom: 4 }}>Expires (optional)</div>
                  <input type="date" value={expiresDate} onChange={e => setExpiresDate(e.target.value)} />
                </div>
              </div>
              <div style={{ fontSize: 11, color: c.inkMute, lineHeight: 1.5, marginBottom: 10, padding: "8px 10px", background: c.paperDim, borderRadius: 8 }}>
                The reward label is shown to whoever claims one of these codes, e.g. "This code redeems: Elite Raid Pass."
              </div>
            </>
          )}
          <StickerBtn fill={c.blue} shadow={c.blueDeep} onClick={addCodes} style={{ width: "100%", padding: 14 }}>+ ADD TO POOL</StickerBtn>
          {addMsg ? <div style={{ marginTop: 10, fontSize: 12, fontWeight: 700, color: c.grassDeep, textAlign: "center" }}>{addMsg}</div> : null}
        </Paper>

        <Paper c={c} accent={c.orange} style={{ marginBottom: 16 }}>
          <div style={{ fontWeight: 700, fontSize: 15, color: c.ink, marginBottom: 10 }}>Session Settings</div>
          <label style={{ display: "flex", alignItems: "center", gap: 10, fontSize: 13, color: c.inkSoft, fontWeight: 600, marginBottom: limitEnabled ? 10 : 0, cursor: "pointer" }}>
            <input type="checkbox" checked={limitEnabled} onChange={e => saveSessionSettings(e.target.checked, limitValue)} style={{ width: "auto", padding: 0 }} />
            Limit codes given out this session
          </label>
          {limitEnabled ? (
            <input type="number" min={1} value={limitValue} onChange={e => saveSessionSettings(true, Number(e.target.value))} placeholder="Max codes to give away" />
          ) : null}
          {!limitEnabled ? <div style={{ fontSize: 12, color: c.inkMute }}>Unlimited — gives out codes until the pool runs dry.</div> : null}
        </Paper>

        {sessionActive ? (
          <div style={{ textAlign: "center", marginBottom: 16, padding: "10px 14px", background: "#fff", borderRadius: 14, border: `2px solid ${c.strawberry}` }}>
            <div style={{ fontSize: 12, color: c.strawDeep, fontWeight: 700, marginBottom: 8 }}>● A session is currently live</div>
            <StickerBtn fill={c.strawberry} shadow={c.strawDeep} small onClick={() => setScreen("session")}>Resume live session</StickerBtn>
          </div>
        ) : null}

        {codes.length > 0 ? (!sessionActive ? (
          <div style={{ textAlign: "center", marginTop: 8 }}>
            <StickerBtn fill={c.orange} shadow={c.orangeDeep} onClick={startSession} disabled={unused.length === 0} style={{ fontSize: 17, padding: "16px 36px", display: "inline-flex", alignItems: "center", justifyContent: "center", gap: 8 }}>
              <Icon name="play" size={16} /> START NEW SESSION
            </StickerBtn>
            {unused.length === 0 ? <div style={{ marginTop: 10, fontSize: 12, color: c.strawberry, fontWeight: 700 }}>No unused codes available. Add more above.</div> : null}
          </div>
        ) : null) : null}
      </div>
    );
  }

  function CenterMsg({ c, text }) {
    return <div style={{ maxWidth: 460, margin: "0 auto", textAlign: "center", color: "#fff", paddingTop: 40, fontWeight: 600 }}>{text}</div>;
  }

  // ───────────────────────────────────────────────────────────
  // CODE MANAGEMENT (CRUD table)
  // ───────────────────────────────────────────────────────────
  function CodeManage({ c, codes, onBack }) {
    const [search, setSearch] = useState("");
    const [filter, setFilter] = useState("all"); // all | unused | claimed | expired
    const [newCode, setNewCode] = useState("");
    const [newCodeExpiry, setNewCodeExpiry] = useState("");
    const [newCodeReward, setNewCodeReward] = useState("");
    const [selectMode, setSelectMode] = useState(false);
    const [selected, setSelected] = useState(() => new Set());

    const toggle = async (id) => {
      const target = codes.find(x => x.id === id);
      if (!target) return;
      const willBeClaimed = !target.claimed;
      await FB.update({
        [`cd:codes/${id}/claimed`]: willBeClaimed,
        [`cd:codes/${id}/claimedBy`]: willBeClaimed ? (target.claimedBy || "Manually marked") : null,
      });
    };
    const remove = async (id) => {
      if (!confirm("Delete this code permanently?")) return;
      await FB.remove(`cd:codes/${id}`);
    };
    const addOne = async () => {
      const v = newCode.trim();
      if (!v) return;
      if (codes.some(x => x.value.toLowerCase() === v.toLowerCase())) {
        alert("This code already exists in the pool.");
        return;
      }
      const nextOrder = codes.reduce((max, x) => Math.max(max, x.order || 0), 0) + 1;
      const expiresAt = newCodeExpiry ? new Date(newCodeExpiry + "T23:59:59").getTime() : null;
      const reward = newCodeReward.trim() || null;
      const id = genId();
      await FB.set(`cd:codes/${id}`, { value: v, claimed: false, claimedBy: null, order: nextOrder, expiresAt, reward });
      setNewCode("");
      setNewCodeExpiry("");
      setNewCodeReward("");
    };
    const setExpiry = async (id, dateStr) => {
      const expiresAt = dateStr ? new Date(dateStr + "T23:59:59").getTime() : null;
      await FB.set(`cd:codes/${id}/expiresAt`, expiresAt);
    };
    const setReward = async (id, value) => {
      await FB.set(`cd:codes/${id}/reward`, value.trim() || null);
    };
    const deleteAllClaimed = async () => {
      if (!confirm("Remove all claimed codes from the pool? This can't be undone.")) return;
      const remaining = codes.filter(x => !x.claimed);
      await FB.set("cd:codes", codesArrayToObj(remaining));
    };
    const deleteAllExpired = async () => {
      if (!confirm("Remove all expired, unclaimed codes from the pool? This can't be undone.")) return;
      // Keep codes that are NOT (expired AND unclaimed) — i.e. drop only
      // expired+unclaimed codes. De Morgan's law: NOT (A AND B) equals (NOT A OR NOT B).
      const remaining = codes.filter(x => !isExpired(x) || x.claimed);
      await FB.set("cd:codes", codesArrayToObj(remaining));
    };

    const toggleSelected = (id) => {
      setSelected(prev => {
        const next = new Set(prev);
        if (next.has(id)) next.delete(id); else next.add(id);
        return next;
      });
    };
    const deleteSelected = async () => {
      if (!selected.size) return;
      if (!confirm(`Delete ${selected.size} selected code${selected.size !== 1 ? 's' : ''} permanently?`)) return;
      const remaining = codes.filter(x => !selected.has(x.id));
      await FB.set("cd:codes", codesArrayToObj(remaining));
      setSelected(new Set());
    };
    const exitSelectMode = () => {
      setSelectMode(false);
      setSelected(new Set());
    };

    const filtered = codes.filter(x => {
      if (filter === "unused") { if (x.claimed || isExpired(x)) return false; }
      if (filter === "claimed") { if (!x.claimed) return false; }
      // "expired" filter: show only unclaimed codes that are expired.
      // Equivalent to NOT (expired AND unclaimed), via De Morgan's law.
      if (filter === "expired") { if (!isExpired(x) || x.claimed) return false; }
      if (filter === "noreward") { if (x.reward) return false; }
      // Search matches code value, claimed-by name, or reward text.
      // Equivalent to NOT (A OR B OR C), via De Morgan's law.
      if (search) {
        const matchesCode = x.value.toLowerCase().includes(search.toLowerCase());
        const matchesClaimedBy = (x.claimedBy || "").toLowerCase().includes(search.toLowerCase());
        const matchesReward = (x.reward || "").toLowerCase().includes(search.toLowerCase());
        if (!(matchesCode || matchesClaimedBy || matchesReward)) return false;
      }
      return true;
    }).sort((a, b) => (a.order || 0) - (b.order || 0));

    const expiredUnusedCount = codes.filter(x => isExpired(x) ? !x.claimed : isExpired(x)).length;
    const noRewardCount = codes.filter(x => !x.claimed ? !x.reward : !x.claimed).length;

    return (
      <div style={{ maxWidth: 520, margin: "0 auto" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 20 }}>
          <BackButton c={c} onClick={onBack} />
          <div style={{ flex: 1 }}>
            <div style={{ fontWeight: 700, fontSize: 22, color: "#fff", textShadow: "0 2px 4px rgba(0,0,0,0.25)", lineHeight: 1.1 }}>Manage Codes</div>
            <div style={{ fontSize: 13, color: c.blue, fontWeight: 600, marginTop: 2 }}>{codes.length} total</div>
          </div>
          <StickerBtn fill={selectMode ? c.paperDim : c.purple} shadow={selectMode ? c.paperEdge : c.purpleDeep} small onClick={() => selectMode ? exitSelectMode() : setSelectMode(true)} style={{ color: selectMode ? c.ink : "#fff" }}>
            {selectMode ? "Done" : "Select"}
          </StickerBtn>
        </div>

        <Paper c={c} accent={c.purple} style={{ marginBottom: 14 }}>
          <div style={{ display: "flex", gap: 8, marginBottom: 8 }}>
            <input value={newCode} onChange={e => setNewCode(e.target.value)} placeholder="Add a single code..." onKeyDown={e => { if (e.key === "Enter") addOne(); }} />
            <StickerBtn fill={c.purple} shadow={c.purpleDeep} small onClick={addOne}>Add</StickerBtn>
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 8 }}>
            <span style={{ fontSize: 11, color: c.inkMute, fontWeight: 600, whiteSpace: "nowrap" }}>Reward (optional)</span>
            <input value={newCodeReward} onChange={e => setNewCodeReward(e.target.value)} placeholder="e.g. Elite Raid Pass" style={{ flex: 1 }} />
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 10 }}>
            <span style={{ fontSize: 11, color: c.inkMute, fontWeight: 600, whiteSpace: "nowrap" }}>Expires (optional)</span>
            <input type="date" value={newCodeExpiry} onChange={e => setNewCodeExpiry(e.target.value)} style={{ flex: 1 }} />
          </div>
          <input value={search} onChange={e => setSearch(e.target.value)} placeholder="Search codes, names, or rewards..." style={{ marginBottom: 10 }} />
          <div style={{ display: "flex", gap: 8, marginBottom: 8 }}>
            {["all", "unused", "claimed", "expired"].map(f => (
              <button key={f} onClick={() => setFilter(f)} style={{
                flex: 1, padding: "8px 0", borderRadius: 10, border: `2px solid ${filter === f ? c.purple : c.paperEdge}`,
                background: filter === f ? c.purple : "#fff", color: filter === f ? "#fff" : c.inkMute,
                fontFamily: "Fredoka, sans-serif", fontWeight: 700, fontSize: 11, cursor: "pointer", textTransform: "uppercase", letterSpacing: 0.5
              }}>{f}{f === "expired" ? (expiredUnusedCount > 0 ? ` (${expiredUnusedCount})` : "") : ""}</button>
            ))}
          </div>
          <div style={{ display: "flex", gap: 8 }}>
            <button onClick={() => setFilter(filter === "noreward" ? "all" : "noreward")} style={{
              flex: 1, padding: "8px 0", borderRadius: 10, border: `2px solid ${filter === "noreward" ? c.orange : c.paperEdge}`,
              background: filter === "noreward" ? c.orange : "#fff", color: filter === "noreward" ? "#fff" : c.inkMute,
              fontFamily: "Fredoka, sans-serif", fontWeight: 700, fontSize: 11, cursor: "pointer", textTransform: "uppercase", letterSpacing: 0.5
            }}>No reward set{noRewardCount > 0 ? ` (${noRewardCount})` : ""}</button>
          </div>
          {selectMode ? (
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: 10, paddingTop: 10, borderTop: `1px dashed ${c.paperEdge}` }}>
              <label style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 12, color: c.inkSoft, fontWeight: 600, cursor: "pointer" }}>
                <input
                  type="checkbox"
                  style={{ width: "auto", padding: 0 }}
                  checked={filtered.length > 0 ? filtered.every(x => selected.has(x.id)) : false}
                  onChange={e => {
                    setSelected(prev => {
                      const next = new Set(prev);
                      if (e.target.checked) filtered.forEach(x => next.add(x.id));
                      else filtered.forEach(x => next.delete(x.id));
                      return next;
                    });
                  }}
                />
                Select all shown ({filtered.length})
              </label>
              <span style={{ fontSize: 12, color: c.inkMute, fontWeight: 600 }}>{selected.size} selected</span>
            </div>
          ) : null}
        </Paper>

        <Paper c={c}>
          {filtered.length === 0 ? (
            <div style={{ textAlign: "center", color: c.inkMute, padding: "20px 0", fontSize: 13 }}>No codes match.</div>
          ) : (
            <div style={{ maxHeight: 420, overflowY: "auto" }}>
              <table>
                <thead>
                  <tr style={{ borderBottom: `2px solid ${c.paperEdge}` }}>
                    {selectMode ? <th style={{ width: 28 }}></th> : null}
                    <th style={{ fontSize: 11, color: c.inkMute, letterSpacing: 1 }}>CODE</th>
                    <th style={{ fontSize: 11, color: c.inkMute, letterSpacing: 1 }}>STATUS</th>
                    <th style={{ fontSize: 11, color: c.inkMute, letterSpacing: 1 }}>EXPIRES</th>
                    <th style={{ fontSize: 11, color: c.inkMute, letterSpacing: 1 }}></th>
                  </tr>
                </thead>
                <tbody>
                  {filtered.map(x => {
                    const isSel = selectMode ? selected.has(x.id) : false;
                    const rowBg = isSel ? (c.purple + "1A") : "transparent";
                    const expired = isExpired(x);
                    let statusLabel = x.claimed ? "CLAIMED" : (expired ? "EXPIRED" : "UNUSED");
                    let statusBg = x.claimed ? c.grassMid + "33" : (expired ? c.strawberry + "33" : c.sun + "33");
                    let statusColor = x.claimed ? c.grassDeep : (expired ? c.strawDeep : c.sunDeep);
                    return (
                    <tr key={x.id} style={{ borderBottom: `1px dashed ${c.paperEdge}`, background: rowBg }}>
                      {selectMode ? (
                        <td>
                          <input type="checkbox" checked={selected.has(x.id)} onChange={() => toggleSelected(x.id)} style={{ width: "auto", padding: 0 }} />
                        </td>
                      ) : null}
                      <td style={{ fontFamily: "monospace", fontSize: 13, color: c.ink, wordBreak: "break-all" }}>
                        {x.value}
                        {x.claimedBy ? <div style={{ fontSize: 11, color: c.inkMute, fontFamily: "Fredoka, sans-serif" }}>by {x.claimedBy}</div> : null}
                        <input
                          defaultValue={x.reward || ""}
                          onBlur={e => { if (e.target.value !== (x.reward || "")) setReward(x.id, e.target.value); }}
                          placeholder="Reward (e.g. Elite Raid Pass)"
                          style={{ marginTop: 4, padding: "3px 6px", fontSize: 11, borderRadius: 6, fontFamily: "Fredoka, sans-serif", width: "100%", boxSizing: "border-box" }}
                        />
                      </td>
                      <td>
                        <button onClick={() => { if (!expired) toggle(x.id); }} disabled={expired ? !x.claimed : expired} style={{
                          fontSize: 11, fontWeight: 700, letterSpacing: 1, padding: "4px 10px", borderRadius: 8, border: "none", cursor: (expired ? !x.claimed : expired) ? "default" : "pointer",
                          background: statusBg, color: statusColor
                        }}>
                          {statusLabel}
                        </button>
                      </td>
                      <td>
                        <input
                          type="date"
                          value={x.expiresAt ? new Date(x.expiresAt).toISOString().slice(0, 10) : ""}
                          onChange={e => setExpiry(x.id, e.target.value)}
                          style={{ padding: "4px 6px", fontSize: 11, borderRadius: 8, minWidth: 100 }}
                        />
                      </td>
                      <td>
                        {!selectMode ? <button onClick={() => remove(x.id)} style={{ background: "transparent", border: "none", color: c.strawberry, cursor: "pointer", fontSize: 16, fontWeight: 700 }}>×</button> : null}
                      </td>
                    </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          )}
        </Paper>

        <div style={{ textAlign: "center", marginTop: 16, display: "flex", flexDirection: "column", gap: 8, alignItems: "center" }}>
          {selectMode ? (
            <StickerBtn fill={c.strawberry} shadow={c.strawDeep} small disabled={selected.size === 0} onClick={deleteSelected}>
              Delete selected ({selected.size})
            </StickerBtn>
          ) : (
            <>
              <StickerBtn fill={c.strawberry} shadow={c.strawDeep} small onClick={deleteAllClaimed}>Clear all claimed codes</StickerBtn>
              {expiredUnusedCount > 0 ? (
                <StickerBtn fill={c.paperDim} shadow={c.paperEdge} small onClick={deleteAllExpired} style={{ color: c.ink }}>Clear expired codes ({expiredUnusedCount})</StickerBtn>
              ) : null}
            </>
          )}
        </div>
      </div>
    );
  }

  // ───────────────────────────────────────────────────────────
  // SESSION HISTORY
  // ───────────────────────────────────────────────────────────
  function SessionHistory({ c, onBack }) {
    const [history, setHistory] = useState([]);
    const [loading, setLoading] = useState(true);
    const [fromDate, setFromDate] = useState("");
    const [toDate, setToDate] = useState("");

    useEffect(() => {
      const unwatch = FB.watch("cd:history", (val) => {
        const arr = val ? Object.entries(val).map(([key, v]) => ({ key, ...v })) : [];
        arr.sort((a, b) => b.endedAt - a.endedAt);
        setHistory(arr);
        setLoading(false);
      });
      return unwatch;
    }, []);

    const downloadCsv = (filename, rows) => {
      const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(",")).join("\n");
      const blob = new Blob([csv], { type: "text/csv" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
    };

    const exportCsv = (session) => {
      const rows = [["Name", "Code", "Reward", "Time"]];
      (session.claims || []).forEach(cl => rows.push([cl.name, cl.code, cl.reward || "", new Date(cl.time).toLocaleString()]));
      downloadCsv(`codedrop-session-${new Date(session.startedAt).toISOString().slice(0, 10)}.csv`, rows);
    };

    // fromDate/toDate are YYYY-MM-DD strings (inclusive range, by session start time)
    const inRange = (h) => {
      if (fromDate) {
        const from = new Date(fromDate + "T00:00:00").getTime();
        if (h.startedAt < from) return false;
      }
      if (toDate) {
        const to = new Date(toDate + "T23:59:59").getTime();
        if (h.startedAt > to) return false;
      }
      return true;
    };

    const filteredHistory = history.filter(inRange);
    const hasRange = !!(fromDate || toDate);

    const exportCombined = (sessions, label) => {
      if (!sessions.length) { alert("No sessions to export for this range."); return; }
      const rows = [["Session Date", "Name", "Code", "Reward", "Time"]];
      sessions.forEach(h => {
        const dateLabel = new Date(h.startedAt).toLocaleDateString();
        (h.claims || []).forEach(cl => rows.push([dateLabel, cl.name, cl.code, cl.reward || "", new Date(cl.time).toLocaleString()]));
      });
      downloadCsv(`codedrop-history-${label}.csv`, rows);
    };

    return (
      <div style={{ maxWidth: 460, margin: "0 auto" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 20 }}>
          <BackButton c={c} onClick={onBack} />
          <div style={{ flex: 1 }}>
            <div style={{ fontWeight: 700, fontSize: 22, color: "#fff", textShadow: "0 2px 4px rgba(0,0,0,0.25)", lineHeight: 1.1 }}>Session History</div>
            <div style={{ fontSize: 13, color: c.blue, fontWeight: 600, marginTop: 2 }}>{history.length} past session{history.length !== 1 ? 's' : ''}</div>
          </div>
        </div>

        <Paper c={c} accent={c.blue} style={{ marginBottom: 14 }}>
          <div style={{ fontWeight: 700, fontSize: 13, color: c.ink, marginBottom: 10 }}>Export</div>
          <div style={{ display: "flex", gap: 8, marginBottom: 10 }}>
            <div style={{ flex: 1 }}>
              <div style={{ fontSize: 11, color: c.inkMute, fontWeight: 600, marginBottom: 4 }}>From</div>
              <input type="date" value={fromDate} onChange={e => setFromDate(e.target.value)} />
            </div>
            <div style={{ flex: 1 }}>
              <div style={{ fontSize: 11, color: c.inkMute, fontWeight: 600, marginBottom: 4 }}>To</div>
              <input type="date" value={toDate} onChange={e => setToDate(e.target.value)} />
            </div>
          </div>
          <div style={{ display: "flex", gap: 8 }}>
            <StickerBtn fill={c.blue} shadow={c.blueDeep} small onClick={() => exportCombined(history, "all")} style={{ flex: 1 }}>
              <Icon name="download" size={12} /> Export all ({history.length})
            </StickerBtn>
            {hasRange ? (
              <StickerBtn fill={c.purple} shadow={c.purpleDeep} small onClick={() => exportCombined(filteredHistory, `${fromDate || "start"}_to_${toDate || "now"}`)} style={{ flex: 1 }}>
                <Icon name="download" size={12} /> Export range ({filteredHistory.length})
              </StickerBtn>
            ) : null}
          </div>
          {hasRange ? (
            <div style={{ fontSize: 11, color: c.inkMute, marginTop: 8, textAlign: "center" }}>
              Showing {filteredHistory.length} of {history.length} session{history.length !== 1 ? 's' : ''} in this range.
              <button onClick={() => { setFromDate(""); setToDate(""); }} style={{ background: "none", border: "none", color: c.blue, fontWeight: 700, cursor: "pointer", marginLeft: 6, textDecoration: "underline", fontSize: 11 }}>Clear</button>
            </div>
          ) : null}
        </Paper>

        {loading ? <CenterMsg c={c} text="Loading…" /> : null}
        {!loading ? (filteredHistory.length === 0 ? (
          <Paper c={c} style={{ textAlign: "center", padding: "28px 20px", color: c.inkMute }}>{hasRange ? "No sessions in this date range." : "No past sessions yet."}</Paper>
        ) : null) : null}
        {filteredHistory.map(h => (
          <Paper key={h.key} c={c} style={{ marginBottom: 12 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6 }}>
              <div style={{ fontWeight: 700, fontSize: 14, color: c.ink }}>{new Date(h.startedAt).toLocaleDateString()} · {new Date(h.startedAt).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}</div>
              <StickerBtn fill={c.blue} shadow={c.blueDeep} small onClick={() => exportCsv(h)}><Icon name="download" size={12} /> CSV</StickerBtn>
            </div>
            <div style={{ fontSize: 12, color: c.inkMute, marginBottom: 8 }}>{(h.claims || []).length} code{(h.claims || []).length !== 1 ? 's' : ''} claimed</div>
            {(h.claims || []).length > 0 ? (
              <div style={{ maxHeight: 140, overflowY: "auto" }}>
                {h.claims.map((cl, i) => (
                  <div key={i} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", fontSize: 12, padding: "4px 0", borderBottom: i < h.claims.length - 1 ? `1px dashed ${c.paperEdge}` : "none" }}>
                    <span style={{ fontWeight: 600, color: c.ink }}>
                      {cl.name}
                      {cl.reward ? <span style={{ display: "block", fontSize: 10, color: c.inkMute, fontWeight: 600 }}>{cl.reward}</span> : null}
                    </span>
                    <span style={{ fontFamily: "monospace", color: c.inkMute }}>{cl.code.length > 14 ? cl.code.slice(0, 12) + "…" : cl.code}</span>
                  </div>
                ))}
              </div>
            ) : null}
          </Paper>
        ))}
      </div>
    );
  }

  // ───────────────────────────────────────────────────────────
  // CODE DROP — LIVE SESSION (host view)
  // ───────────────────────────────────────────────────────────
  function CodeDropSession({ c, codes, onExit }) {
    const [fullscreen, setFullscreen] = useState(false);
    const [session, setSession] = useState(null);
    const [sessionLoaded, setSessionLoaded] = useState(false);
    const [link, setLink] = useState("");
    const [ending, setEnding] = useState(false);
    const [endError, setEndError] = useState("");

    useEffect(() => {
      const unwatch1 = FB.watch("cd:session", (val) => { setSession(val); setSessionLoaded(true); });
      return () => { unwatch1(); };
    }, []);

    useEffect(() => {
      if (session) {
        setLink(`${window.location.origin}${window.location.pathname}?cd_claim=${session.id}`);
      }
    }, [session]);

    if (!sessionLoaded) return <CenterMsg c={c} text="Loading session…" />;

    if (!session) {
      return (
        <div style={{ maxWidth: 460, margin: "0 auto" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 20 }}>
            <BackButton c={c} onClick={onExit} />
            <div style={{ fontWeight: 700, fontSize: 22, color: "#fff", textShadow: "0 2px 4px rgba(0,0,0,0.25)", lineHeight: 1.1 }}>Code Distributor</div>
          </div>
          <Paper c={c} style={{ textAlign: "center", padding: "28px 20px", color: c.inkMute }}>
            <div style={{ fontSize: 15, fontWeight: 600, color: c.ink, marginBottom: 8 }}>No session is currently live</div>
            <p style={{ fontSize: 13, lineHeight: 1.5 }}>This session may have ended already. Head back to the dashboard to start a new one.</p>
          </Paper>
        </div>
      );
    }

    const unused = codes.filter(x => !x.claimed ? !isExpired(x) : !x.claimed);
    const claimedList = codes.filter(x => x.claimed);
    const claimedThisSession = session.claimedCount || 0;
    const limitReached = session.limitEnabled ? claimedThisSession >= session.limitValue : session.limitEnabled;
    const lowStock = unused.length > 0 ? unused.length <= 3 : false;

    const togglePause = async () => {
      await FB.set("cd:session", { ...session, paused: !session.paused });
    };

    const endSession = async () => {
      setEnding(true);
      setEndError("");
      try {
        // Save to history
        const sessionLog = logObjToArray(await FB.get("cd:sessionLog"));
        const historyEntry = {
          startedAt: session.startedAt,
          endedAt: Date.now(),
          claims: sessionLog.map(({ key, ...rest }) => rest),
        };
        await FB.push("cd:history", historyEntry);
        await FB.set("cd:session", null);
        await FB.set("cd:claims", {});
        await FB.set("cd:sessionLog", null);
        onExit();
      } catch (e) {
        setEndError("Couldn't end session: " + (e ? (e.message ? e.message : String(e)) : String(e)));
      } finally {
        setEnding(false);
      }
    };

    const undoLast = async () => {
      const sessionLog = logObjToArray(await FB.get("cd:sessionLog"));
      if (!sessionLog.length) return;
      const last = sessionLog[sessionLog.length - 1];
      // Find the code and unclaim it (host is authenticated, so a direct node write is fine)
      const target = codes.find(x => x.value === last.code);
      if (target) await unclaimCodeNode(target.id);
      // Remove just this entrant's claim entry — NOT a full-map overwrite,
      // which could wipe out another attendee's claim that landed in
      // cd:claims between this component's last snapshot and now.
      await FB.remove(`cd:claims/${last.fp}`);
      // Remove just the last log entry by its push key
      await FB.remove(`cd:sessionLog/${last.key}`);
      // Decrement claimed count via transaction — avoids clobbering a
      // concurrent attendee claim that increments this at the same moment,
      // and avoids overwriting the whole cd:session node (which could
      // stomp a concurrent pause toggle).
      await decrementCounter("cd:session/claimedCount");
    };

    return (
      <div style={{ maxWidth: 460, margin: "0 auto" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 20 }}>
          <BackButton c={c} onClick={onExit} />
          <div style={{ flex: 1 }}>
            <div style={{ fontWeight: 700, fontSize: 22, color: "#fff", textShadow: "0 2px 4px rgba(0,0,0,0.25)", lineHeight: 1.1 }}>Code Distributor</div>
            <div style={{ fontSize: 13, color: session.paused ? c.sun : c.strawberry, fontWeight: 600, marginTop: 2 }}>{session.paused ? "⏸ PAUSED" : "● LIVE"}</div>
          </div>
          <div style={{ background: "#fff", borderRadius: 10, padding: "6px 10px", border: `2px solid ${c.paperEdge}`, textAlign: "center" }} title="Session code — should match the code on attendees' screens">
            <div style={{ fontSize: 9, color: c.inkMute, letterSpacing: 1, fontWeight: 700 }}>SESSION</div>
            <div style={{ fontFamily: "monospace", fontSize: 14, fontWeight: 700, color: c.ink, letterSpacing: 2 }}>{sessionCode(session.id)}</div>
          </div>
        </div>

        <Paper c={c} accent={c.blue} style={{ textAlign: "center", marginBottom: 16, padding: "24px 20px" }}>
          <div style={{ display: "inline-block", background: c.blueDeep, color: "#fff", padding: "6px 16px", borderRadius: 10, border: "2px solid #fff", boxShadow: `0 0 0 1.5px ${c.blueDeep}, 0 2px 0 ${c.blueDeep}`, fontSize: 13, fontWeight: 700, letterSpacing: 1.5, marginBottom: 18 }}>
            {limitReached ? "Session limit reached" : "Scan to claim code"}
          </div>
          <div style={{ display: "flex", justifyContent: "center", marginBottom: 16 }}>
            <div style={{ background: "#fff", padding: 12, borderRadius: 18, border: `3px solid ${c.paperEdge}` }}>
              <QR data={link} size={fullscreen ? 240 : 180} />
            </div>
          </div>
          <StickerBtn fill={c.paperDim} shadow={c.paperEdge} small onClick={() => setFullscreen(!fullscreen)} style={{ color: c.ink, display: "inline-flex", alignItems: "center", justifyContent: "center", gap: 6 }}>
            {fullscreen ? <><Icon name="collapse" size={13} /> Smaller</> : <><Icon name="expand" size={13} /> Bigger</>}
          </StickerBtn>
        </Paper>

        <div style={{ display: "grid", gridTemplateColumns: session.limitEnabled ? "1fr 1fr 1fr" : "1fr 1fr", gap: 10, marginBottom: 16 }}>
          <Paper c={c} style={{ padding: "12px", textAlign: "center" }}>
            <div style={{ fontSize: 26, fontWeight: 700, color: lowStock ? c.strawberry : c.ink, lineHeight: 1 }}>{unused.length}</div>
            <div style={{ fontSize: 10, color: c.inkMute, letterSpacing: 1, fontWeight: 700, marginTop: 4 }}>UNUSED</div>
          </Paper>
          <Paper c={c} style={{ padding: "12px", textAlign: "center" }}>
            <div style={{ fontSize: 26, fontWeight: 700, color: c.ink, lineHeight: 1 }}>{claimedList.length}</div>
            <div style={{ fontSize: 10, color: c.inkMute, letterSpacing: 1, fontWeight: 700, marginTop: 4 }}>CLAIMED</div>
          </Paper>
          {session.limitEnabled ? (
            <Paper c={c} style={{ padding: "12px", textAlign: "center" }}>
              <div style={{ fontSize: 26, fontWeight: 700, color: c.ink, lineHeight: 1 }}>{claimedThisSession}/{session.limitValue}</div>
              <div style={{ fontSize: 10, color: c.inkMute, letterSpacing: 1, fontWeight: 700, marginTop: 4 }}>SESSION CAP</div>
            </Paper>
          ) : null}
        </div>

        {lowStock ? (
          <div style={{ textAlign: "center", marginBottom: 12, padding: "8px 12px", background: "#fff", borderRadius: 12, color: c.strawDeep, fontWeight: 700, fontSize: 12, border: `2px solid ${c.strawberry}`, display: "flex", alignItems: "center", justifyContent: "center", gap: 6 }}>
            <Icon name="warning" size={13} /> Only {unused.length} code{unused.length !== 1 ? 's' : ''} left in the pool
          </div>
        ) : null}

        <div style={{ display: "flex", gap: 10, marginBottom: 16 }}>
          <StickerBtn fill={session.paused ? c.grassMid : c.sun} shadow={session.paused ? c.grassDeep : c.sunDeep} onClick={togglePause} style={{ flex: 1, color: session.paused ? "#fff" : c.ink, display: "inline-flex", alignItems: "center", justifyContent: "center", gap: 6 }}>
            {session.paused ? <><Icon name="play" size={14} /> Resume</> : <><Icon name="pause" size={14} /> Pause</>}
          </StickerBtn>
          <StickerBtn fill={c.strawberry} shadow={c.strawDeep} onClick={endSession} disabled={ending} style={{ flex: 1, display: "inline-flex", alignItems: "center", justifyContent: "center", gap: 6 }}>
            <Icon name="stop" size={14} /> {ending ? "Ending…" : "End Session"}
          </StickerBtn>
        </div>

        {endError ? (
          <div style={{ textAlign: "center", marginBottom: 12, padding: "8px 12px", background: "#fff", borderRadius: 12, color: c.strawDeep, fontWeight: 700, fontSize: 12, border: `2px solid ${c.strawberry}` }}>
            {endError}
          </div>
        ) : null}

        <Paper c={c}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
            <div style={{ fontWeight: 700, fontSize: 14, color: c.ink }}>Recently claimed</div>
            {claimedThisSession > 0 ? <StickerBtn fill={c.paperDim} shadow={c.paperEdge} small onClick={undoLast} style={{ color: c.ink, display: "inline-flex", alignItems: "center", justifyContent: "center", gap: 6 }}><Icon name="undo" size={12} /> Undo last</StickerBtn> : null}
          </div>
          {claimedList.length === 0 ? (
            <div style={{ textAlign: "center", color: c.inkMute, fontSize: 13, padding: "10px 0" }}>Waiting for first scan…</div>
          ) : (
            <div style={{ display: "flex", flexDirection: "column", gap: 6, maxHeight: 200, overflowY: "auto" }}>
              {claimedList.slice(-15).reverse().map(x => (
                <div key={x.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "8px 12px", background: c.paperDim, borderRadius: 10, fontSize: 14 }}>
                  <span style={{ fontWeight: 600, color: c.ink }}>
                    {x.claimedBy || "—"}
                    {x.reward ? <span style={{ display: "block", fontSize: 11, color: c.inkMute, fontWeight: 600 }}>{x.reward}</span> : null}
                  </span>
                  <span style={{ fontFamily: "monospace", color: c.inkMute, fontSize: 12 }}>{x.value.length > 16 ? x.value.slice(0, 14) + "…" : x.value}</span>
                </div>
              ))}
            </div>
          )}
        </Paper>
      </div>
    );
  }

  // ───────────────────────────────────────────────────────────
  // ATTENDEE CLAIM PAGE (public, no auth)
  // ───────────────────────────────────────────────────────────
  function CodeClaim({ c, sessionId }) {
    const [stage, setStage] = useState("loading");
    const [name, setName] = useState("");
    const [myCode, setMyCode] = useState(null);
    const [myReward, setMyReward] = useState(null);
    const fp = fingerprint();

    const check = async () => {
      const sess = await FB.get("cd:session");
      if (!sess || sess.id !== sessionId) return setStage("nosession");
      if (sess.paused) return setStage("paused");
      if (sess.limitEnabled) { if ((sess.claimedCount || 0) >= sess.limitValue) return setStage("limitreached"); }
      // Read this device's own claim entry directly — cd:claims/$fp is readable
      // by anyone, but the cd:claims parent node is not, so we must not read
      // the whole map (that silently returns null/undefined for attendees,
      // which previously let a refresh bypass the one-code-per-device limit).
      const myClaim = await FB.get(`cd:claims/${fp}`);
      if (myClaim) {
        const cs = codesObjToArray(await FB.get("cd:codes"));
        const mine = cs.find(x => x.id === myClaim);
        if (mine) { setMyCode(mine.value); setMyReward(mine.reward || null); return setStage("reveal"); }
      }
      setStage("name");
    };

    useEffect(() => { check(); }, []);

    const claim = async () => {
      if (!name.trim()) return;
      const sess = await FB.get("cd:session");
      if (!sess || sess.id !== sessionId) return setStage("nosession");
      if (sess.paused) return setStage("paused");
      if (sess.limitEnabled) { if ((sess.claimedCount || 0) >= sess.limitValue) return setStage("limitreached"); }

      // Same fix as check(): read this device's own claim entry directly.
      const myClaim2 = await FB.get(`cd:claims/${fp}`);
      if (myClaim2) {
        const cs0 = codesObjToArray(await FB.get("cd:codes"));
        const mine = cs0.find(x => x.id === myClaim2);
        if (mine) { setMyCode(mine.value); setMyReward(mine.reward || null); return setStage("reveal"); }
      }

      // Try candidates in order (oldest/non-expired first). If a candidate
      // loses a race to another attendee, its transaction is rejected
      // (committed: false) and we move on to the next candidate — so a
      // collision shows up as "try the next code", not an error screen.
      const cs = codesObjToArray(await FB.get("cd:codes"));
      const candidates = cs.filter(x => !x.claimed ? !isExpired(x) : !x.claimed).sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
      if (!candidates.length) return setStage("empty");

      let claimedPick = null;
      for (const candidate of candidates) {
        const { committed, conflict } = await claimCodeNode(candidate.id, name.trim());
        if (committed) { claimedPick = candidate; break; }
        if (!conflict) {
          // Real error (network/permission), not a race — stop and surface it.
          return setStage("claimerror");
        }
        // conflict === true: someone else claimed this one a moment ago.
        // Loop continues to the next candidate.
      }
      if (!claimedPick) {
        // Every candidate lost its race. Re-check: are we actually out of
        // codes now, or just very unlucky? Either way, tell the attendee
        // to try again rather than a hard "empty" — codes may still remain.
        const fresh = codesObjToArray(await FB.get("cd:codes"));
        const stillAvailable = fresh.some(x => !x.claimed ? !isExpired(x) : !x.claimed);
        return setStage(stillAvailable ? "claimerror" : "empty");
      }

      // Register this device's claim (write-once, transaction-guarded).
      const reg = await registerClaim(fp, claimedPick.id);
      if (!reg.committed) {
        // Either this device already registered a claim between our
        // earlier check and now (e.g. a double-tap), or the write
        // genuinely failed. Either way, look up what's on record for
        // this fingerprint now — if it points to a valid code, show
        // that. If not, this is a real error: we've marked a code
        // claimed but couldn't record it against this device, which
        // would let this device claim again on refresh. Surface an
        // error rather than silently proceeding.
        const recorded = await FB.get(`cd:claims/${fp}`);
        const cs2 = codesObjToArray(await FB.get("cd:codes"));
        const already = recorded ? cs2.find(x => x.id === recorded) : null;
        if (already) { setMyCode(already.value); setMyReward(already.reward || null); return setStage("reveal"); }
        return setStage("claimerror");
      }

      // Increment the session counter via transaction — lost-update safe
      // even with 100+ simultaneous claimers. Tracked regardless of
      // whether a limit is enabled (used for stats either way).
      await incrementCounter("cd:session/claimedCount");

      await FB.push("cd:sessionLog", { name: name.trim(), code: claimedPick.value, reward: claimedPick.reward || null, time: Date.now(), fp });

      setMyCode(claimedPick.value);
      setMyReward(claimedPick.reward || null);
      setStage("reveal");
    };

    const wrap = (kids) => <div style={{ maxWidth: 400, margin: "0 auto", paddingTop: 20 }}>{kids}</div>;

    if (stage === "loading") return <CenterMsg c={c} text="Loading…" />;

    if (stage === "nosession") return wrap(
      <Paper c={c} accent={c.strawberry} style={{ textAlign: "center", padding: "32px 24px" }}>
        <IconBox emoji="✕" bg={c.strawberry + "33"} border={c.strawDeep} size={80} fontSize={36} />
        <div style={{ height: 16 }} />
        <Banner c={c} fill={c.strawberry}>Session not found</Banner>
        <p style={{ marginTop: 14, color: c.inkSoft, fontSize: 14, lineHeight: 1.5 }}>This Code Drop session has ended or doesn't exist. Ask the host to start a new one.</p>
      </Paper>
    );

    if (stage === "paused") return wrap(
      <Paper c={c} accent={c.sun} style={{ textAlign: "center", padding: "32px 24px" }}>
        <IconBox emoji="⏸" bg={c.sun + "33"} border={c.sunDeep} size={80} fontSize={32} />
        <div style={{ height: 16 }} />
        <Banner c={c} fill={c.sunDeep}>Distribution paused</Banner>
        <p style={{ marginTop: 14, color: c.inkSoft, fontSize: 14, lineHeight: 1.5 }}>The host has paused drops. Check back in a moment!</p>
        <div style={{ marginTop: 20 }}><StickerBtn fill={c.blue} shadow={c.blueDeep} onClick={check}>Check again</StickerBtn></div>
      </Paper>
    );

    if (stage === "limitreached") return wrap(
      <Paper c={c} accent={c.purple} style={{ textAlign: "center", padding: "32px 24px" }}>
        <IconBox emoji="🏁" bg={c.purple + "33"} border={c.purpleDeep} size={80} fontSize={32} />
        <div style={{ height: 16 }} />
        <Banner c={c} fill={c.purpleDeep}>Session full</Banner>
        <p style={{ marginTop: 14, color: c.inkSoft, fontSize: 14, lineHeight: 1.5 }}>This session has given out its full allotment of codes. Thanks for playing!</p>
      </Paper>
    );

    if (stage === "empty") return wrap(
      <Paper c={c} accent={c.strawberry} style={{ textAlign: "center", padding: "32px 24px" }}>
        <IconBox emoji="🎫" bg={c.strawberry + "33"} border={c.strawDeep} size={80} fontSize={36} />
        <div style={{ height: 16 }} />
        <Banner c={c} fill={c.strawberry}>Stash is empty!</Banner>
        <p style={{ marginTop: 14, color: c.inkSoft, fontSize: 14, lineHeight: 1.5 }}>All codes for this session have been claimed.</p>
        <div style={{ marginTop: 20 }}><StickerBtn fill={c.blue} shadow={c.blueDeep} onClick={check}>Check again</StickerBtn></div>
      </Paper>
    );

    if (stage === "claimerror") return wrap(
      <Paper c={c} accent={c.strawberry} style={{ textAlign: "center", padding: "32px 24px" }}>
        <IconBox emoji="⚠" bg={c.strawberry + "33"} border={c.strawDeep} size={80} fontSize={36} />
        <div style={{ height: 16 }} />
        <Banner c={c} fill={c.strawberry}>Couldn't claim</Banner>
        <p style={{ marginTop: 14, color: c.inkSoft, fontSize: 14, lineHeight: 1.5 }}>Something went wrong saving your code. Please try again.</p>
        <div style={{ marginTop: 20 }}><StickerBtn fill={c.blue} shadow={c.blueDeep} onClick={() => setStage("name")}>Try again</StickerBtn></div>
      </Paper>
    );

    if (stage === "name") return wrap(
      <Paper c={c} accent={c.blue} style={{ textAlign: "center", padding: "28px 22px" }}>
        <Banner c={c} fill={c.blueDeep} style={{ marginBottom: 18 }}>Trainer Reward</Banner>
        <div style={{ marginBottom: 14, display: "flex", justifyContent: "center" }}>
          <IconBox emoji="🎁" bg={c.sun + "33"} border={c.sunDeep} size={80} fontSize={38} />
        </div>
        <h2 style={{ fontFamily: "Fredoka, sans-serif", fontSize: 20, fontWeight: 700, color: c.ink, marginBottom: 6 }}>What's your trainer name?</h2>
        <p style={{ color: c.inkSoft, fontSize: 13, marginBottom: 18 }}>Your name will be recorded with your claimed code.</p>
        <input value={name} onChange={e => setName(e.target.value)} onKeyDown={e => { if (e.key === "Enter") claim(); }} placeholder="Ash Ketchum..." style={{ textAlign: "center", fontSize: 17, marginBottom: 18 }} maxLength={32} />
        <StickerBtn fill={c.grassMid} shadow={c.grassDeep} disabled={!name.trim()} onClick={claim} style={{ width: "100%", fontSize: 16, padding: 14 }}>
          Claim my code
        </StickerBtn>
      </Paper>
    );

    if (stage === "reveal") return wrap(
      <Paper c={c} accent={c.grassMid} style={{ textAlign: "center", padding: "28px 22px" }}>

  // ───────────────────────────────────────────────────────────
  // GIVEAWAY ENTRY PAGE (public, no auth)
  // ───────────────────────────────────────────────────────────
  function GiveawayClaim({ c, sessionId }) {
    const [stage, setStage] = useState("loading");
    const [name, setName] = useState("");
    const [wonPrize, setWonPrize] = useState(null); // { name, type, code?, description?, confirmed? }
    const fp = fingerprint();
    const myEntrantIdRef = useRef(null);

    const check = async () => {
      const sess = await FB.get("gw:session");
      if (!sess || sess.id !== sessionId) return setStage("nosession");
      const entrants = entrantsObjToArray(await FB.get("gw:entrants"));
      const mine = entrants.find(e => e.fp === fp);
      if (mine) {
        myEntrantIdRef.current = mine.id;
        setName(mine.name);
        if (mine.won) {
          // Check if there's prize data
          const entrantData = await FB.get(`gw:entrants/${mine.id}`);
          if (entrantData) { if (entrantData.wonPrize) {
            setWonPrize(entrantData.wonPrize);
            return setStage("won");
          } }
        }
        return setStage("entered");
      }
      setStage("name");
    };

    useEffect(() => { check(); }, []);

    // Real-time listener: once entered, watch only THIS attendee's entrant
    // node for win status changes. Scoping to a single node (rather than
    // the whole gw:entrants map) matters at event scale — with 100-200
    // attendees holding this page open, a map-wide listener would re-send
    // every entrant's data to every device on every single prize draw.
    useEffect(() => {
      if (stage !== "entered") { if (stage !== "won") return; }
      if (!myEntrantIdRef.current) return;
      const entrantRef = db.ref(`gw:entrants/${myEntrantIdRef.current}`);
      const handler = (snap) => {
        const data = snap.val();
        if (data) { if (data.won) { if (data.wonPrize) {
          setWonPrize(data.wonPrize);
          setStage("won");
        } } }
      };
      entrantRef.on("value", handler);
      return () => entrantRef.off("value", handler);
    }, [stage]);

    // Real-time listener: while waiting (not yet won), watch gw:session so
    // non-winners find out when the giveaway wraps up — without this,
    // someone who didn't win would just sit on "You're entered!" forever
    // with no indication the drawing happened.
    useEffect(() => {
      if (stage !== "entered") return;
      const sessionRef = db.ref("gw:session");
      const handler = (snap) => {
        const val = snap.val();
        // Session ended (host clicked "End giveaway"), or a different
        // session started (this one is over either way).
        if (!val) { setStage("ended"); return; }
        if (val.id !== sessionId) { setStage("ended"); return; }
      };
      sessionRef.on("value", handler);
      return () => sessionRef.off("value", handler);
    }, [stage]);

    const enter = async () => {
      if (!name.trim()) return;
      const sess = await FB.get("gw:session");
      if (!sess || sess.id !== sessionId) return setStage("nosession");
      const entrants = entrantsObjToArray(await FB.get("gw:entrants"));
      const mine = entrants.find(e => e.fp === fp);
      if (mine) { myEntrantIdRef.current = mine.id; setStage("entered"); return; }
      const id = genId();
      myEntrantIdRef.current = id;
      const ok = await FB.set(`gw:entrants/${id}`, { name: name.trim(), fp, enteredAt: Date.now(), won: false });
      if (!ok) return setStage("entererror");
      setStage("entered");
    };

    const wrap = (kids) => <div style={{ maxWidth: 400, margin: "0 auto", paddingTop: 20 }}>{kids}</div>;

    if (stage === "loading") return <CenterMsg c={c} text="Loading…" />;

    if (stage === "nosession") return wrap(
      <Paper c={c} accent={c.strawberry} style={{ textAlign: "center", padding: "32px 24px" }}>
        <IconBox emoji="✕" bg={c.strawberry + "33"} border={c.strawDeep} size={80} fontSize={36} />
        <div style={{ height: 16 }} />
        <Banner c={c} fill={c.strawberry}>Giveaway not found</Banner>
        <p style={{ marginTop: 14, color: c.inkSoft, fontSize: 14, lineHeight: 1.5 }}>This giveaway has ended or doesn't exist. Ask the host to start a new one.</p>
      </Paper>
    );

    if (stage === "entererror") return wrap(
      <Paper c={c} accent={c.strawberry} style={{ textAlign: "center", padding: "32px 24px" }}>
        <IconBox emoji="⚠" bg={c.strawberry + "33"} border={c.strawDeep} size={80} fontSize={36} />
        <div style={{ height: 16 }} />
        <Banner c={c} fill={c.strawberry}>Couldn't enter</Banner>
        <p style={{ marginTop: 14, color: c.inkSoft, fontSize: 14, lineHeight: 1.5 }}>Something went wrong saving your entry. Please try again.</p>
        <div style={{ marginTop: 20 }}><StickerBtn fill={c.blue} shadow={c.blueDeep} onClick={() => setStage("name")}>Try again</StickerBtn></div>
      </Paper>
    );

    if (stage === "name") return wrap(
      <Paper c={c} accent={c.strawberry} style={{ textAlign: "center", padding: "28px 22px" }}>
        <Banner c={c} fill={c.strawDeep} style={{ marginBottom: 18 }}>Giveaway</Banner>
        <div style={{ marginBottom: 14, display: "flex", justifyContent: "center" }}>
          <IconBox emoji="🎁" bg={c.sun + "33"} border={c.sunDeep} size={80} fontSize={38} />
        </div>
        <h2 style={{ fontFamily: "Fredoka, sans-serif", fontSize: 20, fontWeight: 700, color: c.ink, marginBottom: 6 }}>What's your trainer name?</h2>
        <p style={{ color: c.inkSoft, fontSize: 13, marginBottom: 18 }}>Enter to be randomly selected for a prize.</p>
        <input value={name} onChange={e => setName(e.target.value)} onKeyDown={e => { if (e.key === "Enter") enter(); }} placeholder="Ash Ketchum..." style={{ textAlign: "center", fontSize: 17, marginBottom: 18 }} maxLength={32} />
        <StickerBtn fill={c.strawberry} shadow={c.strawDeep} disabled={!name.trim()} onClick={enter} style={{ width: "100%", fontSize: 16, padding: 14 }}>
          Enter Giveaway
        </StickerBtn>
      </Paper>
    );

    if (stage === "won") return wrap(
      <Paper c={c} accent={c.grassMid} style={{ textAlign: "center", padding: "28px 22px" }}>
        <Banner c={c} fill={c.grassDeep} style={{ marginBottom: 16 }}>You won!</Banner>
        <div style={{ marginBottom: 16, display: "flex", justifyContent: "center" }}>
          <IconBox emoji="🎉" bg={c.sun + "33"} border={c.sunDeep} size={80} fontSize={42} />
        </div>

        <div style={{ background: c.paperDim, borderRadius: 18, padding: "18px 16px", marginBottom: 14, border: `2.5px dashed ${c.grassMid}` }}>
          <div style={{ fontSize: 11, letterSpacing: 2, color: c.inkMute, fontWeight: 600, marginBottom: 8 }}>YOUR PRIZE</div>
          <div style={{ fontSize: 20, fontWeight: 700, color: c.ink }}>{wonPrize ? wonPrize.name : "A prize"}</div>
          {wonPrize ? (wonPrize.description ? (
            <div style={{ fontSize: 13, color: c.inkSoft, marginTop: 6, fontStyle: "italic" }}>{wonPrize.description}</div>
          ) : null) : null}
        </div>

        <div style={{ display: "inline-flex", alignItems: "center", gap: 6, background: "#fff", borderRadius: 10, padding: "5px 12px", border: `2px solid ${c.paperEdge}`, marginBottom: 14 }}>
          <span style={{ fontSize: 10, color: c.inkMute, letterSpacing: 1, fontWeight: 700 }}>SESSION</span>
          <span style={{ fontFamily: "monospace", fontSize: 13, fontWeight: 700, color: c.ink, letterSpacing: 2 }}>{sessionCode(sessionId)}</span>
        </div>
        <p style={{ fontSize: 11, color: c.inkMute, marginBottom: 4, lineHeight: 1.4 }}>The host can check this code matches the live session before handing over your prize.</p>

        {/* Code reveal for code-type prizes */}
        {wonPrize ? (wonPrize.code ? (
          <div style={{ background: c.paperDim, borderRadius: 18, padding: "18px 16px", marginBottom: 14, border: `2.5px dashed ${c.purple}` }}>
            <div style={{ fontSize: 11, letterSpacing: 2, color: c.inkMute, fontWeight: 600, marginBottom: 8 }}>YOUR CODE</div>
            {wonPrize.codeReward ? (
              <div style={{ display: "inline-block", background: c.sun + "33", color: c.sunDeep, padding: "4px 12px", borderRadius: 8, fontSize: 12, fontWeight: 700, marginBottom: 8 }}>
                This code redeems: {wonPrize.codeReward}
              </div>
            ) : null}
            <div style={{ fontFamily: "monospace", fontSize: 22, fontWeight: 700, color: c.ink, letterSpacing: 2, wordBreak: "break-all", lineHeight: 1.3 }}>{wonPrize.code}</div>
          </div>
        ) : null) : null}

        {wonPrize ? (wonPrize.code ? (
          <div style={{ marginBottom: 14 }}>
            <div style={{ background: c.sun + "22", borderRadius: 12, padding: "10px 12px", marginBottom: 10, fontSize: 12, color: c.inkSoft, lineHeight: 1.5 }}>
              <strong>Before you redeem:</strong> make sure you're signed into the Pokémon GO store with the <strong>same account</strong> you use in the game, or the code won't apply to your account.
            </div>
            <a href={`https://store.pokemongo.com/offer-redemption?passcode=${encodeURIComponent(wonPrize.code)}`} target="_blank" rel="noopener noreferrer" style={{ textDecoration: "none", display: "block", marginBottom: 10 }}>
              <StickerBtn fill={c.grassMid} shadow={c.grassDeep} style={{ width: "100%", fontSize: 17, padding: "14px", display: "inline-flex", alignItems: "center", justifyContent: "center", gap: 8 }}><Icon name="external" size={16} /> REDEEM NOW</StickerBtn>
            </a>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
              <StickerBtn fill={c.blue} shadow={c.blueDeep} small onClick={() => navigator.clipboard.writeText(wonPrize.code)}>Copy</StickerBtn>
              <StickerBtn fill={c.purple} shadow={c.purpleDeep} small onClick={() => { if (navigator.share) navigator.share({ title: "Pokémon GO code", text: wonPrize.code }); }}>Share</StickerBtn>
            </div>
          </div>
        ) : null) : null}

        {/* Physical/generic prize instructions */}
        {wonPrize ? (!wonPrize.code ? (
          <div style={{ background: c.paperDim, borderRadius: 14, padding: "12px 14px", marginBottom: 14, textAlign: "left" }}>
            <div style={{ fontSize: 11, color: c.orangeDeep, fontWeight: 700, letterSpacing: 1.5, marginBottom: 4 }}>NEXT STEP</div>
            <p style={{ fontSize: 13, color: c.inkSoft, lineHeight: 1.5 }}>
              {wonPrize.type === "special" ? "This is a special prize! The host has confirmed delivery." : "See the host to collect your prize. Show them this screen!"}

        <p style={{ fontSize: 12, color: c.inkMute, lineHeight: 1.5 }}>Congratulations, {name}! 🎊</p>

    if (stage === "entered") return wrap(

    if (stage === "ended") return wrap(
      <Paper c={c} accent={c.blue} style={{ textAlign: "center", padding: "28px 22px" }}>
