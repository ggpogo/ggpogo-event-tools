<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>

  #ggpogo-event-tools-root input,

    background: #fff; border: 2.5px solid #E8DEC0; color: #0D2D52; border-radius: 14px;
    padding: 12px 14px; font-family: 'Fredoka', sans-serif; font-size: 15px; font-weight: 500;
    width: 100%; outline: none;
  }
  #ggpogo-event-tools-root input:focus,
  #ggpogo-event-tools-root textarea:focus,
  #ggpogo-event-tools-root select:focus { border-color: #1FA5DC; }

  #ggpogo-event-tools-root th, #ggpogo-event-tools-root td { text-align: left; padding: 8px 6px; }
</style>

<script type="text/babel">
(function () {
  const { useState, useEffect, useRef, useMemo } = React;

  // ───────────────────────────────────────────────────────────
  // FIREBASE SETUP
  // ───────────────────────────────────────────────────────────
  const firebaseConfig = {
    apiKey: "AIzaSyDtnqBfQWIbAFUd4cIJbrhwcQrEw1LzJbU",
    authDomain: "ggpogo-tools.firebaseapp.com",
    databaseURL: "https://ggpogo-tools-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "ggpogo-tools",
    storageBucket: "ggpogo-tools.firebasestorage.app",
    messagingSenderId: "1029277084624",
    appId: "1:1029277084624:web:e0591c7dbabc80467be7d5"
  };
  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  const auth = firebase.auth();

  // ───────────────────────────────────────────────────────────
  // DIAGNOSTICS — collects errors so the app can show *what*
  // went wrong instead of failing silently or going blank.
  // ───────────────────────────────────────────────────────────
  const diagnosticsListeners = new Set();
  const diagnosticsLog = [];
  function reportIssue(source, detail) {
    const entry = { time: new Date().toLocaleTimeString(), source, detail: String(detail ? (detail.message ? detail.message : detail) : detail) };
    diagnosticsLog.unshift(entry);
    if (diagnosticsLog.length > 20) diagnosticsLog.length = 20;
    diagnosticsListeners.forEach(fn => fn([...diagnosticsLog]));
  }
  function useDiagnostics() {
    const [log, setLog] = useState(() => [...diagnosticsLog]);
    useEffect(() => {
      diagnosticsListeners.add(setLog);
      return () => diagnosticsListeners.delete(setLog);
    }, []);
    return log;
  }

  const FB = {
    async get(path) {
      try { const s = await db.ref(path).once('value'); return s.val(); }
      catch (e) { console.error("get", path, e); reportIssue(`read ${path}`, e); return null; }
    },
    async set(path, val) {
      try { await db.ref(path).set(val); return true; }
      catch (e) { console.error("set", path, e); reportIssue(`write ${path}`, e); return false; }
    },
    // Atomic multi-path update (all-or-nothing), e.g. { 'cd:codes/abc/claimed': true, 'cd:codes/abc/claimedBy': 'Ash' }
    async update(updates) {
      try { await db.ref().update(updates); return true; }
      catch (e) { console.error("update", updates, e); reportIssue(`update ${Object.keys(updates).join(', ')}`, e); return false; }
    },
    async push(path, val) {
      try { const ref = db.ref(path).push(); await ref.set(val); return ref.key; }
      catch (e) { console.error("push", path, e); reportIssue(`push ${path}`, e); return null; }
    },
    async remove(path) {
      try { await db.ref(path).remove(); return true; }
      catch (e) { console.error("remove", path, e); reportIssue(`delete ${path}`, e); return false; }
    },
    watch(path, cb) {
      const ref = db.ref(path);
      ref.on('value', s => cb(s.val()), e => { console.error("watch", path, e); reportIssue(`listen ${path}`, e); });
      return () => ref.off('value');
    },
    // Atomic read-modify-write on a single node. `updateFn(currentVal) => nextVal`.
    // Return `undefined` from updateFn to abort without writing (Firebase will
    // not commit, and `committed` will be false). Firebase automatically
    // retries updateFn if the node changed since it was read, so this is safe
    // under concurrent writers — used for counters and "claim this node"
    // operations where many clients may race for the same path.
    // Returns { committed, snapshot } or null on error.
    async transact(path, updateFn) {
      try {
        const result = await db.ref(path).transaction(updateFn);
        return { committed: result.committed, snapshot: result.snapshot ? result.snapshot.val() : null };
      } catch (e) {
        console.error("transact", path, e);
        reportIssue(`transact ${path}`, e);
        return null;
      }
    },
  };

  function genId() { return Math.random().toString(36).slice(2, 10); }
  // Short, human-friendly verification code derived from a session id.
  // Shown on both the host's control panel and the attendee's win/reveal
  // screen so a screenshot from a past session is visibly mismatched if
  // someone tries to reuse it during a different live session.
  function sessionCode(id) {
    if (!id) return "----";
    return id.slice(0, 4).toUpperCase();
  }
  function fingerprint() {
    const n = navigator;
    const raw = [n.userAgent, n.language, screen.width, screen.height, screen.colorDepth, new Date().getTimezoneOffset(), n.hardwareConcurrency, n.maxTouchPoints].join("|");
    let h = 0;
    for (let i = 0; i < raw.length; i++) h = ((h << 5) - h + raw.charCodeAt(i)) | 0;
    return "fp_" + Math.abs(h).toString(36);
  }
  function nowTime() {
    return new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  }

  // ───────────────────────────────────────────────────────────
  // CODES STORAGE — stored in Firebase as an object map keyed by
  // code id (required for per-item security rules), used in the
  // app as an array for easy filtering/rendering.
  // ───────────────────────────────────────────────────────────
  function codesObjToArray(obj) {
    if (!obj) return [];
    return Object.entries(obj).map(([id, v]) => ({
      id, value: v.value, claimed: !!v.claimed, claimedBy: v.claimedBy || null,
      order: typeof v.order === "number" ? v.order : 0,
      expiresAt: v.expiresAt || null, // ms timestamp, or null = never expires
      reward: v.reward || null, // human-readable label, e.g. "Elite Raid Pass"
    }));
  }
  function codesArrayToObj(arr) {
    const obj = {};
    arr.forEach(x => {
      obj[x.id] = {
        value: x.value, claimed: !!x.claimed, claimedBy: x.claimedBy || null,
        order: typeof x.order === "number" ? x.order : 0,
        expiresAt: x.expiresAt || null,
        reward: x.reward || null,
      };
    });
    return obj;
  }
  // True if a code's expiration date has passed. Codes past expiry are
  // excluded from the attendee-facing pool and flagged in Manage Codes.
  function isExpired(code) {
    return code.expiresAt ? Date.now() > code.expiresAt : false;
  }
  // Attendee-side: claim ONE code via a transaction on that single node.
  // The security rule requires data.claimed == false at write time, so if
  // two attendees race for the SAME code node, the transaction for the
  // loser is rejected (committed: false) rather than silently overwriting —
  // the caller should then retry with the next candidate code.
  //
  // IMPORTANT: Firebase calls the update function with `current === null`
  // on its FIRST invocation if this client has no cached value for the
  // path (the common case for an unauthenticated attendee who's never
  // read this node before) — even though the node exists on the server.
  // Returning `undefined` means "abort immediately, no retry", so doing
  // that on a null `current` would abort EVERY claim attempt before
  // Firebase ever fetches the real value. We must return `null` in that
  // case so Firebase fetches the server value and calls us again with
  // the real data. Only abort (return undefined) once we've actually
  // seen real data and it shows the code is already claimed.
  async function claimCodeNode(codeId, claimedBy) {
    const result = await FB.transact(`cd:codes/${codeId}`, (current) => {
      if (current === null) return null; // no cached value yet — let Firebase fetch and retry
      if (current.claimed) return; // real data shows already claimed — abort, caller retries next candidate
      return { ...current, claimed: true, claimedBy };
    });
    if (!result) return { committed: false, conflict: false }; // network/error
    // A committed transaction that wrote `null` means the code node didn't
    // actually exist (deleted mid-claim, or a stale candidate) — treat as
    // a conflict so the caller moves on to the next candidate rather than
    // reporting success for a code that isn't really there.
    if (result.committed) { if (!result.snapshot) return { committed: false, conflict: true, snapshot: null }; }
    return { committed: result.committed, conflict: !result.committed, snapshot: result.snapshot };
  }
  async function unclaimCodeNode(codeId) {
    return FB.update({
      [`cd:codes/${codeId}/claimed`]: false,
      [`cd:codes/${codeId}/claimedBy`]: null,
    });
  }
  // Register this device's claim under cd:claims/$fp via a transaction.
  // The security rule requires !data.exists() — i.e. this is a write-once
  // node. A transaction makes "only write if empty" race-safe: if two taps
  // from the same device land concurrently, only one wins.
  async function registerClaim(fp, codeId) {
    const result = await FB.transact(`cd:claims/${fp}`, (current) => {
      if (current) return; // already claimed from this device — abort
      return codeId;
    });
    if (!result) return { committed: false };
    return { committed: result.committed, value: result.snapshot };
  }
  // Increment a numeric counter via transaction. Safe under concurrent
  // writers — Firebase retries updateFn against the latest server value.
  async function incrementCounter(path) {
    const result = await FB.transact(path, (current) => (typeof current === "number" ? current : 0) + 1);
    if (!result) return null;
    return result.snapshot;
  }
  // Decrement a numeric counter via transaction, floored at 0.
  async function decrementCounter(path) {
    const result = await FB.transact(path, (current) => Math.max(0, (typeof current === "number" ? current : 0) - 1));
    if (!result) return null;
    return result.snapshot;
  }
  // Session log is stored as a push()-keyed object so attendees can
  // append an entry without write access to sibling entries.
  function logObjToArray(obj) {
    if (!obj) return [];
    return Object.entries(obj).map(([key, v]) => ({ key, ...v }));
  }

  // ───────────────────────────────────────────────────────────
  // GIVEAWAY STORAGE — object maps keyed by id, same pattern as
  // cd:codes, for per-item security rules.
  // ───────────────────────────────────────────────────────────
  function prizesObjToArray(obj) {
    if (!obj) return [];
    return Object.entries(obj).map(([id, v]) => ({
      id, name: v.name, quantity: v.quantity, remaining: v.remaining,
      type: v.type || "generic",           // generic | code | physical | special
      description: v.description || null,   // physical/special description
      delivery: v.delivery || null,         // special only: "code" | "physical"
    }));
  }
  function entrantsObjToArray(obj) {
    if (!obj) return [];
    return Object.entries(obj).map(([id, v]) => ({ id, name: v.name, fp: v.fp || null, enteredAt: v.enteredAt, won: !!v.won }));
  }

  // ───────────────────────────────────────────────────────────
  // MEETUP STATS — transforms raw Topi/Campfire Tools event JSON
  // (see https://cmpf-tools.de/api/docs) into per-event summaries,
  // matching the grain described in the engineering handoff:
  // "Event Summary" = 1 row per event, with RSVP/check-in counts,
  // Pacific date parts, and a dashboard-include flag that excludes
  // future/too-recent events from aggregate stats.
  // ───────────────────────────────────────────────────────────

  // How long after an event's start time it's considered "complete"
  // enough to safely include in aggregate stats (check-ins may still be
  // trickling in before this). Matches the handoff's EVENT_COMPLETE_BUFFER_HOURS.
  const EVENT_COMPLETE_BUFFER_HOURS = 2;

  // Convert a UTC ISO timestamp into Pacific-time date parts used for
  // grouping (year, month, quarter). Uses Intl so it correctly accounts
  // for DST without a date library.
  function getPacificDateParts(isoTime) {
    const d = new Date(isoTime);
    if (isNaN(d.getTime())) return { dateStr: null, year: null, month: null, quarter: null, yearQuarter: null, yearMonth: null };
    const parts = new Intl.DateTimeFormat("en-US", {
      timeZone: "America/Los_Angeles", year: "numeric", month: "2-digit", day: "2-digit",
    }).formatToParts(d);
    const get = (type) => parts.find(p => p.type === type)?.value;
    const year = Number(get("year"));
    const month = Number(get("month")); // 1-12
    const day = get("day");
    const quarter = Math.ceil(month / 3);
    const dateStr = `${year}-${String(month).padStart(2, "0")}-${day}`;
    const monthNames = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    return {
      dateStr, year, month,
      monthLabel: `${monthNames[month - 1]} ${year}`,
      quarter,
      yearQuarter: `${year} Q${quarter}`,
    };
  }

  // Transform one raw Topi event object into a summary row. `members` is
  // the array of { rsvp_status, id, ... } from the API response.
  function summarizeEvent(raw, nowMs = Date.now()) {
    const members = Array.isArray(raw.members) ? raw.members : [];
    let checkedIn = 0, accepted = 0, declined = 0, other = 0;
    const checkedInMemberIds = [];
    for (const m of members) {
      const status = m.rsvp_status;
      if (status === "CHECKED_IN") { checkedIn++; checkedInMemberIds.push(m.id); }
      else if (status === "ACCEPTED") accepted++;
      else if (status === "DECLINED") declined++;
      else other++;
    }
    const rsvpTotal = checkedIn + accepted;
    const checkInRate = rsvpTotal > 0 ? checkedIn / rsvpTotal : 0;

    const dateParts = getPacificDateParts(raw.time);
    const startMs = new Date(raw.time).getTime();
    const hoursSinceStart = isNaN(startMs) ? null : (nowMs - startMs) / (1000 * 60 * 60);

    let eventStatus, includeInDashboard;
    if (hoursSinceStart === null) {
      eventStatus = "Unknown"; includeInDashboard = false;
    } else if (hoursSinceStart < 0) {
      eventStatus = "Future"; includeInDashboard = false;
    } else if (hoursSinceStart < EVENT_COMPLETE_BUFFER_HOURS) {
      eventStatus = "Started Recently"; includeInDashboard = false;
    } else {
      eventStatus = "Complete"; includeInDashboard = true;
    }

    return {
      id: raw.id,
      name: raw.name || "Untitled Event",
      url: raw.url || null,
      timeUtc: raw.time || null,
      ...dateParts,
      eventStatus,
      includeInDashboard,
      hoursSinceStart,
      totalMembers: members.length,
      checkedIn, accepted, declined, other,
      rsvpTotal, checkInRate,
      checkedInMemberIds,
    };
  }

  // Build summaries for every event in a raw Topi API response.
  function summarizeEvents(rawEvents, nowMs = Date.now()) {
    if (!Array.isArray(rawEvents)) return [];
    return rawEvents.map(e => summarizeEvent(e, nowMs));
  }

  // Filter summaries to those flagged for dashboard inclusion AND within
  // an optional [fromDateStr, toDateStr] Pacific-date range (inclusive,
  // "YYYY-MM-DD" strings, either end optional).
  function filterEventsForRange(summaries, fromDateStr, toDateStr) {
    return summaries.filter(e => {
      if (!e.includeInDashboard || !e.dateStr) return false;
      if (fromDateStr) { if (e.dateStr < fromDateStr) return false; }
      if (toDateStr) { if (e.dateStr > toDateStr) return false; }
      return true;
    });
  }

  // Aggregate totals across a set of event summaries.
  function aggregateTotals(events) {
    const totalEvents = events.length;
    const totalCheckIns = events.reduce((s, e) => s + e.checkedIn, 0);
    const totalRsvps = events.reduce((s, e) => s + e.rsvpTotal, 0);
    const overallRate = totalRsvps > 0 ? totalCheckIns / totalRsvps : 0;
    const avgCheckIns = totalEvents > 0 ? totalCheckIns / totalEvents : 0;
    const avgRsvps = totalEvents > 0 ? totalRsvps / totalEvents : 0;
    return { totalEvents, totalCheckIns, totalRsvps, overallRate, avgCheckIns, avgRsvps };
  }

  // Group event summaries by a key function, producing one aggregate row
  // per group plus the group label, sorted by the group's sort key.
  function groupEvents(events, keyFn, labelFn, sortKeyFn) {
    const groups = new Map();
    for (const e of events) {
      const key = keyFn(e);
      if (key === null || key === undefined) continue;
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(e);
    }
    return Array.from(groups.entries())
      .map(([key, evs]) => ({ key, label: labelFn(evs[0], key), sortKey: sortKeyFn(evs[0], key), ...aggregateTotals(evs) }))
      .sort((a, b) => (a.sortKey < b.sortKey ? -1 : a.sortKey > b.sortKey ? 1 : 0));
  }

  // Repeat-attendee rate: for each event, what fraction of its checked-in
  // members also checked into at least one OTHER event in the same set.
  // Returns { perEvent: [{eventId, repeatRate, repeatCount, checkedIn}],
  //           overallRepeatRate, uniqueAttendees, totalCheckInRecords }.
  function computeRepeatAttendance(events) {
    // Count how many distinct events each member checked into.
    const memberEventCounts = new Map();
    let totalCheckInRecords = 0;
    for (const e of events) {
      for (const memberId of e.checkedInMemberIds) {
        memberEventCounts.set(memberId, (memberEventCounts.get(memberId) || 0) + 1);
        totalCheckInRecords++;
      }
    }
    const uniqueAttendees = memberEventCounts.size;
    let repeatRecords = 0;
    for (const count of memberEventCounts.values()) {
      if (count > 1) repeatRecords += count;
    }
    const overallRepeatRate = totalCheckInRecords > 0 ? repeatRecords / totalCheckInRecords : 0;

    const perEvent = events.map(e => {
      let repeatCount = 0;
      for (const memberId of e.checkedInMemberIds) {
        if ((memberEventCounts.get(memberId) || 0) > 1) repeatCount++;
      }
      return {
        eventId: e.id,
        checkedIn: e.checkedIn,
        repeatCount,
        repeatRate: e.checkedIn > 0 ? repeatCount / e.checkedIn : 0,
      };
    });

    return { perEvent, overallRepeatRate, uniqueAttendees, totalCheckInRecords };
  }

  // ───────────────────────────────────────────────────────────
  // DEFAULT COLORS / BRANDING
  // ───────────────────────────────────────────────────────────
  const DEFAULT_BRAND = {
    grassMid: "#7DC25C", grassDeep: "#3F8A36",
    paper: "#FFFCF2", paperDim: "#F5EFDC", paperEdge: "#E8DEC0",
    blue: "#1FA5DC", blueDeep: "#0E5C9E",
    orange: "#F08838", orangeDeep: "#C45A1F",
    strawberry: "#E84A3D", strawDeep: "#A82A20",
    sun: "#F5C842", sunDeep: "#C99520",
    purple: "#7B5BC9", purpleDeep: "#4B348C",
    ink: "#0D2D52", inkSoft: "#3D5B82", inkMute: "#7A8FA8",
    bgImage: "", // optional custom background image URL
    logoImage: "", // optional custom logo URL
  };

  // ───────────────────────────────────────────────────────────
  // SHARED UI PRIMITIVES (branding-aware)
  // ───────────────────────────────────────────────────────────
  function useBrand() {
    const [brand, setBrand] = useState(DEFAULT_BRAND);
    useEffect(() => {
      const unwatch = FB.watch("settings:branding", (val) => {
        setBrand({ ...DEFAULT_BRAND, ...(val || {}) });
      });
      return unwatch;
    }, []);
    return brand;
  }

  // ───────────────────────────────────────────────────────────
  // ICONS — small inline SVGs instead of emoji. Some platforms
  // (notably Windows/Edge) render emoji glyphs at a large fixed
  // size that ignores the surrounding font-size, which made
  // buttons like Pause/End Session balloon to ~100px circles.
  // SVGs always respect the given width/height.
  // ───────────────────────────────────────────────────────────
  function Icon({ name, size = 14, style = {} }) {
    const common = { width: size, height: size, viewBox: "0 0 24 24", fill: "currentColor", style: { display: "inline-block", verticalAlign: "middle", flexShrink: 0, ...style } };
    switch (name) {
      case "folder": // Manage codes
        return <svg {...common}><path d="M3 5a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5z"/></svg>;
      case "list": // History
        return <svg {...common}><path d="M4 5h16v2H4V5zm0 6h16v2H4v-2zm0 6h10v2H4v-2z"/></svg>;
      case "play":
        return <svg {...common}><path d="M8 5v14l11-7z"/></svg>;
      case "pause":
        return <svg {...common}><path d="M7 5h4v14H7zm6 0h4v14h-4z"/></svg>;
      case "stop":
        return <svg {...common}><rect x="6" y="6" width="12" height="12"/></svg>;
      case "undo":
        return <svg {...common}><path d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62A6.97 6.97 0 0 1 12.5 11c3.03 0 5.6 1.91 6.6 4.6l2.13-.7C19.84 11.27 16.46 8 12.5 8z"/></svg>;
      case "expand":
        return <svg {...common}><path d="M3 3h7v2H5v5H3V3zm11 0h7v7h-2V5h-5V3zM3 14h2v5h5v2H3v-7zm16 5v-5h2v7h-7v-2h5z"/></svg>;
      case "collapse":
        return <svg {...common}><path d="M9 3h2v6H5V7h4V3zm6 0h2v4h4v2h-6V3zM9 21H7v-4H3v-2h6v6zm6 0v-6h6v2h-4v4h-2z"/></svg>;
      case "external":
        return <svg {...common}><path d="M14 3v2h3.59L7 15.59 8.41 17 19 6.41V10h2V3h-7zM5 5v14h14v-7h-2v5H7V7h5V5H5z"/></svg>;
      case "download":
        return <svg {...common}><path d="M12 3v10.17l3.59-3.58L17 11l-5 5-5-5 1.41-1.41L11 13.17V3h1zM5 19h14v2H5z"/></svg>;
      case "add":
        return <svg {...common}><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6V5z"/></svg>;
      case "gift": // Physical prize
        return <svg {...common}><path d="M20 7h-4.17A3 3 0 0 0 12 3.83 3 3 0 0 0 8.17 7H4a2 2 0 0 0-2 2v2h20V9a2 2 0 0 0-2-2zM9 7a1 1 0 1 1 0-2 1 1 0 0 1 0 2zm6 0a1 1 0 1 1 0-2 1 1 0 0 1 0 2zM2 12v8a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-8H2z"/></svg>;
      case "star": // Special prize
        return <svg {...common}><path d="M12 2l3.09 6.26L22 9.27l-5 4.87L18.18 21 12 17.27 5.82 21 7 14.14 2 9.27l6.91-1.01z"/></svg>;
      case "code": // Code prize
        return <svg {...common}><path d="M9 3v1H4a1 1 0 0 0-1 1v5a2 2 0 0 0 2 2 2 2 0 0 0-2 2v5a1 1 0 0 0 1 1h5v1h6v-1h5a1 1 0 0 0 1-1v-5a2 2 0 0 0-2-2 2 2 0 0 0 2-2V5a1 1 0 0 0-1-1h-5V3H9zm0 5a2 2 0 1 1 0 4 2 2 0 0 1 0-4zm6 4a2 2 0 1 1 0 4 2 2 0 0 1 0-4z"/></svg>;
      case "check":
        return <svg {...common}><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>;
      case "warning":
        return <svg {...common}><path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/></svg>;
      case "refresh":
        return <svg {...common}><path d="M17.65 6.35A7.958 7.958 0 0 0 12 4a8 8 0 0 0-8 8 8 8 0 0 0 8 8 8 8 0 0 0 7.21-4.56l-1.78-.85A6 6 0 0 1 12 18a6 6 0 1 1 4.22-10.22L13 11h7V4l-2.35 2.35z"/></svg>;
      case "chart":
        return <svg {...common}><path d="M3 3h2v18H3V3zm4 10h2v8H7v-8zm4-6h2v14h-2V7zm4 3h2v11h-2V10zm4-7h2v18h-2V3z"/></svg>;
      case "trophy":
        return <svg {...common}><path d="M5 4h14v2h2v3a4 4 0 0 1-4 4h-.2A6 6 0 0 1 13 17.4V19h3v2H8v-2h3v-1.6A6 6 0 0 1 7.2 13H7a4 4 0 0 1-4-4V6h2V4zm-2 4a2 2 0 0 0 2 2v-4H3v2zm16-2v4a2 2 0 0 0 2-2V6h-2z"/></svg>;
      default:
        return null;
    }
  }

  function StickerBtn({ children, onClick, fill, shadow, disabled, style = {}, small }) {
    const dis = disabled ? { opacity: 0.4, cursor: "not-allowed" } : {};
    return (
      <button
        onClick={disabled ? undefined : onClick}
        style={{
          display: "inline-block", background: fill, border: "3px solid #fff", borderRadius: 999,
          padding: small ? "8px 16px" : "12px 24px", color: "#fff", fontFamily: "Fredoka, sans-serif",
          fontWeight: 700, fontSize: small ? 13 : 15, letterSpacing: 0.5, outline: "none",
          boxShadow: `0 0 0 2px ${shadow}, 0 4px 0 ${shadow}, 0 8px 12px rgba(13, 45, 82, 0.15)`,
          cursor: disabled ? "not-allowed" : "pointer", ...dis, ...style,
        }}
      >
        {children}
      </button>
    );
  }

  function Paper({ children, style = {}, accent, c }) {
    return (
      <div style={{
        background: c.paper, borderRadius: 22, padding: 20,
        boxShadow: `0 1px 0 ${c.paperEdge}, 0 2px 0 -1px ${c.paperEdge}, 0 12px 24px rgba(13, 45, 82, 0.12)`,
        position: "relative", borderTop: accent ? `5px solid ${accent}` : "none", ...style,
      }}>
        {children}
      </div>

  function QR({ data, size = 180 }) {
    // Build the query string with URLSearchParams instead of a template
    // literal with literal ampersand separators — avoids any risk of
    // WordPress's content filters mangling ampersand characters in this script.
    const params = new URLSearchParams({
      size: `${size}x${size}`,
      data: data,
      bgcolor: "FFFCF2",
      color: "0D2D52",
      format: "svg",
      margin: "2",
    });
    const url = `https://api.qrserver.com/v1/create-qr-code/?${params.toString()}`;
    return <img src={url} width={size} height={size} alt="QR" style={{ display: "block" }} />;
  }
